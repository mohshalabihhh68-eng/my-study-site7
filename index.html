<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دروسك بلس - المشغل الشامل</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      background: #ef4444;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #dc2626; }
    #status { margin: 12px 0; color: #94a3b8; font-weight: bold; }
    video {
      width: 100%;
      background: #000;
      border-radius: 12px;
      margin-top: 15px;
    }
    .lecture-section { margin-bottom: 20px; background: #334155; padding: 15px; border-radius: 8px; }
    .video-item {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 6px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body onload="loadAllLectures()">
  <div class="container">
    <h1>دروسك بلس - جميع المحاضرات</h1>

    <div class="card">
      <h3>قائمة المحاضرات والفيديوهات</h3>
      <div id="status">جاري جلب المحاضرات من السيرفر...</div>
      <div id="lecturesContainer"></div>
    </div>

    <div class="card">
      <h3>المشغل</h3>
      <video id="video" controls></video>
    </div>
  </div>

  <script>
    let hls = null;

    async function loadAllLectures() {
      const status = document.getElementById('status');
      const container = document.getElementById('lecturesContainer');

      try {
        const res = await fetch('/api/all-lectures');
        const data = await res.json();

        if (!data.success || data.data.length === 0) {
          status.innerText = 'لم يتم العثور على محاضرات.';
          return;
        }

        status.innerText = 'تم جلب جميع المحاضرات بنجاح!';
        container.innerHTML = '';

        data.data.forEach(lecture => {
          const lecDiv = document.createElement('div');
          lecDiv.className = 'lecture-section';
          
          let videosHtml = '';
          if (lecture.videos && lecture.videos.length > 0) {
            lecture.videos.forEach(video => {
              videosHtml += `
                <div class="video-item">
                  <span>${video.title}</span>
                  <button onclick="playVideo(${video.id})">تشغيل</button>
                </div>
              `;
            });
          } else {
            videosHtml = '<div style="color: #94a3b8; margin-top: 5px;">لا توجد فيديوهات في هذه المحاضرة</div>';
          }

          lecDiv.innerHTML = `<strong>محاضرة: ${lecture.lecture_name || 'بدون اسم'}</strong>` + videosHtml;
          container.appendChild(lecDiv);
        });

      } catch (err) {
        console.error(err);
        status.innerText = 'حدث خطأ أثناء الاتصال بالسيرفر';
      }
    }

    async function playVideo(videoId) {
      const video = document.getElementById('video');
      const status = document.getElementById('status');

      status.innerText = 'جاري جلب رابط تشغيل الفيديو...';

      try {
        const res = await fetch(`/api/video/${videoId}/play`, { method: 'POST' });
        const data = await res.json();

        if (!data.success) {
          status.innerText = 'فشل: ' + (data.message || 'خطأ');
          return;
        }

        const streamUrl = data.data.stream_url;
        const token = data.data.token;

        status.innerText = 'جاري تشغيل الفيديو...';

        if (hls) {
          hls.destroy();
          hls = null;
        }

        if (Hls.isSupported()) {
          hls = new Hls({
            xhrSetup: function (xhr) {
              xhr.setRequestHeader('Authorization', 'Bearer ' + token);
            }
          });
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            status.innerText = 'الفيديو يعمل الآن';
            video.play();
          });
          hls.on(Hls.Events.ERROR, function (event, data) {
            console.error(data);
            status.innerText = 'حدث خطأ أثناء التشغيل';
          });
        } else {
          video.src = streamUrl;
          status.innerText = 'الفيديو يعمل الآن';
          video.play();
        }

      } catch (err) {
        console.error(err);
        status.innerText = 'حدث خطأ في الاتصال';
      }
    }
  </script>
</body>
</html>
