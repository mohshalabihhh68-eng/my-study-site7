<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>منصة التعلم</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <style>
    :root {
      --bg: #0b0d12;
      --card: #151922;
      --border: #252a36;
      --primary: #5b8def;
      --accent: #2dd4a8;
      --text: #eef0f4;
      --muted: #8b93a7;
      --danger: #ff5c7a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }

    /* Login */
    #login-view {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
    }
    .login-card h1 { text-align: center; font-size: 1.35rem; margin-bottom: 6px; }
    .login-card .sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 22px; }
    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f1218;
      color: var(--text);
      font-size: 1.05rem;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 1px;
    }
    input:focus { outline: none; border-color: var(--primary); }
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.9; }
    .err { color: var(--danger); text-align: center; font-size: 0.9rem; margin-bottom: 10px; display: none; }

    /* App shell */
    #app-view { display: none; }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,13,18,0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .header-inner h1 { font-size: 1.05rem; }
    .header-meta { color: var(--muted); font-size: 0.8rem; }
    .btn-sm {
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
      background: #252a36;
    }

    .nav-back {
      display: none;
      margin: 12px 0 4px;
    }
    .nav-back button {
      width: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      padding: 12px 0 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .card:active { transform: scale(0.98); }
    .card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      background: #1a1f2b;
      display: block;
    }
    .card .body { padding: 10px 12px 14px; }
    .card .title { font-size: 0.95rem; font-weight: 600; }
    .card .sub { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }

    .list { padding: 8px 0 40px; }
    .list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-item:active { opacity: 0.9; }
    .list-item .t { font-weight: 600; }
    .list-item .s { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
    .chev { color: var(--muted); font-size: 1.2rem; }

    /* Player */
    #player-view {
      display: none;
      padding-bottom: 40px;
    }
    .player-wrap {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      margin-bottom: 14px;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    .player-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    .player-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
    .status {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-size: 0.95rem;
    }
    .loading { text-align: center; padding: 50px; color: var(--muted); }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-view">
    <div class="login-card">
      <h1>منصة التعلم</h1>
      <p class="sub">ادخل كود الاشتراك</p>
      <div class="err" id="login-err"></div>
      <input type="text" id="code-input" placeholder="كود 7 أرقام" maxlength="7" inputmode="numeric" pattern="[0-9]*" />
      <button onclick="doLogin()">دخول</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app-view">
    <header>
      <div class="header-inner">
        <div>
          <h1 id="user-name">طالب</h1>
          <div class="header-meta" id="user-meta"></div>
        </div>
        <button class="btn-sm" onclick="doLogout()">خروج</button>
      </div>
    </header>

    <div class="container">
      <div class="nav-back" id="nav-back">
        <button onclick="goBack()">← رجوع</button>
      </div>

      <div id="content">
        <div class="loading">جاري التحميل...</div>
      </div>

      <div id="player-view">
        <div class="player-wrap">
          <video id="video" controls playsinline></video>
        </div>
        <div class="player-title" id="player-title"></div>
        <div class="player-sub" id="player-sub"></div>
      </div>
    </div>
  </div>

<script>
  const API = window.location.origin;
  let token = localStorage.getItem("studentToken") || "";
  let student = null;
  let yearId = 4;
  let subjectIds = [];
  let stack = []; // navigation stack
  let hls = null;

  function deviceId() {
    let id = localStorage.getItem("deviceId");
    if (!id) {
      id = "web-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("deviceId", id);
    }
    return id;
  }

  function showErr(msg) {
    const el = document.getElementById("login-err");
    el.textContent = msg;
    el.style.display = "block";
  }

  async function doLogin() {
    const code = document.getElementById("code-input").value.trim();
    if (!/^\d{7}$/.test(code)) {
      showErr("الكود لازم يكون 7 أرقام");
      return;
    }
    try {
      const r = await fetch(API + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          code,
          deviceId: deviceId(),
          deviceName: navigator.userAgent.slice(0, 60)
        })
      });
      const data = await r.json();
      if (!data.success) {
        showErr(data.message || "فشل الدخول");
        return;
      }
      token = data.data.token;
      student = data.data.student;
      yearId = data.data.yearId || 4;
      subjectIds = data.data.subjectIds || [];
      localStorage.setItem("studentToken", token);
      localStorage.setItem("studentInfo", JSON.stringify({ student, yearId, subjectIds }));
      enterApp();
    } catch (e) {
      showErr("خطأ في الاتصال");
    }
  }

  function doLogout() {
    if (token) {
      fetch(API + "/api/auth/logout", {
        method: "POST",
        headers: { Authorization: "Bearer " + token }
      }).catch(() => {});
    }
    token = "";
    student = null;
    localStorage.removeItem("studentToken");
    localStorage.removeItem("studentInfo");
    stopPlayer();
    document.getElementById("app-view").style.display = "none";
    document.getElementById("login-view").style.display = "flex";
    document.getElementById("code-input").value = "";
  }

  function enterApp() {
    document.getElementById("login-view").style.display = "none";
    document.getElementById("app-view").style.display = "block";
    document.getElementById("user-name").textContent = student?.name || "طالب";
    const exp = student?.expiresAt ? new Date(student.expiresAt).toLocaleDateString("ar-EG") : "";
    document.getElementById("user-meta").textContent = exp ? "ينتهي: " + exp : "";
    stack = [];
    loadSubjects();
  }

  // Auto restore session
  if (token) {
    const saved = localStorage.getItem("studentInfo");
    if (saved) {
      try {
        const s = JSON.parse(saved);
        student = s.student;
        yearId = s.yearId || 4;
        subjectIds = s.subjectIds || [];
      } catch {}
    }
    fetch(API + "/api/auth/me", {
      headers: { Authorization: "Bearer " + token }
    }).then(r => r.json()).then(d => {
      if (d.success) {
        student = {
          name: d.data.name,
          code: d.data.code,
          section: d.data.section,
          expiresAt: d.data.expiresAt
        };
        yearId = d.data.yearId || yearId;
        subjectIds = d.data.subjectIds || subjectIds;
        localStorage.setItem("studentInfo", JSON.stringify({ student, yearId, subjectIds }));
        enterApp();
      } else {
        doLogout();
      }
    }).catch(() => doLogout());
  }

  function authHeaders() {
    return { Authorization: "Bearer " + token, Accept: "application/json" };
  }

  function setContent(html) {
    document.getElementById("player-view").style.display = "none";
    document.getElementById("content").style.display = "block";
    document.getElementById("content").innerHTML = html;
    document.getElementById("nav-back").style.display = stack.length ? "block" : "none";
  }

  function goBack() {
    stopPlayer();
    if (stack.length) {
      const prev = stack.pop();
      prev();
    }
  }

  // ---------- Subjects ----------
  async function loadSubjects() {
    setContent('<div class="loading">جاري تحميل المواد...</div>');
    try {
      const r = await fetch(API + "/api/subjects/" + yearId, { headers: authHeaders() });
      const data = await r.json();
      const list = data.data || [];
      if (!list.length) {
        setContent('<div class="status">مفيش مواد متاحة</div>');
        return;
      }
      let html = '<div class="grid">';
      for (const s of list) {
        const img = s.image_url || "";
        html += `<div class="card" onclick="openSubject(${s.id}, '${esc(s.name)}')">
          ${img ? `<img src="${img}" alt="" onerror="this.style.display='none'" />` : '<div style="height:80px;background:#1a1f2b"></div>'}
          <div class="body"><div class="title">${esc(s.name)}</div></div>
        </div>`;
      }
      html += "</div>";
      setContent(html);
    } catch (e) {
      setContent('<div class="status">خطأ في تحميل المواد</div>');
    }
  }

  // ---------- Teachers ----------
  window.openSubject = async function(id, name) {
    stack.push(loadSubjects);
    setContent('<div class="loading">جاري التحميل...</div>');
    try {
      const r = await fetch(API + "/api/subjects/" + id + "/teachers", { headers: authHeaders() });
      const data = await r.json();
      
      // فحص شامل لأي شكل من أشكال الرد
      let teachers = [];
      if (Array.isArray(data.data)) {
        teachers = data.data;
      } else if (data.data?.teachers) {
        teachers = data.data.teachers;
      } else if (data.data?.id) {
        teachers = [data.data];
      } else if (data.raw && Array.isArray(data.raw)) {
        teachers = data.raw;
      } else if (data.raw && Array.isArray(data.raw.teachers)) {
        teachers = data.raw.teachers;
      }

      if (!teachers.length) {
        setContent('<div class="status">لا يوجد مدرسين لهذه المادة</div>');
        return;
      }
      
      let html = `<p class="header-meta" style="margin-bottom:12px">${esc(name)}</p><div class="list">`;
      for (const t of teachers) {
        const tid = t.id || t.teacher_id;
        const tname = t.name || t.teacher_name || "مدرس";
        html += `<div class="list-item" onclick='openTeacherNav(${tid}, ${JSON.stringify(tname)}, ${id}, ${JSON.stringify(name)})'>
          <div><div class="t">${esc(tname)}</div></div>
          <span class="chev">‹</span>
        </div>`;
      }
      html += "</div>";
      setContent(html);
    } catch (e) {
      setContent('<div class="status">خطأ في التحميل</div>');
    }
  };

  // ---------- Chapters ----------
  window.openTeacherNav = async function(tid, tname, sid, sname) {
    stack.push(() => openSubject(sid, sname));
    setContent('<div class="loading">جاري التحميل...</div>');
    try {
      const r = await fetch(API + "/api/teachers/" + tid + "/chapters", { headers: authHeaders() });
      const data = await r.json();
      const chapters = Array.isArray(data.data) ? data.data : (data.data?.chapters || []);
      if (!chapters.length) {
        setContent('<div class="status">مفيش فصول</div>');
        return;
      }
      let html = `<p class="header-meta" style="margin-bottom:12px">${esc(tname)}</p><div class="list">`;
      for (const c of chapters) {
        const cname = c.name || c.title || "فصل";
        html += `<div class="list-item" onclick='openChapterNav(${c.id}, ${JSON.stringify(cname)}, ${tid}, ${JSON.stringify(tname)}, ${sid}, ${JSON.stringify(sname)})'>
          <div><div class="t">${esc(cname)}</div></div>
          <span class="chev">‹</span>
        </div>`;
      }
      html += "</div>";
      setContent(html);
    } catch {
      setContent('<div class="status">خطأ في التحميل</div>');
    }
  };

  // ---------- Lectures ----------
  window.openChapterNav = async function(cid, cname, tid, tname, sid, sname) {
    stack.push(() => openTeacherNav(tid, tname, sid, sname));
    setContent('<div class="loading">جاري التحميل...</div>');
    try {
      const r = await fetch(API + "/api/chapters/" + cid + "/lectures", { headers: authHeaders() });
      const data = await r.json();
      const lectures = Array.isArray(data.data) ? data.data : (data.data?.lectures || []);
      if (!lectures.length) {
        setContent('<div class="status">مفيش محاضرات</div>');
        return;
      }
      let html = `<p class="header-meta" style="margin-bottom:12px">${esc(cname)}</p><div class="list">`;
      for (const lec of lectures) {
        const lid = lec.id;
        const lname = lec.name || lec.title || "محاضرة";
        html += `<div class="list-item" onclick='openLecture(${lid}, ${JSON.stringify(lname)})'>
          <div><div class="t">${esc(lname)}</div></div>
          <span class="chev">▶</span>
        </div>`;
      }
      html += "</div>";
      setContent(html);
    } catch {
      setContent('<div class="status">خطأ في التحميل</div>');
    }
  };

  // ---------- Play ----------
  window.openLecture = async function(lid, lname) {
    stack.push(() => {}); // will rely on previous
    setContent('<div class="loading">جاري تجهيز المحاضرة...</div>');
    try {
      const r = await fetch(API + "/api/lectures/" + lid + "/content", { headers: authHeaders() });
      const data = await r.json();
      let videoId = null;
      const d = data.data;
      if (d?.video_id) videoId = d.video_id;
      else if (d?.id && d?.type === "video") videoId = d.id;
      else if (Array.isArray(d)) {
        const v = d.find(x => x.video_id || x.type === "video" || x.stream);
        videoId = v?.video_id || v?.id;
      } else if (d?.contents) {
        const v = d.contents.find(x => x.video_id || x.type === "video");
        videoId = v?.video_id || v?.id;
      }

      if (!videoId) videoId = lid;
      await playVideo(videoId, lname);
    } catch (e) {
      setContent('<div class="status">مش قادر أحمل المحتوى</div>');
    }
  };

  async function playVideo(videoId, title) {
    stopPlayer();
    document.getElementById("content").style.display = "none";
    document.getElementById("player-view").style.display = "block";
    document.getElementById("nav-back").style.display = "block";
    document.getElementById("player-title").textContent = title || "محاضرة";
    document.getElementById("player-sub").textContent = "جاري التحميل...";

    try {
      const r = await fetch(API + "/api/play/" + videoId, {
        method: "POST",
        headers: authHeaders()
      });
      const data = await r.json();
      if (!data.success || !data.data?.manifest_url) {
        document.getElementById("player-sub").textContent = data.message || "فشل التشغيل";
        return;
      }
      const manifest = API + data.data.manifest_url;
      document.getElementById("player-sub").textContent = "جاري تشغيل الفيديو...";

      const video = document.getElementById("video");
      if (Hls.isSupported()) {
        hls = new Hls({
          xhrSetup: function (xhr) {
            xhr.setRequestHeader("Authorization", "Bearer " + token);
          }
        });
        hls.loadSource(manifest);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          document.getElementById("player-sub").textContent = "";
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (data.fatal) {
            document.getElementById("player-sub").textContent = "خطأ في التشغيل";
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = manifest + (manifest.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token);
        video.addEventListener("loadedmetadata", () => {
          document.getElementById("player-sub").textContent = "";
          video.play().catch(() => {});
        });
      } else {
        document.getElementById("player-sub").textContent = "المتصفح لا يدعم التشغيل";
      }
    } catch (e) {
      document.getElementById("player-sub").textContent = "خطأ في الاتصال";
    }
  }

  function stopPlayer() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
    const video = document.getElementById("video");
    video.pause();
    video.removeAttribute("src");
    video.load();
  }

  function esc(s) {
    return String(s || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  document.getElementById("code-input").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });
</script>
</body>
</html>
