<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دروسك بلس - مشغل</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Tahoma, Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    input, button { padding: 12px 16px; font-size: 16px; border-radius: 8px; border: none; }
    input { width: 180px; background: #334155; color: white; text-align: center; }
    button { background: #ef4444; color: white; cursor: pointer; margin-right: 8px; margin-bottom: 6px; }
    button:hover { background: #dc2626; }
    button.blue { background: #2563eb; } button.blue:hover { background: #1d4ed8; }
    #status { margin: 12px 0; color: #94a3b8; font-weight: bold; }
    video { width: 100%; background: #000; border-radius: 12px; margin-top: 15px; }
    .video-list { margin-top: 15px; }
    .video-item { background: #334155; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .video-item span { flex: 1; }
    .debug-item { padding: 10px 14px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
    .debug-ok { background: #14532d; border-right: 3px solid #22c55e; }
    .debug-fail { background: #3f1d1d; border-right: 3px solid #ef4444; }
    pre { background: #0f172a; padding: 10px; border-radius: 6px; overflow: auto; font-size: 12px; max-height: 300px; direction: ltr; text-align: left; }
  </style>
</head>
<body>
  <div class="container">
    <h1>دروسك بلس - مشغل</h1>

    <div class="card">
      <h3>🎯 جلب محتوى محاضرة مباشرة</h3>
      <input type="text" id="lectureId" value="5548" placeholder="رقم المحاضرة">
      <button onclick="loadLecture()">جلب المحاضرة</button>
      <div id="status">جاهز</div>
      <div id="videoList" class="video-list"></div>
    </div>

    <div class="card">
      <h3>▶️ المشغل</h3>
      <video id="video" controls playsinline></video>
    </div>
  </div>

  <script>
    let hls = null;

    async function loadLecture() {
      const lectureId = document.getElementById('lectureId').value.trim();
      const status = document.getElementById('status');
      const videoList = document.getElementById('videoList');

      if (!lectureId) return alert('اكتب رقم المحاضرة');
      status.innerText = 'جاري جلب المحاضرة...';
      videoList.innerHTML = '';

      try {
        const res = await fetch(`/api/lectures/${lectureId}/content`);
        const data = await res.json();

        if (!data.success) {
          status.innerText = 'فشل: ' + (data.message || 'خطأ في السيرفر');
          console.error('API Error:', data);
          return;
        }

        const lecture = data.data;
        status.innerText = `المحاضرة: ${lecture.lecture_name || lectureId}`;

        if (!lecture.videos || lecture.videos.length === 0) {
          videoList.innerHTML = '<div style="color:#ef4444">مفيش فيديوهات في المحاضرة دي.</div>';
          return;
        }

        lecture.videos.forEach(video => {
          const div = document.createElement('div');
          div.className = 'video-item';
          div.innerHTML = `<span>${video.title}</span><button onclick="playVideo(${video.id})">تشغيل</button>`;
          videoList.appendChild(div);
        });

      } catch (err) {
        console.error(err);
        status.innerText = 'حصل خطأ في الاتصال بالسيرفر';
      }
    }

    async function playVideo(videoId) {
      const video = document.getElementById('video');
      const status = document.getElementById('status');

      status.innerText = 'جاري جلب رابط الفيديو...';

      try {
        const res = await fetch(`/api/video/${videoId}/play`, { method: 'POST' });
        const data = await res.json();

        if (!data.success) {
          status.innerText = 'فشل من السيرفر: ' + (data.message || 'خطأ');
          console.error('Video API Error:', data);
          return;
        }

        // هنا بناخد الرابط والتوكن
        const streamUrl = data.data.stream_url;
        const token = data.data.token;
        
        console.log('Stream URL:', streamUrl);
        console.log('Token:', token);

        status.innerText = 'جاري تجهيز المشغل...';
        video.src = ""; 

        if (hls) {
          hls.destroy();
          hls = null;
        }

        if (Hls.isSupported()) {
          hls = new Hls({
            // إضافة الهيدر عشان الـ API يقبل الفيديو
            xhrSetup: function (xhr) {
              xhr.setRequestHeader('Authorization', 'Bearer ' + token);
            }
          });
          
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            status.innerText = '✅ الفيديو شغال';
            video.play();
          });
          
          hls.on(Hls.Events.ERROR, function (event, data) {
            console.error('HLS Error:', data);
            // لو الخطأ بسبب الـ Token
            if (data.response && data.response.code === 401) {
               status.innerText = '❌ خطأ 401: التوكن مرفوض أو منتهي الصلاحية.';
            } else {
               status.innerText = '❌ خطأ في تشغيل الفيديو من المصدر. (شوف الـ Console)';
            }
          });
        } else {
          // لو المتصفح مش بيدعم Hls.js (مثل iPhone)
          video.src = streamUrl;
          video.play().catch(e => {
            console.error(e);
            status.innerText = '❌ المتصفح لا يدعم التشغيل المباشر للفيديو ده.';
          });
        }

      } catch (err) {
        console.error(err);
        status.innerText = '❌ حصل خطأ في الاتصال أثناء التشغيل';
      }
    }
  </script>
</body>
</html>
