<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>المدرسين | ثانوية club</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('thanawya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t === 'dark' ? '#070b14' : '#f8fafc');
  } catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --bg:#070b14;--card:#0f1826;--card-hover:#182338;--card-inner:#0d1424;
  --ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.10);--line-soft:rgba(255,255,255,.05);
  --blue:#3b82f6;--blue2:#60a5fa;--blue3:#2563eb;
  --nav-bg:rgba(7,11,20,.92);
  --back-btn-bg:#111a2b;--back-btn-bg-hover:#1a253a;
  --placeholder-bg:linear-gradient(135deg,#1e293b,#0f172a);
  --glow:rgba(59,130,246,.22);
}
[data-theme="light"]{
  --bg:#f0f4fc;--card:#ffffff;--card-hover:#f1f5f9;--card-inner:#f1f5f9;
  --ink:#1e293b;--muted:#64748b;--line:rgba(108,99,255,.10);--line-soft:rgba(108,99,255,.06);
  --blue:#6c63ff;--blue2:#00d4ff;--blue3:#5a52d5;
  --nav-bg:rgba(255,255,255,.92);
  --back-btn-bg:#ffffff;--back-btn-bg-hover:#f1f5f9;
  --placeholder-bg:linear-gradient(135deg,#dde4f0,#eef1f8);
  --glow:rgba(108,99,255,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif;transition:background-color .35s,color .35s;min-height:100vh;overflow-x:hidden}
button{font:inherit;cursor:pointer;outline:none;border:none}

/* bg pattern */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 55% 40% at 80% 10%,rgba(59,130,246,.07),transparent),
    radial-gradient(ellipse 40% 50% at 10% 85%,rgba(16,185,129,.05),transparent);
}
[data-theme="light"] body::before{
  background:
    radial-gradient(ellipse 55% 40% at 80% 10%,rgba(108,99,255,.07),transparent),
    radial-gradient(ellipse 40% 50% at 10% 85%,rgba(16,185,129,.04),transparent);
}

/* progress */
#scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#6c63ff,#00d4ff);width:0%;z-index:9999;transition:width .05s linear}
#scroll-progress-side{position:fixed;top:0;right:0;width:3px;background:linear-gradient(180deg,#6c63ff,#00d4ff);height:0%;z-index:9999;border-radius:0 0 0 3px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
@keyframes cardIn{from{opacity:0;transform:translateY(32px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 8px transparent}}
@keyframes floatBadge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ===== nav ===== */
.app-nav{position:sticky;top:0;z-index:40;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#6c63ff,#00d4ff);box-shadow:0 8px 26px rgba(108,99,255,.35);color:white}
.brand .logo svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-3px}
.nav-right{display:flex;align-items:center;gap:10px;margin-right:auto}
.profile-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px 6px 6px;cursor:pointer;font-weight:800;font-size:14px;color:var(--ink);transition:.2s}
.profile-btn:hover{background:var(--card-hover)}
.profile-btn .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.theme-toggle{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .25s,background .25s;padding:0}
.theme-toggle:hover{background:var(--card-hover);transform:rotate(20deg)}
.theme-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .icon-sun{display:none}.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}[data-theme="dark"] .theme-toggle .icon-moon{display:none}

/* ===== wrap ===== */
.wrap{max-width:1140px;margin:0 auto;padding:32px 20px 90px;position:relative;z-index:1}

/* back */
.back-btn{display:inline-flex;align-items:center;gap:8px;background:var(--back-btn-bg);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:10px 20px;font-weight:700;font-size:14px;transition:background .2s,border-color .2s,transform .2s;margin-bottom:28px}
.back-btn:hover{background:var(--back-btn-bg-hover);border-color:rgba(108,99,255,.25);transform:translateX(4px)}
.back-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* page head */
.page-head{margin-bottom:36px;animation:fadeUp .5s ease}
.page-head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(108,99,255,.10);color:var(--blue);border:1px solid rgba(108,99,255,.2);border-radius:999px;padding:6px 14px;font-size:11px;font-weight:800;margin-bottom:12px}
.page-head h1{margin:0 0 6px;font-size:clamp(24px,3vw,32px);font-weight:900;color:var(--ink)}
.page-head p{margin:0;color:var(--muted);font-size:14px}

/* ===== GRID ===== */
.teachers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}

/* ===== CARD ===== */
.t-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  display:flex;flex-direction:column;
  position:relative;
  opacity:0;
  transition:border-color .3s,box-shadow .4s;
  /* will-change set by JS on hover */
}
.t-card.in{
  animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:var(--delay,0ms);
}
.t-card:hover{
  border-color:rgba(108,99,255,.4);
  box-shadow:0 24px 56px rgba(108,99,255,.18), 0 0 0 1px rgba(108,99,255,.12);
}

/* ===== image area ===== */
.t-img{
  width:100%;
  aspect-ratio:3/3.5;
  background:var(--placeholder-bg);
  overflow:hidden;
  position:relative;
}
.t-img img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:top center;
  display:block;
  transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .4s;
  filter:saturate(.9);
}
.t-card:hover .t-img img{
  transform:scale(1.08) translateY(-3px);
  filter:saturate(1.1);
}

/* gradient overlay */
.t-img-overlay{
  position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    transparent 30%,
    rgba(7,11,20,.3) 65%,
    rgba(7,11,20,.85) 100%
  );
  transition:opacity .4s;
}
[data-theme="light"] .t-img-overlay{
  background:linear-gradient(
    to bottom,
    transparent 40%,
    rgba(15,24,41,.18) 70%,
    rgba(15,24,41,.6) 100%
  );
}

/* name on image */
.t-name-over{
  position:absolute;bottom:0;left:0;right:0;
  padding:16px 18px 14px;
  z-index:2;
}
.t-name-over h3{
  margin:0;font-size:18px;font-weight:900;color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
  line-height:1.3;
  transform:translateY(4px);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.t-card:hover .t-name-over h3{transform:translateY(0)}

/* side bar */
.side-progress-bar{position:absolute;top:0;bottom:0;left:0;width:4px;background:rgba(0,0,0,.08);z-index:5;border-radius:0}
.side-progress-bar .fill{position:absolute;top:0;left:0;width:100%;height:0%;background:linear-gradient(180deg,#10b981,#34d399);box-shadow:0 0 10px rgba(52,211,153,.7);transition:height .65s cubic-bezier(.2,.8,.2,1);border-radius:0}

/* ===== card footer ===== */
.t-footer{
  padding:14px 16px 16px;
  display:flex;flex-direction:column;gap:12px;
  background:var(--card);
  position:relative;
}
.t-footer::before{
  content:"";position:absolute;top:0;left:16px;right:16px;height:1px;
  background:var(--line);
}

/* meta row */
.t-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.14);
  color:var(--blue);border-radius:999px;padding:4px 11px;
  font-size:11px;font-weight:800;
  transition:background .2s,border-color .2s;
}
.t-card:hover .meta-pill{background:rgba(108,99,255,.14);border-color:rgba(108,99,255,.28)}
.meta-pill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* CTA */
.t-btn{
  width:100%;padding:11px 16px;
  border-radius:13px;
  font-weight:900;font-size:14px;
  color:#fff;
  background:linear-gradient(130deg,var(--blue3) 0%,var(--blue) 50%,var(--blue2) 100%);
  background-size:200% 200%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px var(--glow);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,filter .25s;
  position:relative;overflow:hidden;
}
.t-btn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  transform:translateX(-100%);
  transition:transform .5s;
}
.t-btn:hover::before{transform:translateX(100%)}
.t-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 28px var(--glow);
  animation:gradientShift 2s ease infinite;
  filter:brightness(1.06);
}
.t-btn:active{transform:translateY(0);box-shadow:0 4px 12px var(--glow)}
.t-btn svg{width:15px;height:15px;fill:currentColor;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.t-btn:hover svg{transform:translateX(-5px)}

/* ===== placeholder ===== */
.ph-wrap{
  width:100%;height:100%;
  display:grid;place-items:center;
  background:var(--placeholder-bg);
}
.ph-wrap svg{opacity:.35}

/* ===== skeleton ===== */
.sk-card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.sk-img{width:100%;aspect-ratio:3/3.5;background:linear-gradient(90deg,var(--card-inner) 25%,var(--card-hover) 50%,var(--card-inner) 75%);background-size:600px 100%;animation:shimmer 1.5s infinite linear}
.sk-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px}
.sk-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--card-inner) 25%,var(--card-hover) 50%,var(--card-inner) 75%);background-size:600px 100%;animation:shimmer 1.5s .2s infinite linear}
.sk-line.h{width:60%;height:16px}.sk-line.sm{width:35%}.sk-line.btn{height:40px;border-radius:12px;margin-top:4px}

/* loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px;color:var(--muted)}
.spinner{width:38px;height:38px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:12px}

/* ===== responsive ===== */
@media(max-width:700px){
  .teachers-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .t-name-over h3{font-size:14px}
  .t-btn{font-size:13px;padding:10px}
  .brand small{display:none}
  .wrap{padding:20px 12px 80px}
}
@media(max-width:420px){
  .teachers-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="scroll-progress"></div>
<div id="scroll-progress-side"></div>

<header class="app-nav"><div class="app-nav-in">
  <div class="brand" onclick="window.location.href='index.html'">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
    <span>ثانوية <span style="color:var(--blue)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
  </div>
  <div class="nav-right">
    <button type="button" class="profile-btn" onclick="window.location.href='profile.html'"><span class="av" id="nav-av">?</span><span id="nav-name">—</span></button>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="تبديل الثيم">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</div></header>

<main class="wrap" id="main">
  <div class="loading"><div class="spinner"></div><p>جاري تحميل المدرسين...</p></div>
</main>

<script>
(function(){
'use strict';
const API_BASE='', TOKEN_KEY='student_token', token=localStorage.getItem(TOKEN_KEY);
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const subjectId=qs.get('subjectId');
const subjectName=qs.get('subjectName')||'';

const HIDDEN_TEACHERS=['عبدالله الحبشي'];

const progressBar=$('scroll-progress'), progressBarSide=$('scroll-progress-side');
let scrollTicking=false;
window.addEventListener('scroll',()=>{
  if(scrollTicking)return;
  scrollTicking=true;
  requestAnimationFrame(()=>{
    const p=document.documentElement.scrollHeight-window.innerHeight;
    const pct=p>0?(scrollY/p)*100:0;
    if(progressBar)progressBar.style.width=pct+'%';
    if(progressBarSide)progressBarSide.style.height=pct+'%';
    scrollTicking=false;
  });
},{passive:true});

const api=async(path,opts={})=>{
  const headers={Accept:'application/json',...opts.headers};
  if(token)headers['Authorization']='Bearer '+token;
  const res=await fetch(API_BASE+path,{method:opts.method||'GET',headers,body:opts.body});
  if(res.status===401){localStorage.removeItem(TOKEN_KEY);window.location.replace('login.html');return;}
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data.success===false)throw new Error(data.message||data.error||'خطأ في السيرفر');
  return data.data;
};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const normalizeName=(name)=>String(name||'')
  .replace(/[\u064B-\u0652\u0640]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
  .replace(/ؤ/g,'و').replace(/ئ/g,'ي')
  .replace(/[^\p{L}\p{N}\s]/gu,'')
  .replace(/\s+/g,'').toLowerCase().trim();

const HIDDEN_KEYWORDS=['عبداللهالحبشي'];
const isHiddenTeacher=name=>{
  const n=normalizeName(name);
  return HIDDEN_KEYWORDS.some(k=>n.includes(k))||HIDDEN_TEACHERS.some(h=>normalizeName(h)===n);
};

window.goToChapters=function(url,cardEl){
  const fill=cardEl.querySelector('.side-progress-bar .fill');
  if(fill)fill.style.height='100%';
  setTimeout(()=>{window.location.href=url;},680);
};

// reveal on scroll
function setupReveal(){
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches){
    document.querySelectorAll('.t-card').forEach(el=>el.classList.add('in'));
    return;
  }
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(!e.isIntersecting)return;
      e.target.classList.add('in');
      io.unobserve(e.target);
    });
  },{threshold:.08,rootMargin:'0px 0px -20px 0px'});
  document.querySelectorAll('.t-card').forEach(el=>io.observe(el));
}

async function load(){
  if(!subjectId){
    $('main').innerHTML='<div style="text-align:center;padding:50px">معرف المادة غير موجود.</div>';
    return;
  }
  try{
    const data=await api('/api/subjects/'+subjectId+'/teachers');
    let teachers=data.teachers||data||[];
    const before=teachers.length;
    teachers=teachers.filter(t=>!isHiddenTeacher(t.name));
    console.log('[filter] before:',before,'after:',teachers.length,teachers.map(t=>t.name));

    if(!teachers.length){
      $('main').innerHTML='<div style="text-align:center;padding:50px;color:var(--muted)">لا يوجد مدرسين مضافين.</div>';
      return;
    }

    let html=`
    <button class="back-btn" onclick="window.location.href='subjects.html'">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>رجوع للمواد
    </button>
    <div class="page-head">
      <div class="badge">المدرسين</div>
      <h1>اختر مدرسك</h1>
      <p>دول المدرسين المتاحين لمادة ${esc(subjectName)}</p>
    </div>
    <div class="teachers-grid">`;

    teachers.forEach((t,i)=>{
      const chapCount=t.chapter_count||0;
      const delay=Math.min(i*80,480);
      html+=`
      <div class="t-card" id="card-${t.id}" style="--delay:${delay}ms">
        <div class="side-progress-bar"><div class="fill"></div></div>

        <div class="t-img">
          ${t.image_url
            ?`<img src="${esc(t.image_url)}" alt="${esc(t.name)}" loading="lazy"
               onerror="this.style.display='none';this.parentElement.querySelector('.ph-wrap').style.display='grid'">`
            :''}
          <div class="ph-wrap" style="display:${t.image_url?'none':'grid'}">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
          </div>
          <div class="t-img-overlay"></div>
          <div class="t-name-over"><h3>${esc(t.name)}</h3></div>
        </div>

        <div class="t-footer">
          <div class="t-meta">
            <span class="meta-pill">
              <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              ${chapCount} فصل
            </span>
          </div>
          <button class="t-btn"
            onclick="goToChapters('chapters.html?teacherId=${t.id}&teacherName=${encodeURIComponent(t.name)}&subjectName=${encodeURIComponent(subjectName)}', document.getElementById('card-${t.id}'))">
            عرض الفصول
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>`;
    });

    html+='</div>';
    $('main').innerHTML=html;
    setupReveal();

  }catch(e){
    $('main').innerHTML=`<div style="text-align:center;color:#ef4444;padding:50px;font-weight:700">خطأ: ${esc(e.message)}</div>`;
  }
}

async function loadProfile(){
  try{
    const me=await api('/api/auth/me');
    if(me){$('nav-name').textContent=me.name||'طالب';$('nav-av').textContent=(me.name||'ط').charAt(0);}
  }catch(e){}
}

load(); loadProfile();
})();
</script>
<script src="theme.js"></script>
</body>
</html>
