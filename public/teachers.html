<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>المدرسين | ثانوية club</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('thanawya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* نفس الستايلات السابقة مع تعديل بسيط للسرعة */
:root, [data-theme="dark"]{--bg:#070b14;--card:#121a2b;--card-hover:#182338;--card-inner:#0d1424;--ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.12);--line-soft:rgba(255,255,255,.05);--blue:#3b82f6;--blue2:#60a5fa;--nav-bg:rgba(7,11,20,.88);--placeholder-bg:linear-gradient(135deg,#1e293b,#0f172a)}
[data-theme="light"]{--bg:#f8fafc;--card:#ffffff;--card-hover:#f1f5f9;--card-inner:#f1f5f9;--ink:#1e293b;--muted:#64748b;--line:rgba(108,99,255,.10);--line-soft:rgba(108,99,255,.05);--blue:#6c63ff;--blue2:#00d4ff;--nav-bg:rgba(255,255,255,.88);--placeholder-bg:linear-gradient(135deg,#e2e8f0,#f1f5f9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif}
#scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#6c63ff,#00d4ff);width:0%;z-index:9999;transition:width .1s}
#scroll-progress-side{position:fixed;top:0;right:0;width:4px;background:linear-gradient(180deg,#6c63ff,#00d4ff);height:0%;z-index:9999;transition:height .1s;border-radius:0 0 0 4px}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.app-nav{position:sticky;top:0;z-index:40;background:var(--nav-bg);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#6c63ff,#00d4ff);color:white}
.brand .logo svg{width:25px;height:25px;fill:none;stroke:currentColor}
.brand small{display:block;font-size:10px;color:var(--muted);margin-top:-3px}
.nav-right{display:flex;align-items:center;gap:10px;margin-right:auto}
.profile-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px 6px 6px;cursor:pointer;font-weight:800;font-size:14px;color:var(--ink)}
.profile-btn .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.theme-toggle{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.theme-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none}
.theme-toggle .icon-sun{display:none}.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}[data-theme="dark"] .theme-toggle .icon-moon{display:none}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 90px}
.header-action{display:flex;justify-content:flex-start;margin-bottom:20px}
.back-btn{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer}
.back-btn svg{width:18px;height:18px;stroke:currentColor}
.page-head{margin-bottom:28px}
.page-head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(108,99,255,.10);color:var(--blue);border:1px solid rgba(108,99,255,.2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;margin-bottom:10px}
.page-head h1{margin:0;font-size:28px;font-weight:900;color:var(--ink)}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.side-progress-bar{position:absolute;top:0;bottom:0;left:0;width:6px;background:rgba(0,0,0,.05);z-index:10;border-radius:0 0 0 24px}
.side-progress-bar .fill{position:absolute;top:0;left:0;width:100%;height:0%;background:linear-gradient(180deg,#10b981,#34d399,#6ee7b7);transition:height .4s;border-radius:0 0 0 24px}
.card-img{width:100%;aspect-ratio:4/3;background:var(--placeholder-bg);display:flex;align-items:center;justify-content:center;pointer-events:none}
.card-img img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.card-img .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted);background:var(--card-inner)}
.card-body{padding:20px;display:flex;flex-direction:column;flex:1;background:var(--card)}
.card-body h3{margin:0;font-size:18px;font-weight:900;margin-bottom:4px;color:var(--ink)}
.card-body .sub{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:16px}
.action-btn{width:100%;padding:12px;border-radius:14px;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;border:none}
.action-btn svg{width:16px;height:16px;fill:currentColor}
.sk-card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.sk-img{width:100%;aspect-ratio:4/3;background:linear-gradient(90deg,var(--card-inner),var(--card-hover),var(--card-inner));background-size:800px 100%;animation:shimmer 1.5s infinite linear}
.sk-body{padding:20px}
.sk-line{height:14px;border-radius:6px;margin-bottom:10px;background:linear-gradient(90deg,var(--card-inner),var(--card-hover),var(--card-inner));background-size:800px 100%;animation:shimmer 1.5s infinite linear}
.sk-line.title{width:70%;height:18px;margin-bottom:8px}
.sk-line.sub{width:40%}
.sk-line.btn{width:100%;height:40px;margin-top:16px;border-radius:14px}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.card-body{padding:16px}.card-body h3{font-size:16px}.brand small{display:none}#scroll-progress-side{width:3px}}
</style>
</head>
<body>
<div id="scroll-progress"></div><div id="scroll-progress-side"></div>
<header class="app-nav"><div class="app-nav-in">
  <div class="brand" onclick="window.location.href='index.html'">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
    <span>ثانوية <span style="color:var(--blue)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
  </div>
  <div class="nav-right">
    <div class="profile-wrap"><button type="button" class="profile-btn" onclick="window.location.href='profile.html'"><span class="av" id="nav-av">?</span><span id="nav-name">—</span></button></div>
    <button type="button" class="theme-toggle" data-theme-toggle><svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
  </div>
</div></header>
<main class="wrap" id="main">
  <div class="header-action"><button class="back-btn" onclick="window.location.href='subjects.html'"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>رجوع للمواد</button></div>
  <div class="page-head"><div class="badge">المدرسين</div><h1>اختر المدرس</h1><p>دول المدرسين المتاحين للمادة</p></div>
  <div class="grid" id="teachers-grid">
    <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line title"></div><div class="sk-line sub"></div><div class="sk-line btn"></div></div></div>
    <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line title"></div><div class="sk-line sub"></div><div class="sk-line btn"></div></div></div>
  </div>
</main>
<script>
(function(){
'use strict';
const API_BASE = '', TOKEN_KEY = 'student_token', token = localStorage.getItem(TOKEN_KEY);
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const subjectId = qs.get('subjectId');
const subjectName = qs.get('subjectName') || '';

const progressBar = $('scroll-progress');
const progressBarSide = $('scroll-progress-side');
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  if (progressBar) progressBar.style.width = progress + '%';
  if (progressBarSide) progressBarSide.style.height = progress + '%';
}, { passive: true });

const api = async (path, opts = {}) => {
  const headers = { Accept: 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { method: opts.method || 'GET', headers, body: opts.body });
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); window.location.replace('login.html'); return; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || 'خطأ');
  return data.data;
};
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

window.goToChapters = function(url, cardEl) {
  const barFill = cardEl.querySelector('.side-progress-bar .fill');
  if(barFill) barFill.style.height = '100%';
  setTimeout(() => { window.location.href = url; }, 400);
};

async function init() {
  // كاش الاسم عشان السرعة
  const cachedName = localStorage.getItem('student_name');
  if (cachedName) {
    $('nav-name').textContent = cachedName;
    $('nav-av').textContent = cachedName.charAt(0);
  }

  if (!subjectId) { $('teachers-grid').innerHTML = 'خطأ في الرابط'; return; }
  
  try {
    const [teachers, me] = await Promise.all([
      api('/api/subjects/' + subjectId + '/teachers'),
      cachedName ? Promise.resolve(null) : api('/api/auth/me').catch(()=>null)
    ]);

    if (me && me.name) {
      $('nav-name').textContent = me.name;
      $('nav-av').textContent = me.name.charAt(0);
      localStorage.setItem('student_name', me.name);
    }

    if (!teachers || !teachers.length) { $('teachers-grid').innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">لا يوجد مدرسين.</div>'; return; }
    
    $('teachers-grid').innerHTML = teachers.map(t => `
      <div class="card" id="card-${t.id}">
        <div class="side-progress-bar"><div class="fill"></div></div>
        <div class="card-img">
          ${t.image_url ? `<img src="${esc(t.image_url)}" loading="lazy" onerror="this.style.display='none'">` : ''}
          <div class="ph" style="display:${t.image_url?'none':'grid'}"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></div>
        </div>
        <div class="card-body">
          <h3>${esc(t.name)}</h3>
          <div class="sub">${t.chapter_count || 0} فصل متاح</div>
          <button class="action-btn" onclick="goToChapters('chapters.html?teacherId=${t.id}&teacherName=${encodeURIComponent(t.name)}&subjectName=${encodeURIComponent(subjectName)}', document.getElementById('card-${t.id}'))">عرض الفصول<svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    `).join('');
  } catch (e) { $('teachers-grid').innerHTML = `<div style="text-align:center;color:var(--red);padding:40px">خطأ: ${esc(e.message)}</div>`; }
}
init();
})();
</script>
<script src="theme.js"></script>
</body>
</html>
