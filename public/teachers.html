<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>المدرسين | ثانوية club</title>
<script>
(function(){
  try{
    var t=localStorage.getItem('thanawya_theme')||'light';
    document.documentElement.setAttribute('data-theme',t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',t==='dark'?'#070b14':'#f8fafc');
  }catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --bg:#070b14;--card:#0f1826;--card-hover:#182338;--card-inner:#0d1424;
  --ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.10);
  --blue:#3b82f6;--blue2:#60a5fa;--blue3:#2563eb;
  --green:#10b981;
  --nav-bg:rgba(7,11,20,.92);
  --back-bg:#0f1826;--back-bg-hover:#182338;
  --ph-bg:linear-gradient(135deg,#1a2540,#0f172a);
  --overlay:linear-gradient(to bottom,transparent 28%,rgba(7,11,20,.28) 60%,rgba(7,11,20,.88) 100%);
  --glow:rgba(59,130,246,.22);
  --card-shadow:0 4px 20px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f0f4fc;--card:#fff;--card-hover:#f1f5f9;--card-inner:#f1f5f9;
  --ink:#1e293b;--muted:#64748b;--line:rgba(108,99,255,.10);
  --blue:#6c63ff;--blue2:#00d4ff;--blue3:#5a52d5;
  --green:#059669;
  --nav-bg:rgba(255,255,255,.92);
  --back-bg:#fff;--back-bg-hover:#f1f5f9;
  --ph-bg:linear-gradient(135deg,#dde4f0,#eef1f8);
  --overlay:linear-gradient(to bottom,transparent 35%,rgba(15,24,41,.14) 65%,rgba(15,24,41,.68) 100%);
  --glow:rgba(108,99,255,.18);
  --card-shadow:0 4px 20px rgba(108,99,255,.07);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Cairo,sans-serif;
  min-height:100vh;overflow-x:hidden;
  transition:background-color .35s,color .35s;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 55% 40% at 80% 10%,rgba(59,130,246,.07),transparent),
    radial-gradient(ellipse 40% 50% at 10% 85%,rgba(16,185,129,.05),transparent);
}
[data-theme="light"] body::before{
  background:
    radial-gradient(ellipse 55% 40% at 80% 10%,rgba(108,99,255,.07),transparent),
    radial-gradient(ellipse 40% 50% at 10% 85%,rgba(16,185,129,.04),transparent);
}
button{font:inherit;cursor:pointer;outline:none;border:none}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes navIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes cardReveal{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
@keyframes gradShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes progressFill{from{height:0}to{height:var(--fill,100%)}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* progress */
#scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--blue3),var(--blue2));width:0%;z-index:9999;transition:width .05s linear}
#scroll-progress-side{position:fixed;top:0;right:0;width:3px;background:linear-gradient(180deg,var(--blue3),var(--blue2));height:0%;z-index:9999;border-radius:0 0 0 3px}

/* nav */
.app-nav{position:sticky;top:0;z-index:40;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);animation:navIn .5s ease both}
.app-nav-in{max-width:1140px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--blue3),var(--blue2));box-shadow:0 6px 20px var(--glow);color:#fff}
.brand .logo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-3px}
.nav-right{display:flex;align-items:center;gap:10px;margin-right:auto}
.profile-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;font-weight:800;font-size:14px;color:var(--ink);transition:background .2s,border-color .2s}
.profile-btn:hover{background:var(--card-hover);border-color:rgba(108,99,255,.22)}
.profile-btn .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue3),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px}
.theme-toggle{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,transform .25s;padding:0}
.theme-toggle:hover{background:var(--card-hover);border-color:rgba(108,99,255,.22);transform:rotate(18deg)}
.theme-toggle svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .icon-sun{display:none}.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}[data-theme="dark"] .theme-toggle .icon-moon{display:none}

/* wrap */
.wrap{max-width:1140px;margin:0 auto;padding:32px 20px 100px;position:relative;z-index:1}

/* back */
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--back-bg);border:1px solid var(--line);color:var(--ink);
  border-radius:13px;padding:10px 20px;font-weight:700;font-size:14px;
  transition:background .2s,border-color .2s,transform .2s;margin-bottom:28px;
}
.back-btn:hover{background:var(--back-bg-hover);border-color:rgba(108,99,255,.25);transform:translateX(4px)}
.back-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* page head */
.page-head{margin-bottom:32px;animation:cardReveal .5s ease both}
.page-head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(108,99,255,.10);color:var(--blue);border:1px solid rgba(108,99,255,.20);border-radius:999px;padding:5px 14px;font-size:11px;font-weight:800;margin-bottom:12px;letter-spacing:.01em}
.page-head h1{margin:0 0 6px;font-size:clamp(22px,3vw,30px);font-weight:900;color:var(--ink)}
.page-head p{margin:0;color:var(--muted);font-size:14px;font-weight:700}

/* grid */
.teachers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}

/* card */
.t-card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  opacity:0;
  box-shadow:var(--card-shadow);
  transition:border-color .3s,box-shadow .4s,transform .35s cubic-bezier(.2,.8,.2,1);
}
.t-card.in{
  animation:cardReveal .6s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:var(--delay,0ms);
}
.t-card:hover{
  border-color:rgba(59,130,246,.38);
  box-shadow:0 22px 48px var(--glow),0 0 0 1px rgba(59,130,246,.12);
  transform:translateY(-6px);
}
[data-theme="light"] .t-card:hover{border-color:rgba(108,99,255,.38)}

/* accent bar */
.side-bar{position:absolute;top:0;bottom:0;left:0;width:4px;background:linear-gradient(180deg,var(--blue3),var(--blue2));z-index:5}

/* image */
.t-img{
  width:100%;
  /* taller portrait to show faces fully */
  aspect-ratio:3/3.8;
  background:var(--ph-bg);
  overflow:hidden;position:relative;
}
.t-img img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center top; /* anchor at the top — shows face, not belly */
  display:block;
  transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .4s;
  filter:saturate(.92) brightness(.97);
}
.t-card:hover .t-img img{
  transform:scale(1.06) translateY(-2px);
  filter:saturate(1.08) brightness(1.01);
}

/* gradient overlay */
.t-img-overlay{
  position:absolute;inset:0;
  background:var(--overlay);
  pointer-events:none;
  transition:opacity .4s;
}

/* name on image */
.t-name-over{position:absolute;bottom:0;left:0;right:0;padding:16px 18px 14px;z-index:2}
.t-name-over h3{
  margin:0;font-size:17px;font-weight:900;color:#fff;
  text-shadow:0 2px 10px rgba(0,0,0,.55);line-height:1.3;
  transform:translateY(5px);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.t-card:hover .t-name-over h3{transform:translateY(0)}

/* side progress fill on nav */
.side-prog{position:absolute;top:0;bottom:0;left:0;width:4px;background:rgba(0,0,0,.0);z-index:6}
.side-prog .fill{
  position:absolute;top:0;left:0;width:100%;height:0;
  background:linear-gradient(180deg,var(--green),#34d399);
  box-shadow:0 0 10px rgba(52,211,153,.7);
  transition:height .65s cubic-bezier(.2,.8,.2,1);
  border-radius:0;
}

/* footer */
.t-footer{padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;background:var(--card);position:relative}
.t-footer::before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--line)}

/* meta */
.t-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.14);
  color:var(--blue);border-radius:999px;padding:4px 11px;
  font-size:11px;font-weight:800;
  transition:background .2s,border-color .2s;
}
.t-card:hover .meta-pill{background:rgba(108,99,255,.14);border-color:rgba(108,99,255,.28)}
.meta-pill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* CTA */
.t-btn{
  width:100%;padding:11px 16px;border-radius:13px;
  font-weight:900;font-size:14px;color:#fff;
  background:linear-gradient(130deg,var(--blue3) 0%,var(--blue) 50%,var(--blue2) 100%);
  background-size:200% 200%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px var(--glow);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,filter .2s;
  position:relative;overflow:hidden;
}
.t-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-100%);transition:transform .45s}
.t-btn:hover::before{transform:translateX(100%)}
.t-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--glow);filter:brightness(1.06)}
.t-btn:active{transform:translateY(0)}
.t-btn svg{width:15px;height:15px;fill:currentColor;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.t-btn:hover svg{transform:translateX(-5px)}

/* placeholder */
.ph-wrap{width:100%;height:100%;display:grid;place-items:center;background:var(--ph-bg)}
.ph-wrap svg{opacity:.3}

/* skeleton */
.sk-card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.sk-img{width:100%;aspect-ratio:3/3.8;background:linear-gradient(90deg,var(--card-inner) 25%,var(--card-hover) 50%,var(--card-inner) 75%);background-size:600px 100%;animation:shimmer 1.5s infinite linear}
.sk-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px}
.sk-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--card-inner) 25%,var(--card-hover) 50%,var(--card-inner) 75%);background-size:600px 100%;animation:shimmer 1.5s .2s infinite linear}
.sk-line.h{width:60%;height:16px}.sk-line.sm{width:35%}.sk-line.btn{height:40px;border-radius:12px;margin-top:4px}

/* loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:12px}

/* responsive */
@media(max-width:700px){
  .teachers-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .t-name-over h3{font-size:14px}
  .t-btn{font-size:13px;padding:10px}
  .brand small{display:none}
  .wrap{padding:20px 12px 80px}
}
@media(max-width:420px){
  .teachers-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="scroll-progress"></div>
<div id="scroll-progress-side"></div>

<header class="app-nav"><div class="app-nav-in">
  <div class="brand" onclick="window.location.href='index.html'">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
    <span>ثانوية <span style="color:var(--blue)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
  </div>
  <div class="nav-right">
    <button type="button" class="profile-btn" onclick="window.location.href='profile.html'">
      <span class="av" id="nav-av">?</span><span id="nav-name">—</span>
    </button>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="تبديل الثيم">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</div></header>

<main class="wrap" id="main">
  <div class="loading"><div class="spinner"></div><p>جاري تحميل المدرسين…</p></div>
</main>

<script>
(function(){
'use strict';
const API_BASE='', TOKEN_KEY='student_token', token=localStorage.getItem(TOKEN_KEY);
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const subjectId=qs.get('subjectId');
const subjectName=decodeURIComponent(qs.get('subjectName')||'');

const HIDDEN_TEACHERS=['عبدالله الحبشي'];

// progress
const pBar=$('scroll-progress'), pBarS=$('scroll-progress-side');
let tick=false;
window.addEventListener('scroll',()=>{
  if(tick)return; tick=true;
  requestAnimationFrame(()=>{
    const p=document.documentElement.scrollHeight-innerHeight;
    const pct=p>0?(scrollY/p)*100:0;
    if(pBar)pBar.style.width=pct+'%';
    if(pBarS)pBarS.style.height=pct+'%';
    tick=false;
  });
},{passive:true});

const api=async(path,opts={})=>{
  const headers={Accept:'application/json',...(opts.headers||{})};
  if(token)headers['Authorization']='Bearer '+token;
  const res=await fetch(API_BASE+path,{method:opts.method||'GET',headers,body:opts.body});
  if(res.status===401){localStorage.removeItem(TOKEN_KEY);location.replace('login.html');return;}
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data.success===false)throw new Error(data.message||data.error||'خطأ في السيرفر');
  return data.data;
};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const norm=s=>String(s||'')
  .replace(/[\u064B-\u0652\u0640]/g,'')
  .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
  .replace(/ؤ/g,'و').replace(/ئ/g,'ي')
  .replace(/[^\p{L}\p{N}\s]/gu,'')
  .replace(/\s+/g,'').toLowerCase().trim();

const HIDDEN_NORM=HIDDEN_TEACHERS.map(norm);
const isHidden=name=>HIDDEN_NORM.includes(norm(name));

window.goToChapters=function(url,cardEl){
  const fill=cardEl.querySelector('.side-prog .fill');
  if(fill)fill.style.height='100%';
  setTimeout(()=>location.href=url,680);
};

function setupReveal(){
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches){
    document.querySelectorAll('.t-card').forEach(el=>el.classList.add('in'));
    return;
  }
  const io=new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(!e.isIntersecting)return; e.target.classList.add('in'); io.unobserve(e.target); });
  },{threshold:.06,rootMargin:'0px 0px -20px 0px'});
  document.querySelectorAll('.t-card').forEach(el=>io.observe(el));
}

/*
  CHAPTER COUNT FIX
  The API returns chapter_count inflated by 1 (likely includes an intro/meta entry).
  Subtract 1, floor at 0.
*/
function displayChapCount(raw){
  const n=Number(raw||0);
  const corrected=Math.max(0, n-1);
  return corrected;
}

async function load(){
  if(!subjectId){
    $('main').innerHTML='<div style="text-align:center;padding:50px;color:var(--muted)">معرف المادة غير موجود.</div>';
    return;
  }
  try{
    const data=await api('/api/subjects/'+subjectId+'/teachers');
    let teachers=data.teachers||data||[];
    teachers=teachers.filter(t=>!isHidden(t.name));

    if(!teachers.length){
      $('main').innerHTML='<div style="text-align:center;padding:50px;color:var(--muted)">لا يوجد مدرسين مضافين.</div>';
      return;
    }

    let html=`
    <button class="back-btn" onclick="window.location.href='subjects.html'">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>رجوع للمواد
    </button>
    <div class="page-head">
      <div class="badge">المدرسين</div>
      <h1>اختر مدرسك</h1>
      <p>المدرسين المتاحين لمادة ${esc(subjectName)}</p>
    </div>
    <div class="teachers-grid">`;

    teachers.forEach((t,i)=>{
      const chapCount=displayChapCount(t.chapter_count);
      const delay=Math.min(i*80,480);
      const chapLabel=chapCount===1?'فصل واحد':chapCount===0?'لا يوجد فصول':`${chapCount} فصل`;

      html+=`
      <div class="t-card" id="card-${t.id}" style="--delay:${delay}ms">
        <div class="side-bar"></div>
        <div class="side-prog"><div class="fill"></div></div>

        <div class="t-img">
          ${t.image_url
            ?`<img
                src="${esc(t.image_url)}"
                alt="${esc(t.name)}"
                loading="${i<4?'eager':'lazy'}"
                onerror="this.style.display='none';this.closest('.t-img').querySelector('.ph-wrap').style.display='grid'">`
            :''}
          <div class="ph-wrap" style="display:${t.image_url?'none':'grid'}">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>
            </svg>
          </div>
          <div class="t-img-overlay"></div>
          <div class="t-name-over"><h3>${esc(t.name)}</h3></div>
        </div>

        <div class="t-footer">
          <div class="t-meta">
            <span class="meta-pill">
              <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              ${chapLabel}
            </span>
          </div>
          <button class="t-btn"
            onclick="goToChapters(
              'chapters.html?teacherId=${t.id}&teacherName=${encodeURIComponent(t.name)}&subjectName=${encodeURIComponent(subjectName)}',
              document.getElementById('card-${t.id}')
            )">
            عرض الفصول
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>`;
    });

    html+='</div>';
    $('main').innerHTML=html;
    setupReveal();

  }catch(e){
    $('main').innerHTML=`<div style="text-align:center;color:var(--red);padding:50px;font-weight:700">خطأ: ${esc(e.message)}</div>`;
  }
}

async function loadProfile(){
  try{
    const me=await api('/api/auth/me');
    if(me){$('nav-name').textContent=me.name||'طالب';$('nav-av').textContent=(me.name||'ط').charAt(0);}
  }catch(e){}
}

load(); loadProfile();
})();
</script>
<script src="theme.js"></script>
</body>
</html>
