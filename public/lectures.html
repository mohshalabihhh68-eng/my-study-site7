<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>المحاضرات | ثانوية club</title>
<script>
(function(){
  try{
    var t=localStorage.getItem('thanawya_theme')||'light';
    document.documentElement.setAttribute('data-theme',t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m)m.setAttribute('content',t==='dark'?'#070b14':'#f8fafc');
  }catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── tokens ──────────────────────────────────────────────── */
:root,[data-theme="dark"]{
  --bg:#070b14;--card:#121a2b;--card-hover:#182338;--card-inner:#0d1424;
  --ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.13);
  --blue:#7c74ff;--blue2:#22d3ee;--red:#ef4444;
  --nav-bg:rgba(7,11,20,.85);--shadow:0 4px 20px rgba(0,0,0,.32);
  --glow:rgba(124,116,255,.22);--ph-bg:linear-gradient(135deg,#1a2540,#0f172a);
  --bg-pattern:
    radial-gradient(circle at top right,rgba(124,116,255,.12),transparent 45%),
    radial-gradient(circle at bottom left,rgba(34,211,238,.08),transparent 40%);
}
[data-theme="light"]{
  --bg:#f0f4ff;--card:#fff;--card-hover:#f1f5f9;--card-inner:#eef2f8;
  --ink:#1e293b;--muted:#64748b;--line:rgba(108,99,255,.11);
  --blue:#6c63ff;--blue2:#00d4ff;--red:#ef4444;
  --nav-bg:rgba(255,255,255,.88);--shadow:0 4px 18px rgba(108,99,255,.09);
  --glow:rgba(108,99,255,.18);--ph-bg:linear-gradient(135deg,#dde4f0,#eef1f8);
  --bg-pattern:
    radial-gradient(circle at top right,rgba(108,99,255,.08),transparent 45%),
    radial-gradient(circle at bottom left,rgba(0,212,255,.06),transparent 40%);
}

/* ── reset ───────────────────────────────────────────────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);background-image:var(--bg-pattern);
  background-attachment:fixed;color:var(--ink);
  font-family:Cairo,system-ui,sans-serif;min-height:100vh;
  transition:background-color .35s,color .35s}
button,input{font:inherit;outline:none;border:none}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}

/* ── animations ──────────────────────────────────────────── */
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── scroll progress ─────────────────────────────────────── */
#scroll-progress{position:fixed;top:0;right:0;height:3px;width:0%;z-index:9999;
  background:linear-gradient(270deg,var(--blue),var(--blue2));transition:width .1s ease-out}

/* ── nav ─────────────────────────────────────────────────── */
.app-nav{position:sticky;top:0;z-index:40;
  padding-top:env(safe-area-inset-top,0px);
  background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1140px;margin:0 auto;padding:11px 20px;
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;
  background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 6px 20px var(--glow);color:#fff}
.brand .logo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-3px}
.nav-right{display:flex;align-items:center;gap:10px;margin-right:auto}
.profile-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  background:var(--card);border-radius:999px;padding:5px 5px 5px 16px;
  font-weight:800;font-size:14px;color:var(--ink);transition:.2s}
.profile-btn:hover{border-color:var(--blue)}
.profile-btn .av{width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px}
.theme-toggle{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0;transition:.2s}
.theme-toggle:hover{border-color:var(--blue)}
.theme-toggle svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .icon-sun{display:none}.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}[data-theme="dark"] .theme-toggle .icon-moon{display:none}

/* ── page wrapper ────────────────────────────────────────── */
.wrap{max-width:1140px;margin:0 auto;padding:28px 20px 80px}
body.leaving .wrap{opacity:0;transform:translateY(-8px);transition:opacity .26s,transform .26s}

/* ── top row ─────────────────────────────────────────────── */
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);color:var(--ink);border-radius:13px;
  padding:10px 20px;font-weight:700;font-size:14px;transition:.2s}
.back-btn:hover{border-color:var(--blue);transform:translateX(4px)}
.back-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sort-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;
  border-radius:13px;background:var(--card);border:1px solid var(--line);
  color:var(--ink);font-weight:700;font-size:13px;margin-right:auto;transition:.2s}
.sort-btn:hover{border-color:var(--blue)}
.sort-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.search-box{position:relative;flex:1;min-width:200px;max-width:300px}
.search-box svg{position:absolute;top:50%;right:13px;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.search-box input{width:100%;background:var(--card);border:1px solid var(--line);
  color:var(--ink);border-radius:13px;padding:10px 40px 10px 14px;
  font-size:14px;font-weight:700;transition:.2s}
.search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--glow)}
@media(max-width:600px){
  .search-box{max-width:none;flex-basis:100%;order:3;margin-right:0}
  .sort-btn{margin-right:0}
}

/* ── page head ───────────────────────────────────────────── */
.page-head{margin-bottom:28px;animation:rise .5s ease backwards}
.crumbs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.crumb{padding:4px 13px;border-radius:99px;font-size:12px;font-weight:800;
  color:var(--blue);
  background:color-mix(in srgb,var(--blue) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--blue) 20%,transparent)}
.page-head h1{margin:0 0 5px;font-size:clamp(22px,3vw,30px);font-weight:900;line-height:1.3}
.page-head p{margin:0;color:var(--muted);font-size:14px;font-weight:700}
.page-head p b{color:var(--ink)}

/* ── grid ────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;
  align-items:start}

/* ── card ────────────────────────────────────────────────── */
.chapter-card{
  position:relative;display:flex;flex-direction:column;gap:0;
  background:var(--card);border:1px solid var(--line);
  border-radius:22px;box-shadow:var(--shadow);
  cursor:pointer;overflow:hidden;-webkit-touch-callout:none;
  transition:transform .28s cubic-bezier(.22,.68,0,1.2),
             border-color .25s,box-shadow .25s,opacity .25s;
  animation:rise .45s ease backwards;
  animation-delay:calc(var(--i,0)*55ms);
}
.chapter-card::after{
  content:"";position:absolute;inset:0;border-radius:22px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:0;
}
.chapter-card:hover{
  transform:translateY(-7px) scale(1.012);
  border-color:color-mix(in srgb,var(--blue) 50%,transparent);
  box-shadow:0 20px 48px var(--glow),0 4px 12px rgba(0,0,0,.2);
}
.chapter-card:active{transform:scale(.985)}
.chapter-card.opening{transform:scale(.98);opacity:.9}

/* top gradient bar */
.card-bar{height:3px;background:linear-gradient(90deg,var(--blue),var(--blue2));
  opacity:0;transition:opacity .25s;flex:none}
.chapter-card:hover .card-bar{opacity:1}

/* image block */
.card-img-wrap{position:relative;height:160px;overflow:hidden;flex:none}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .4s ease;-webkit-user-drag:none;
  -webkit-user-select:none;user-select:none}
.chapter-card:hover .card-img-wrap img{transform:scale(1.05)}
.card-img-wrap .ph{width:100%;height:100%;
  background:var(--ph-bg);display:grid;place-items:center}
.card-img-wrap .ph svg{width:40px;height:40px;stroke:var(--muted);
  fill:none;stroke-width:1.5;opacity:.45}
/* gradient overlay on image */
.card-img-wrap::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,.55));
  pointer-events:none;
}
/* lecture number badge — bottom-right of image */
.lec-badge{
  position:absolute;bottom:12px;right:14px;z-index:2;
  padding:4px 12px;border-radius:99px;font-size:12px;font-weight:900;
  color:#fff;background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.18);letter-spacing:.3px;
}
/* title tag in image bottom-left */
.lec-title-overlay{
  position:absolute;bottom:12px;left:14px;right:72px;z-index:2;
  font-size:13px;font-weight:800;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.7);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  line-height:1.4;
}

/* body */
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;flex:1}

/* stats pill */
.stat-pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:12px;
  background:var(--card-inner);border:1px solid var(--line);
  font-size:13px;font-weight:800;color:var(--ink);
  align-self:flex-start;
}
.stat-pill svg{width:15px;height:15px;fill:none;stroke:var(--blue);
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stat-pill .cnt{color:var(--blue);font-size:15px;font-weight:900}
.stat-pill .lbl{color:var(--muted)}

/* sections chips (optional) */
.sec-chips{display:flex;flex-wrap:wrap;gap:6px}
.sec-chip{padding:4px 11px;border-radius:99px;font-size:11px;font-weight:800;
  color:var(--blue);background:color-mix(in srgb,var(--blue) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--blue) 18%,transparent)}

/* enter button */
.view-btn{
  width:100%;padding:13px 16px;border-radius:14px;font-size:15px;font-weight:900;
  color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));
  display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 5px 16px var(--glow);
  transition:gap .2s,filter .2s,box-shadow .2s;border:none;
}
.chapter-card:hover .view-btn{gap:14px;filter:brightness(1.08);box-shadow:0 8px 24px var(--glow)}
.view-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
  transform:scaleX(-1);transition:transform .2s}
.chapter-card:hover .view-btn svg{transform:scaleX(-1) translateX(-3px)}
.view-btn.is-loading{pointer-events:none;gap:0}
.view-btn.is-loading svg{display:none}
.view-btn.is-loading::after{content:"";width:17px;height:17px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}

/* ── skeletons ───────────────────────────────────────────── */
.sk-card{height:300px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);
  background-size:600px 100%;animation:shimmer 1.5s infinite linear}

/* ── states ──────────────────────────────────────────────── */
.state{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--muted);
  font-weight:700;display:flex;flex-direction:column;align-items:center;gap:14px}
.state.err{color:var(--red)}
.state button{padding:10px 24px;border-radius:12px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue2))}

/* ── footer ──────────────────────────────────────────────── */
.foot{text-align:center;color:var(--muted);font-weight:700;font-size:13px;
  padding:0 16px calc(28px + env(safe-area-inset-bottom,0px))}
.foot b{color:var(--blue)}

/* ── to-top ──────────────────────────────────────────────── */
.to-top{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));
  box-shadow:0 8px 22px var(--glow);opacity:0;visibility:hidden;
  transform:translateY(10px);transition:.25s;z-index:30}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top:hover{transform:translateY(-2px);box-shadow:0 12px 28px var(--glow)}

/* ── mobile tweaks ───────────────────────────────────────── */
@media(max-width:768px){
  .grid{grid-template-columns:1fr;gap:14px}
  .brand small{display:none}
  .profile-btn #nav-name{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-img-wrap{height:140px}
  .wrap{padding:20px 14px 70px}
}
@media(min-width:900px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
}
</style>
</head>
<body>
<div id="scroll-progress"></div>

<header class="app-nav"><div class="app-nav-in">
  <div class="brand" onclick="window.location.href='index.html'">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
    <span>ثانوية <span style="color:var(--blue)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
  </div>
  <div class="nav-right">
    <button type="button" class="profile-btn" onclick="window.location.href='profile.html'" aria-label="الملف الشخصي">
      <span class="av" id="nav-av">؟</span><span id="nav-name">—</span>
    </button>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="تبديل الثيم">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun"  viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</div></header>

<main class="wrap" id="main">
  <div class="top-row">
    <button class="back-btn" type="button" onclick="goBack()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>رجوع للفصول
    </button>
  </div>
  <div class="page-head">
    <div class="crumbs" id="crumbs"></div>
    <h1 id="title">المحاضرات</h1>
    <p id="sub">جاري التحميل…</p>
  </div>
  <div class="grid" id="grid">
    <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
  </div>
</main>
<footer class="foot">ثانوية <b>club</b> · مستقبلك الدراسي في مكان واحد</footer>
<button type="button" class="to-top" id="to-top" aria-label="للأعلى">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 14 6-6 6 6"/></svg>
</button>

<script>
(function(){
'use strict';
const API_BASE='',TOKEN_KEY='student_token',token=localStorage.getItem(TOKEN_KEY);
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const chapterId   =qs.get('chapterId');
const teacherId   =qs.get('teacherId')   ||'';
const teacherName =qs.get('teacherName') ||'';
const subjectName =qs.get('subjectName') ||'';
const chapterName =qs.get('chapterName') ||'';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let ALL=[],desc=false,query='';

const esc =s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,'').toLowerCase().trim();

const proxyImg=u=>{
  if(!u)return'';u=String(u);
  if(u.startsWith('/api/img'))return u;
  if(/^https?:\/\//i.test(u)){
    try{return'/api/img?u='+btoa(unescape(encodeURIComponent(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
    catch(e){return u;}
  }
  return u;
};

const api=async path=>{
  const headers={Accept:'application/json'};
  if(token)headers.Authorization='Bearer '+token;
  const res=await fetch(API_BASE+path,{headers});
  if(res.status===401){localStorage.removeItem(TOKEN_KEY);location.replace('login.html');return null;}
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data.success===false)throw new Error(data.message||data.error||'خطأ في السيرفر');
  return data.data;
};

/* ── video detection (no files, no exams) ───────────────── */
const FILE_TYPE_RE  =/^(file|pdf|document|exam|quiz|test)$/i;
const FILE_GROUP_RE =/ملف|امتحان|اختبار|pdf/i;
const FILE_ID_RE    =/^mesari_(?:file|exam)_/i;
const isVideo=it=>{
  if(!it)return false;
  const t=String(it.type||it.kind||'').toLowerCase();
  if(FILE_TYPE_RE.test(t))return false;
  if(it.is_file===true)return false;
  if(FILE_GROUP_RE.test(String(it.group||'')))return false;
  const id=String(it.video_id||it.videoId||it.mesariVideoId||it.id||'').trim();
  if(!id)return false;
  if(FILE_ID_RE.test(id))return false;
  if(/^mesari_lesson_/i.test(id)&&!it.mesariVideoId)return false;
  if(/^(mesari_|taleb_|bn_|hos_|th[pvmy]_)/i.test(id))return true;
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id))return true;
  if(/^\d{6,}$/.test(id))return true;
  return false;
};

function videoCount(l){
  if(Array.isArray(l.parts))return l.parts.filter(isVideo).length;
  if(Array.isArray(l.sections)){
    return l.sections.reduce((s,g)=>{
      if(FILE_GROUP_RE.test(String(g.title||g.name||'')))return s;
      return s+(g.items||[]).filter(isVideo).length;
    },0);
  }
  return Number(l.videos_count??l.video_count??l.parts_count??l.count??0);
}

/* video-only section chips */
function secChips(l){
  if(!Array.isArray(l.sections)||!l.sections.length)return'';
  const rows=l.sections
    .filter(g=>!FILE_GROUP_RE.test(String(g.title||g.name||'')))
    .map(g=>({name:g.title||g.name||'قسم',n:(g.items||[]).filter(isVideo).length}))
    .filter(r=>r.n>0);
  if(rows.length<2)return'';
  return'<div class="sec-chips">'+rows.slice(0,4).map(r=>`<span class="sec-chip">${esc(r.name)} · ${r.n}</span>`).join('')+'</div>';
}

/* ── back ────────────────────────────────────────────────── */
window.goBack=function(){
  if(document.referrer&&document.referrer.indexOf('chapters.html')!==-1&&history.length>1){history.back();return;}
  if(teacherId)location.href='chapters.html?teacherId='+encodeURIComponent(teacherId)+'&teacherName='+encodeURIComponent(teacherName)+'&subjectName='+encodeURIComponent(subjectName);
  else location.href='subjects.html';
};

/* ── scroll ──────────────────────────────────────────────── */
const bar=$('scroll-progress'),toTop=$('to-top');
addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?scrollY/h*100:0)+'%';
  toTop.classList.toggle('show',scrollY>500);
},{passive:true});
toTop.addEventListener('click',()=>scrollTo({top:0,behavior:reduce?'auto':'smooth'}));

/* ── card HTML ───────────────────────────────────────────── */
const PLAY_SVG='<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>';

function cardHTML(l,i){
  const raw=l.image_url||l.image||l.thumbnail||l.thumb||l.thumb_url||l.thumbnail_url||l.cover||l.poster||l.photo||'';
  const img=proxyImg(raw);
  const name=l.name||l.title||('المحاضرة '+l._n);
  const cnt=l._cnt;
  const chips=secChips(l);
  const url='player.html?lectureId='+encodeURIComponent(l.id)
    +'&lectureName='+encodeURIComponent(l.name||l.title||'')
    +'&lectureNum='+l._n
    +'&teacherName='+encodeURIComponent(teacherName)
    +'&subjectName='+encodeURIComponent(subjectName)
    +(chapterName?'&chapterName='+encodeURIComponent(chapterName):'');

  return `
  <div class="chapter-card" id="card-${esc(l.id)}" data-url="${esc(url)}"
       role="link" tabindex="0" aria-label="${esc(name)} — ادخل المحاضرة" style="--i:${Math.min(i,9)}">
    <div class="card-bar"></div>
    <div class="card-img-wrap">
      ${img
        ?`<img src="${esc(img)}" alt="" draggable="false" loading="${i<4?'eager':'lazy'}" decoding="async"
              onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`
        :''}
      <div class="ph" style="display:${img?'none':'grid'}">${PLAY_SVG}</div>
      <span class="lec-badge">المحاضرة ${l._n}</span>
      <span class="lec-title-overlay">${esc(name)}</span>
    </div>
    <div class="card-body">
      <div class="stat-pill">
        ${PLAY_SVG}<span class="cnt">${cnt||'—'}</span><span class="lbl">فيديو</span>
      </div>
      ${chips}
      <button class="view-btn" type="button" tabindex="-1">
        <span>ادخل المحاضرة</span>
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>`;
}

/* ── render + filter ─────────────────────────────────────── */
function renderGrid(list){
  const grid=$('grid');
  if(!list.length){grid.innerHTML='<div class="state">مفيش محاضرة بالاسم ده.</div>';return;}
  grid.innerHTML=list.map(cardHTML).join('');
}
function updateSub(shown){
  const total=ALL.reduce((a,l)=>a+l._cnt,0);
  const head=shown===ALL.length
    ?'<b>'+ALL.length+'</b> '+(ALL.length===1?'محاضرة':'محاضرات')
    :shown+' من '+ALL.length+' محاضرة';
  $('sub').innerHTML=head+' · <b>'+total+'</b> فيديو';
}
function view(){
  let list=query?ALL.filter(l=>norm(l.name||l.title).includes(query)):ALL.slice();
  if(desc)list.reverse();
  updateSub(list.length);renderGrid(list);
}

/* ── tools ───────────────────────────────────────────────── */
function addTools(){
  const row=document.querySelector('.top-row');
  if(ALL.length>=2){
    const b=document.createElement('button');
    b.type='button';b.className='sort-btn';b.id='sort-btn';
    b.innerHTML='<svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span>الأقدم أولًا</span>';
    row.appendChild(b);
    b.addEventListener('click',()=>{desc=!desc;b.querySelector('span').textContent=desc?'الأحدث أولًا':'الأقدم أولًا';view();});
  }
  if(ALL.length>=6){
    const box=document.createElement('div');
    box.className='search-box';
    box.innerHTML='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="l-search" autocomplete="off" placeholder="ابحث عن محاضرة…" aria-label="بحث عن محاضرة">';
    row.appendChild(box);
    let t=null;
    $('l-search').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{query=norm(e.target.value);view();},120);});
  }
}

/* ── open card ───────────────────────────────────────────── */
let navigating=false;
function openCard(card){
  if(!card||navigating)return;
  navigating=true;
  card.classList.add('opening');
  const b=card.querySelector('.view-btn');
  b.classList.add('is-loading');b.querySelector('span').textContent='جاري الدخول...';
  document.body.classList.add('leaving');
  setTimeout(()=>{location.href=card.dataset.url;},260);
}
$('grid').addEventListener('click',e=>openCard(e.target.closest('.chapter-card')));
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const c=e.target.closest&&e.target.closest('.chapter-card');
  if(c&&e.target===c){e.preventDefault();openCard(c);}
});
addEventListener('pageshow',()=>{
  navigating=false;document.body.classList.remove('leaving');
  document.querySelectorAll('.chapter-card.opening').forEach(c=>{
    c.classList.remove('opening');
    const b=c.querySelector('.view-btn');
    if(b){b.classList.remove('is-loading');b.querySelector('span').textContent='ادخل المحاضرة';}
  });
});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.card-img-wrap'))e.preventDefault();});
document.addEventListener('dragstart',e=>{if(e.target&&e.target.tagName==='IMG')e.preventDefault();});

function showError(msg){
  $('sub').textContent='';
  $('grid').innerHTML='<div class="state err"><div>تعذّر تحميل المحاضرات: '+esc(msg)+'</div><button type="button" onclick="location.reload()">إعادة المحاولة</button></div>';
}

/* ── load ────────────────────────────────────────────────── */
async function load(){
  $('crumbs').innerHTML=[subjectName,teacherName].filter(Boolean)
    .map(x=>'<span class="crumb">'+esc(x)+'</span>').join('');
  const title=chapterName||subjectName||'المحاضرات';
  $('title').textContent=title;
  document.title=title+' — المحاضرات | ثانوية club';
  if(!chapterId){
    $('sub').textContent='';
    $('grid').innerHTML=`<div class="state">معرف الفصل غير موجود.<button type="button" onclick="location.href='subjects.html'">الرجوع للمواد</button></div>`;
    return;
  }
  try{
    let lectures=await api('/api/chapters/'+encodeURIComponent(chapterId)+'/lectures');
    if(lectures===null)return;
    if(!Array.isArray(lectures))lectures=[];
    lectures=lectures.slice().sort((a,b)=>{
      const an=Number(a.lecture_num??a.lectureNum??a.order);
      const bn=Number(b.lecture_num??b.lectureNum??b.order);
      return(Number.isFinite(an)&&Number.isFinite(bn)&&an!==bn)?an-bn:0;
    });
    ALL=lectures.map((l,i)=>Object.assign({},l,{_n:i+1,_cnt:videoCount(l)}));
    if(!ALL.length){
      $('sub').textContent='';
      $('grid').innerHTML='<div class="state">لا يوجد محاضرات في هذا الفصل.</div>';
      return;
    }
    addTools();view();
  }catch(e){showError(e.message);}
}

async function loadProfile(){
  try{
    const me=await api('/api/auth/me');
    if(me){$('nav-name').textContent=me.name||'طالب';$('nav-av').textContent=(me.name||'ط').charAt(0);}
  }catch(e){}
}

load();loadProfile();
})();
</script>
<script src="theme.js"></script>
</body>
