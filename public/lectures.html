<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحاضرات</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; padding: 20px; background: #1e293b; border-radius: 12px; position: relative; }
    header h1 { color: #38bdf8; font-size: 24px; }
    header a { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #94a3b8; text-decoration: none; font-size: 14px; }
    header a:hover { color: #38bdf8; }
    #loading, #error { text-align: center; padding: 40px; font-size: 18px; }
    #error { color: #f87171; }
    .list { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .item { background: #1e293b; border-radius: 10px; padding: 16px 20px; cursor: pointer; transition: all 0.2s; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .item:hover { border-color: #38bdf8; background: #243449; }
    .item h3 { font-size: 16px; color: #e2e8f0; }
    .item .badge { background: #10b981; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">🎬 المحاضرات</h1>
    <a href="javascript:history.back()">← رجوع</a>
  </header>

  <div id="loading">⏳ جاري تحميل المحاضرات...</div>
  <div id="error" style="display:none"></div>
  <div class="list" id="list"></div>

  <script>
    const API = "";
    const params = new URLSearchParams(window.location.search);
    const chapterId = params.get("id");
    const chapterName = params.get("name") || "الفصل";

    document.getElementById("title").textContent = "🎬 محاضرات " + chapterName;

    async function loadLectures() {
      if (!chapterId) return showError("رقم الفصل غير موجود");
      try {
        const res = await fetch(`${API}/api/chapters/${chapterId}/lectures`);
        const data = await res.json();
        if (!data.success) throw new Error(data.message || "لا توجد محاضرات");

        document.getElementById("loading").style.display = "none";
        let lectures = data.data;
        if (!Array.isArray(lectures)) lectures = lectures?.lectures || [];

        if (!lectures.length) return showError("لا توجد محاضرات متاحة.");

        const list = document.getElementById("list");
        lectures.forEach(lec => {
          const item = document.createElement("div");
          item.className = "item";
          item.innerHTML = `
            <h3>${lec.name || 'محاضرة'}</h3>
            <span class="badge">▶ تشغيل</span>
          `;
          item.onclick = () => {
            window.location.href = `player.html?id=${lec.id}&name=${encodeURIComponent(lec.name || 'محاضرة')}`;
          };
          list.appendChild(item);
        });
      } catch (e) {
        showError(e.message);
      }
    }

    function showError(msg) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display = "block";
      document.getElementById("error").textContent = "❌ " + msg;
    }

    loadLectures();
  </script>
</body>
</html>
