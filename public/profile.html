<!doctype html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ملفي الشخصي | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b14;
  --card: #121a2b;
  --card-inner: #0b111d;
  --text: #f4f7ff;
  --muted: #8b9bb8;
  --orange: #ff6b35;
  --blue: #3b82f6;
  --green: #10b981;
  --purple: #8b5cf6;
  --line: rgba(148, 163, 184, .12);
}
* { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
.top { position: sticky; top: 0; z-index: 100; background: rgba(7, 11, 20, .88); backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 16px; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #60a5fa, #1d4ed8); display: grid; place-items: center; }
.btn-back { background: rgba(255,255,255,.05); border: 1px solid var(--line); color: #fff; padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 13px; }
.wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
.hero-card { background: linear-gradient(135deg, #1a1c29, #0d111c); border: 1px solid rgba(255,255,255,.05); border-radius: 24px; padding: 30px; position: relative; overflow: hidden; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
.hero-card::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 20px 20px; pointer-events: none; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
.hero-text { display: flex; flex-direction: column; gap: 8px; text-align: right; }
.badge-student { background: rgba(255, 107, 53, 0.15); color: var(--orange); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 5px; width: fit-content; margin-right: auto; }
.hero-name { font-size: 32px; font-weight: 900; margin: 0; }
.hero-desc { color: var(--muted); font-size: 14px; font-weight: 600; margin: 0; }
.avatar { width: 80px; height: 80px; border-radius: 24px; background: linear-gradient(135deg, #ff8a00, #ff4500); display: grid; place-items: center; font-size: 32px; font-weight: 900; color: #fff; box-shadow: 0 10px 30px rgba(255, 69, 0, 0.3); flex-shrink: 0; }
.grid-details { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
@media (max-width: 600px) { .grid-details { grid-template-columns: 1fr; } }
.detail-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; align-items: center; justify-content: space-between; }
.detail-info { display: flex; flex-direction: column; gap: 5px; text-align: right; }
.detail-label { color: var(--muted); font-size: 13px; font-weight: 700; }
.detail-value { font-size: 18px; font-weight: 900; }
.icon-box { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.03); }
.icon-box svg { width: 24px; height: 24px; }
.status-badge { background: rgba(16, 185, 129, 0.15); color: var(--green); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
.status-badge::before { content: ''; width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
.timer-card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 30px 20px; position: relative; overflow: hidden; }
.timer-card::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.02) 1px, transparent 1px); background-size: 20px 20px; pointer-events: none; }
.timer-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: relative; z-index: 2; }
.timer-title { display: flex; flex-direction: column; gap: 5px; text-align: right; }
.timer-title h2 { margin: 0; font-size: 22px; font-weight: 900; }
.timer-title p { margin: 0; color: var(--muted); font-size: 13px; font-weight: 600; }
.timer-badge { background: rgba(255, 107, 53, 0.15); color: var(--orange); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.timer-badge::before { content: ''; width: 6px; height: 6px; background: var(--orange); border-radius: 50%; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: .3; } 100% { opacity: 1; } }
.timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; position: relative; z-index: 2; }
.time-box { background: var(--card-inner); border: 1px solid rgba(255,255,255,.05); border-radius: 16px; padding: 15px 5px; text-align: center; }
.time-val { font-size: 32px; font-weight: 900; color: var(--orange); line-height: 1; margin-bottom: 8px; }
.time-label { color: var(--muted); font-size: 13px; font-weight: 700; }
@media (max-width: 500px) {
  .time-val { font-size: 24px; }
  .timer-grid { gap: 6px; }
  .time-box { padding: 10px 2px; border-radius: 12px; }
  .hero-name { font-size: 26px; }
  .avatar { width: 60px; height: 60px; font-size: 24px; border-radius: 18px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m8 5 11 7-11 7z"/></svg></div>ثانوية club</div>
  <a href="subjects.html" class="btn-back">← المواد</a>
</header>
<main class="wrap" id="main">
  <div style="text-align:center;padding:50px;color:var(--muted)">جاري تحميل بياناتك...</div>
</main>
<script>
(function(){
'use strict';
const API_BASE = '';
const TOKEN_KEY = 'student_token';
const TOKEN = localStorage.getItem(TOKEN_KEY);
if (!TOKEN) { window.location.replace('index.html'); return; }

const $ = id => document.getElementById(id);
let countdownInterval = null;

function formatArabicDate(ts) {
  if (!ts) return 'غير محدد';
  const d = new Date(ts);
  return new Intl.DateTimeFormat('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
}
function formatArabicTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return new Intl.DateTimeFormat('ar-EG', { hour: 'numeric', minute: '2-digit', hour12: true }).format(d);
}
function getSectionName(sec) {
  const map = { scientific_sciences: 'علمي علوم', scientific_math: 'علمي رياضة', literary: 'أدبي', azhari: 'أزهر' };
  return map[sec] || sec || 'غير محدد';
}

async function loadProfile() {
  try {
    const res = await fetch(API_BASE + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/json' }
    });
    
    // لو الجلسة اتلغت (بسبب إيقاف الكود مثلاً)
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem(TOKEN_KEY);
      window.location.replace('login.html');
      return;
    }

    const data = await res.json();
    if (!res.ok || data.success === false) throw new Error(data.message || 'فشل جلب البيانات');
    
    const me = data.data;
    const name = me.name || 'طالب';
    const firstLetter = name.charAt(0);
    const createdAt = formatArabicDate(me.expiresAt ? (me.expiresAt - 30*24*3600*1000) : Date.now());
    const expiresAt = me.expiresAt;

    let html = `
      <div class="hero-card">
        <div class="hero-top">
          <div class="avatar">${firstLetter}</div>
          <div class="hero-text">
            <span class="badge-student">👤 حساب طالب</span>
            <h1 class="hero-name">${name}</h1>
            <p class="hero-desc">أهلاً بيك في رحلة نجاحك! هنا كل تفاصيل حسابك عشان تبقى مطمن.</p>
          </div>
        </div>
      </div>
      <div class="grid-details">
        <div class="detail-card">
          <div class="detail-info">
            <span class="detail-label">المسار</span>
            <span class="detail-value">${getSectionName(me.section)}</span>
          </div>
          <div class="icon-box" style="color:var(--purple)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </div>
        </div>
        <div class="detail-card">
          <div class="detail-info">
            <span class="detail-label">كود الطالب</span>
            <span class="detail-value" style="color:var(--blue)">${me.code || '—'}</span>
          </div>
          <div class="icon-box" style="color:var(--blue)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
          </div>
        </div>
        <div class="detail-card">
          <div class="detail-info">
            <span class="detail-label">تاريخ إنشاء الحساب</span>
            <span class="detail-value">${createdAt}</span>
          </div>
          <div class="icon-box" style="color:var(--orange)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
        </div>
        <div class="detail-card">
          <div class="detail-info">
            <span class="detail-label">الحالة</span>
            <span class="status-badge">مفعل</span>
          </div>
          <div class="icon-box" style="color:var(--green)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/></svg>
          </div>
        </div>
      </div>
      <div class="timer-card">
        <div class="timer-top">
          <div class="timer-badge">العداد شغال</div>
          <div class="timer-title">
            <h2>فاضل على اشتراكك</h2>
            <p>يخلص ${formatArabicDate(expiresAt)} في ${formatArabicTime(expiresAt)} بتوقيت مصر</p>
          </div>
        </div>
        <div class="timer-grid">
          <div class="time-box"><div class="time-val" id="t-days">0</div><div class="time-label">أيام</div></div>
          <div class="time-box"><div class="time-val" id="t-hours">0</div><div class="time-label">ساعات</div></div>
          <div class="time-box"><div class="time-val" id="t-mins">0</div><div class="time-label">دقايق</div></div>
          <div class="time-box"><div class="time-val" id="t-secs">0</div><div class="time-label">ثواني</div></div>
        </div>
      </div>
    `;
    $('main').innerHTML = html;
    if (expiresAt) {
      if (countdownInterval) clearInterval(countdownInterval);
      updateCountdown(expiresAt);
      countdownInterval = setInterval(() => updateCountdown(expiresAt), 1000);
    }
  } catch (e) {
    $('main').innerHTML = `<div style="text-align:center; color:var(--red); padding:50px;">خطأ: ${e.message}</div>`;
  }
}

function updateCountdown(expiresAt) {
  const now = Date.now();
  const diff = expiresAt - now;
  if (diff <= 0) {
    document.getElementById('t-days').innerText = '0';
    document.getElementById('t-hours').innerText = '0';
    document.getElementById('t-mins').innerText = '0';
    document.getElementById('t-secs').innerText = '0';
    if (countdownInterval) clearInterval(countdownInterval);
    return;
  }
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const secs = Math.floor((diff % (1000 * 60)) / 1000);
  const elDays = document.getElementById('t-days');
  if (elDays) {
    elDays.innerText = days;
    document.getElementById('t-hours').innerText = hours;
    document.getElementById('t-mins').innerText = mins;
    document.getElementById('t-secs').innerText = secs;
  }
}
loadProfile();
})();
</script>
</body>
</html>
