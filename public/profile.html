<!doctype html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ملفي الشخصي | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--card:#121a2b;--inner:#0b111d;--text:#f4f7ff;--muted:#8b9bb8;--blue:#3b82f6;--blue2:#60a5fa;--blue3:#2563eb;--green:#10b981;--purple:#8b5cf6;--red:#ef4444;--line:rgba(148,163,184,.12)}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;background-image:radial-gradient(circle at top right,rgba(59,130,246,0.08),transparent 40%)}

/* Navbar */
.top{position:sticky;top:0;z-index:100;background:rgba(7,11,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer}
.brand .logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#5ba0ff,#2454d8);box-shadow:0 8px 26px #2563eb55;color:white}
.brand .logo svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8}
.brand small{display:block;font-size:10px;color:var(--muted);margin-top:-3px}
.btn-back{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;padding:8px 16px;border-radius:10px;font-weight:700;text-decoration:none;font-size:13px;transition:.2s}
.btn-back:active{transform:scale(.96)}

.wrap{max-width:800px;margin:0 auto;padding:20px 16px;animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.hero-card{background:linear-gradient(135deg,#142543,#0d1524);border:1px solid rgba(59,130,246,.15);border-radius:24px;padding:30px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.2);position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.03) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}
.hero-text{display:flex;flex-direction:column;gap:8px;text-align:right}
.badge-student{background:rgba(59,130,246,.15);color:var(--blue2);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;margin-right:auto}
.hero-name{font-size:32px;font-weight:900;margin:0}
.hero-desc{color:var(--muted);font-size:14px;font-weight:600;margin:0}
.avatar{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,var(--blue),var(--blue3));display:grid;place-items:center;font-size:32px;font-weight:900;color:#fff;box-shadow:0 10px 30px rgba(59,130,246,.3);border:2px solid rgba(255,255,255,.1);flex-shrink:0}

.grid-details{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}
@media(max-width:600px){.grid-details{grid-template-columns:1fr}}
.detail-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;align-items:center;justify-content:space-between;transition:transform .25s,border-color .25s}
.detail-card:hover{transform:translateY(-3px);border-color:rgba(59,130,246,.3)}
.detail-info{display:flex;flex-direction:column;gap:5px;text-align:right;min-width:0}
.detail-label{color:var(--muted);font-size:13px;font-weight:700}
.detail-value{font-size:18px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-box{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.03);flex-shrink:0}
.icon-box svg{width:24px;height:24px}
.status-badge{background:rgba(16,185,129,.15);color:var(--green);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.status-badge::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%}
.status-badge.danger{background:rgba(239,68,68,.15);color:var(--red)}
.status-badge.danger::before{background:var(--red)}

/* Timer */
.timer-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 20px;position:relative;overflow:hidden;margin-bottom:20px;transition:.3s}
.progress-bar-container{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.05);overflow:hidden}
.progress-bar-fill{height:100%;width:0%;background:var(--blue2);transition:width 1s linear,background .3s}
.timer-card.danger{border-color:rgba(239,68,68,.4);background:linear-gradient(135deg,#2a1419,#121a2b);box-shadow:0 0 20px rgba(239,68,68,.1)}
.timer-card.danger .timer-title h2{color:#fca5a5}
.timer-card.danger .time-val{color:#fca5a5;text-shadow:0 0 15px rgba(239,68,68,.5)}
.timer-card.danger .progress-bar-fill{background:var(--red)}
.timer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.timer-title h2{margin:0;font-size:22px;font-weight:900}
.timer-title p{margin:0;color:var(--muted);font-size:13px}
.timer-badge{background:rgba(59,130,246,.15);color:var(--blue2);padding:4px 12px;border-radius:20px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.timer-badge::before{content:'';width:6px;height:6px;background:var(--blue2);border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Timer Grid & Boxes */
.timer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.timer-grid.layout-2{grid-template-columns:repeat(2,1fr);max-width:300px;margin:0 auto}
.time-box{background:var(--inner);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:15px 5px;text-align:center;box-shadow:inset 0 2px 10px rgba(0,0,0,.2)}
.time-val{font-size:32px;font-weight:900;color:var(--blue2);line-height:1;margin-bottom:8px;display:inline-block;font-variant-numeric:tabular-nums}
.time-label{color:var(--muted);font-size:13px;font-weight:700}
.time-val.tick{animation:tickPulse .4s ease-out}
@keyframes tickPulse{30%{transform:scale(1.08);color:#fff;text-shadow:0 0 12px var(--blue2)}}

/* Expired & Logout */
.expired-screen{text-align:center;padding:40px 20px;background:linear-gradient(135deg,#2a1419,#121a2b);border:1px solid rgba(239,68,68,.4);border-radius:24px}
.expired-screen h2{color:#fca5a5;margin:0 0 10px}
.btn-renew{display:inline-block;background:var(--red);color:#fff;padding:14px 24px;border-radius:14px;font-weight:900;text-decoration:none;margin-top:15px}
.logout-btn{width:100%;padding:16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:16px;font-size:16px;font-weight:900;display:flex;justify-content:center;gap:8px;cursor:pointer;transition:.2s}
.logout-btn:active{transform:scale(.97)}
.code-actions{display:flex;gap:4px;align-items:center}
.code-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px}
.code-btn.success{color:var(--green)}
</style>
</head>
<body>

<header class="top">
  <div class="brand" onclick="window.location.href='index.html'">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
    <span>ثانوية <span style="color:var(--blue2)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
  </div>
  <a href="subjects.html" class="btn-back">← المواد</a>
</header>

<main class="wrap" id="main">
  <div style="text-align:center;padding:50px;color:var(--muted)">جاري التحميل...</div>
</main>

<script>
(function(){
const TOKEN = localStorage.getItem('student_token');
if (!TOKEN) { window.location.replace('login.html'); return; }

let timerInt = null, lastSec = null, curLayout = null;

function fmtDate(ts) { return new Date(ts).toLocaleDateString('ar-EG', { day:'numeric', month:'long', year:'numeric' }); }
function fmtTime(ts) { return new Date(ts).toLocaleTimeString('ar-EG', { hour:'numeric', minute:'2-digit' }); }
function getSecName(sec) { const m={scientific_sciences:'علمي علوم',scientific_math:'علمي رياضة',literary:'أدبي',azhari:'أزهر'}; return m[sec]||sec||'غير محدد'; }

function renderUI(me) {
  const name = me.name || 'طالب';
  const exp = me.expiresAt;
  const isDanger = exp && (exp - Date.now() < 3*24*3600*1000);
  const created = fmtDate(exp ? exp - 30*24*3600*1000 : Date.now());

  document.getElementById('main').innerHTML = `
    <div class="hero-card">
      <div class="hero-text">
        <span class="badge-student">👤 حساب طالب</span>
        <h1 class="hero-name">${name}</h1>
        <p class="hero-desc">أهلاً بيك! هنا تفاصيل حسابك.</p>
      </div>
      <div class="avatar">${name.charAt(0)}</div>
    </div>

    <div class="grid-details">
      <div class="detail-card">
        <div class="detail-info"><span class="detail-label">المسار</span><span class="detail-value">${getSecName(me.section)}</span></div>
        <div class="icon-box" style="color:var(--purple)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
      </div>
      <div class="detail-card">
        <div class="detail-info">
          <span class="detail-label">كود الطالب</span>
          <div class="code-actions">
            <span class="detail-value" style="color:var(--blue2)">${me.code||'—'}</span>
            <button class="code-btn" onclick="navigator.clipboard.writeText('${me.code}');this.innerHTML='<span style=color:var(--green)>✓</span>';setTimeout(()=>this.innerHTML='<svg width=16 height=16 viewBox=\\'0 0 24 24\\' fill=none stroke=currentColor stroke-width=2><rect x=9 y=9 width=13 height=13 rx=2/><path d=\\'M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\\'/></svg>',2000)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>
        <div class="icon-box" style="color:var(--blue2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg></div>
      </div>
      <div class="detail-card">
        <div class="detail-info"><span class="detail-label">تاريخ الإنشاء</span><span class="detail-value">${created}</span></div>
        <div class="icon-box" style="color:var(--blue)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      </div>
      <div class="detail-card">
        <div class="detail-info"><span class="detail-label">الحالة</span><span class="status-badge ${isDanger?'danger':''}" id="status-badge">${isDanger?'قارب على الانتهاء':'مفعل'}</span></div>
        <div class="icon-box" style="color:${isDanger?'var(--red)':'var(--green)'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/></svg></div>
      </div>
    </div>

    <div id="timer-container">
      <div class="timer-card ${isDanger?'danger':''}" id="timer-card">
        <div class="progress-bar-container"><div class="progress-bar-fill" id="progress-fill"></div></div>
        <div class="timer-top">
          <div class="timer-badge">${isDanger?'قارب على الانتهاء':'العداد شغال'}</div>
          <div class="timer-title">
            <h2>فاضل على اشتراكك</h2>
            <p>يخلص ${fmtDate(exp)} في ${fmtTime(exp)}</p>
          </div>
        </div>
        <div class="timer-grid" id="timer-grid"></div>
      </div>
    </div>

    <button class="logout-btn" onclick="if(confirm('تسجيل الخروج؟')){localStorage.clear();window.location.href='login.html'}">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      تسجيل الخروج
    </button>
  `;

  if (exp) {
    if (timerInt) clearInterval(timerInt);
    tickTimer(exp, isDanger);
    timerInt = setInterval(() => tickTimer(exp, isDanger), 1000);
  }
}

function tickTimer(exp, isDanger) {
  const diff = exp - Date.now();
  const grid = document.getElementById('timer-grid');
  const card = document.getElementById('timer-card');
  const fill = document.getElementById('progress-fill');
  if (!grid) return;

  if (diff <= 0) {
    clearInterval(timerInt);
    document.getElementById('timer-container').innerHTML = `
      <div class="expired-screen">
        <h2>انتهى الاشتراك!</h2>
        <p>جدد اشتراكك عشان تكمل مذاكرتك.</p>
        <a href="https://t.me/S7alaby7" target="_blank" class="btn-renew">جدد عبر تيليجرام</a>
      </div>
    `;
    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  const total = 30 * 86400000;
  const percent = Math.min(100, (Math.max(0, total - diff) / total) * 100);
  if (fill) fill.style.width = percent + '%';

  let layout, html;
  if (d >= 1) {
    layout = 'layout-3';
    html = `
      <div class="time-box"><div class="time-val" id="t-days">${d}</div><div class="time-label">أيام</div></div>
      <div class="time-box"><div class="time-val" id="t-hours">${h}</div><div class="time-label">ساعات</div></div>
      <div class="time-box"><div class="time-val" id="t-mins">${m}</div><div class="time-label">دقايق</div></div>
    `;
  } else if (h >= 1) {
    layout = 'layout-3';
    html = `
      <div class="time-box"><div class="time-val" id="t-hours">${h}</div><div class="time-label">ساعات</div></div>
      <div class="time-box"><div class="time-val" id="t-mins">${m}</div><div class="time-label">دقايق</div></div>
      <div class="time-box"><div class="time-val" id="t-secs">${s}</div><div class="time-label">ثواني</div></div>
    `;
    if (card) card.classList.add('danger');
  } else {
    layout = 'layout-2';
    html = `
      <div class="time-box"><div class="time-val" id="t-mins">${m}</div><div class="time-label">دقايق</div></div>
      <div class="time-box"><div class="time-val" id="t-secs">${s}</div><div class="time-label">ثواني</div></div>
    `;
    if (card) card.classList.add('danger');
  }

  if (curLayout !== layout) {
    grid.className = 'timer-grid ' + layout;
    grid.innerHTML = html;
    curLayout = layout;
  } else {
    if (d >= 1) {
      document.getElementById('t-days').innerText = d;
      document.getElementById('t-hours').innerText = h;
      document.getElementById('t-mins').innerText = m;
    } else if (h >= 1) {
      document.getElementById('t-hours').innerText = h;
      document.getElementById('t-mins').innerText = m;
      const secEl = document.getElementById('t-secs');
      secEl.innerText = s;
      if (lastSec !== s) {
        secEl.classList.remove('tick');
        void secEl.offsetWidth;
        secEl.classList.add('tick');
        lastSec = s;
      }
    } else {
      document.getElementById('t-mins').innerText = m;
      const secEl = document.getElementById('t-secs');
      secEl.innerText = s;
      if (lastSec !== s) {
        secEl.classList.remove('tick');
        void secEl.offsetWidth;
        secEl.classList.add('tick');
        lastSec = s;
      }
    }
  }
}

async function loadProfile() {
  try {
    const res = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (res.status === 401 || res.status === 403) { localStorage.clear(); window.location.replace('login.html'); return; }
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'خطأ');
    localStorage.setItem('student_data_cache', JSON.stringify(data.data));
    renderUI(data.data);
  } catch (e) {
    document.getElementById('main').innerHTML = '<div style="text-align:center;color:red;padding:50px;">خطأ: ' + e.message + '</div>';
  }
}

try {
  const cached = JSON.parse(localStorage.getItem('student_data_cache') || 'null');
  if (cached && cached.name) renderUI(cached);
} catch(e) {}
loadProfile();
})();
</script>
</body>
</html>
