<!doctype html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>ملفي الشخصي | ثانوية club</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('thanawya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t === 'dark' ? '#050810' : '#f8fafc');
  } catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============ THEME ============ */
:root, [data-theme="dark"]{
  --bg:#050810; --surface:#0b1220; --surface-2:#111a2e; --surface-3:#16203a;
  --ink:#f1f5ff; --ink-soft:#c7d2e8; --muted:#7c8db0;
  --line:rgba(148,163,184,.10); --line-strong:rgba(148,163,184,.18);
  --brand:#6366f1; --brand-2:#22d3ee; --brand-3:#818cf8;
  --green:#10b981; --amber:#f59e0b; --red:#f43f5e; --violet:#a855f7;
  --shadow-lg:0 30px 80px -30px rgba(99,102,241,.55);
  --shadow-md:0 18px 44px -18px rgba(99,102,241,.35);
  --nav-bg:rgba(5,8,16,.72);
  --orb-1:rgba(99,102,241,.35); --orb-2:rgba(34,211,238,.22); --orb-3:rgba(168,85,247,.20);
  --glass:rgba(17,26,46,.55); --glass-border:rgba(148,163,184,.10);
}
[data-theme="light"]{
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#f1f5f9; --surface-3:#e8eefb;
  --ink:#0f172a; --ink-soft:#334155; --muted:#64748b;
  --line:rgba(99,102,241,.10); --line-strong:rgba(99,102,241,.18);
  --brand:#6366f1; --brand-2:#06b6d4; --brand-3:#8b5cf6;
  --green:#10b981; --amber:#f59e0b; --red:#ef4444; --violet:#8b5cf6;
  --shadow-lg:0 30px 70px -30px rgba(99,102,241,.35);
  --shadow-md:0 16px 40px -18px rgba(99,102,241,.22);
  --nav-bg:rgba(255,255,255,.72);
  --orb-1:rgba(99,102,241,.22); --orb-2:rgba(6,182,212,.16); --orb-3:rgba(139,92,246,.16);
  --glass:rgba(255,255,255,.65); --glass-border:rgba(99,102,241,.12);
}

*{box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  min-height:100vh;padding-bottom:50px;overflow-x:hidden;
  transition:background-color .4s ease,color .4s ease;
  font-feature-settings:"ss01";
}

/* ============ AMBIENT BACKDROP ============ */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.85;animation:drift 20s ease-in-out infinite}
.orb.o1{width:600px;height:600px;top:-200px;right:-150px;background:var(--orb-1);animation-delay:0s}
.orb.o2{width:500px;height:500px;bottom:-200px;left:-150px;background:var(--orb-2);animation-delay:-7s}
.orb.o3{width:400px;height:400px;top:40%;left:40%;background:var(--orb-3);animation-delay:-14s}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(-50px,40px) scale(1.1)}
  66%{transform:translate(40px,-40px) scale(.9)}
}

/* ============ TOP NAV ============ */
.top{
  position:sticky;top:0;z-index:100;
  background:var(--nav-bg);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink);user-select:none}
.brand .logo{
  position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:15px;
  background:linear-gradient(145deg,var(--brand),var(--brand-2));
  box-shadow:0 10px 30px -6px rgba(99,102,241,.6), inset 0 1px 0 rgba(255,255,255,.35);
  color:#fff;transition:transform .35s cubic-bezier(.2,.9,.3,1.4);
}
.brand:hover .logo{transform:rotate(-8deg) scale(1.05)}
.brand .logo svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-3px;letter-spacing:.2px}
.top-right{display:flex;align-items:center;gap:9px;margin-right:auto}
.icon-btn{
  width:41px;height:41px;border-radius:13px;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(12px);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;padding:0;flex-shrink:0;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.4),background .25s,border-color .25s,box-shadow .25s;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 20px -6px rgba(99,102,241,.4)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}
[data-theme="dark"] .theme-toggle .icon-moon{display:none}
.btn-back{
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);
  color:var(--ink);padding:9px 17px;border-radius:11px;font-weight:800;cursor:pointer;
  text-decoration:none;font-size:13px;transition:all .25s;display:inline-flex;align-items:center;gap:6px;
}
.btn-back:hover{background:var(--surface-2);border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 20px -6px rgba(99,102,241,.4)}

/* ============ LAYOUT ============ */
.wrap{max-width:900px;margin:0 auto;padding:28px 16px;position:relative}

/* ============ HERO (Profile Card) ============ */
.hero{
  position:relative;overflow:hidden;margin-bottom:24px;
  border-radius:28px;
  background:linear-gradient(160deg, var(--surface), var(--surface-2));
  border:1px solid var(--line-strong);
  box-shadow:var(--shadow-lg);
  animation:riseIn .7s cubic-bezier(.2,.9,.3,1) both;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 90% 10%, rgba(99,102,241,.25), transparent 40%),
    radial-gradient(circle at 10% 90%, rgba(34,211,238,.15), transparent 40%);
  pointer-events:none;
}
[data-theme="light"] .hero::before{
  background:
    radial-gradient(circle at 90% 10%, rgba(99,102,241,.12), transparent 40%),
    radial-gradient(circle at 10% 90%, rgba(6,182,212,.08), transparent 40%);
}
.hero-inner{padding:32px 28px;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;}

/* Avatar */
.avatar-wrap{position:relative;flex-shrink:0;margin-bottom:4px;}
.avatar-ring{
  position:absolute;inset:-6px;border-radius:32px;
  background:conic-gradient(from 0deg, var(--brand), var(--brand-2), var(--violet), var(--brand));
  animation:spin 8s linear infinite;opacity:.85;
  filter:blur(1px);
}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{
  position:relative;width:90px;height:90px;border-radius:26px;
  background:linear-gradient(145deg, var(--brand), var(--brand-2));
  display:grid;place-items:center;font-size:38px;font-weight:900;color:#fff;
  box-shadow:0 16px 40px -10px rgba(99,102,241,.7), inset 0 2px 0 rgba(255,255,255,.3);
  transition:transform .4s cubic-bezier(.2,.9,.3,1.4);
  z-index:1;
}
.avatar-wrap:hover .avatar{transform:scale(1.05)}

/* Hero Typography */
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px;border-radius:100px;font-size:12px;font-weight:800;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--ink-soft);
  backdrop-filter:blur(8px);
}
[data-theme="light"] .eyebrow{background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.18);color:var(--brand)}
.hero-name{
  font-size:clamp(28px, 6vw, 38px);font-weight:900;margin:0;line-height:1.1;
  color:var(--ink);letter-spacing:-.8px;overflow-wrap:anywhere;
  background:linear-gradient(120deg, var(--ink) 20%, var(--brand-3) 50%, var(--brand-2) 80%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hero-sub{color:var(--muted);font-size:14px;font-weight:600;margin:0;max-width:420px;line-height:1.6}

/* ============ SECTION TITLE ============ */
.sec-title{
  display:flex;align-items:center;gap:9px;margin:0 4px 14px;
  font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.4px;
}
.sec-title .bar{width:3px;height:16px;border-radius:3px;background:linear-gradient(var(--brand),var(--brand-2))}
.sec-title .line{flex:1;height:1px;background:var(--line);margin-right:4px}

/* ============ DETAILS GRID ============ */
.grid-details{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
@media (max-width:600px){.grid-details{grid-template-columns:1fr}}
.detail{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:20px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  transition:all .35s cubic-bezier(.2,.9,.3,1);
  animation:riseIn .6s cubic-bezier(.2,.9,.3,1) both;
  box-shadow:0 2px 12px rgba(0,0,0,.02);
}
.detail::before{
  content:'';position:absolute;inset:0;border-radius:22px;padding:1px;
  background:linear-gradient(135deg, rgba(99,102,241,.5), transparent 40%, rgba(34,211,238,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .35s;pointer-events:none;
}
.detail:hover::before{opacity:1}
.detail:hover{transform:translateY(-4px);background:var(--surface-2);box-shadow:var(--shadow-md)}
.detail:nth-child(1){animation-delay:.06s}
.detail:nth-child(2){animation-delay:.12s}
.detail:nth-child(3){animation-delay:.18s}
.detail:nth-child(4){animation-delay:.24s}
.detail-info{display:flex;flex-direction:column;gap:5px;text-align:right;min-width:0}
.detail-label{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.2px}
.detail-value{font-size:17px;font-weight:900;color:var(--ink);overflow-wrap:anywhere;line-height:1.3}
.detail-value.brand{color:var(--brand);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.icon-box{
  width:54px;height:54px;border-radius:18px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(145deg, rgba(99,102,241,.14), rgba(34,211,238,.06));
  color:var(--brand);border:1px solid rgba(99,102,241,.14);
  transition:all .4s cubic-bezier(.2,.9,.3,1.4);
}
.detail:hover .icon-box{transform:scale(1.1) rotate(-8deg);background:linear-gradient(145deg, rgba(99,102,241,.28), rgba(34,211,238,.12))}
.icon-box svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-box.violet{color:var(--violet);background:linear-gradient(145deg,rgba(168,85,247,.14),rgba(168,85,247,.04));border-color:rgba(168,85,247,.16)}
.icon-box.cyan{color:var(--brand-2);background:linear-gradient(145deg,rgba(34,211,238,.14),rgba(34,211,238,.04));border-color:rgba(34,211,238,.16)}
.icon-box.green{color:var(--green);background:linear-gradient(145deg,rgba(16,185,129,.14),rgba(16,185,129,.04));border-color:rgba(16,185,129,.16)}
.detail:hover .icon-box.violet{background:linear-gradient(145deg,rgba(168,85,247,.28),rgba(168,85,247,.08))}
.detail:hover .icon-box.cyan{background:linear-gradient(145deg,rgba(34,211,238,.28),rgba(34,211,238,.08))}
.detail:hover .icon-box.green{background:linear-gradient(145deg,rgba(16,185,129,.28),rgba(16,185,129,.08))}

/* Status with pulse */
.status-badge{
  background:rgba(16,185,129,.13);color:var(--green);padding:6px 14px;border-radius:100px;
  font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:8px;width:fit-content;
  border:1px solid rgba(16,185,129,.28);
}
.status-badge::before{
  content:'';width:8px;height:8px;background:var(--green);border-radius:50%;
  box-shadow:0 0 10px var(--green);animation:blink 1.5s infinite;
}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* ============ SUBSCRIPTION (Progress) ============ */
.sub-card{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg, var(--surface), var(--surface-2));
  border:1px solid var(--line-strong);border-radius:26px;padding:26px 24px;
  margin-bottom:24px;box-shadow:var(--shadow-md);
  animation:riseIn .7s cubic-bezier(.2,.9,.3,1) both .1s;
}
.sub-card::before{
  content:'';position:absolute;top:-40%;left:-10%;width:65%;height:180%;
  background:radial-gradient(circle, rgba(99,102,241,.14), transparent 70%);
  pointer-events:none;
}
.sub-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:24px;position:relative;z-index:2}
.sub-title{display:flex;flex-direction:column;gap:6px;text-align:right}
.sub-title h2{margin:0;font-size:21px;font-weight:900;color:var(--ink);letter-spacing:-.3px}
.sub-title p{margin:0;color:var(--muted);font-size:13px;font-weight:600}

/* Live Counter Badge */
.live-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 15px;border-radius:100px;font-size:12px;font-weight:800;
  background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.25);
}
.live-badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1.5s infinite}

/* Progress Bar */
.progress-wrap{position:relative;z-index:2;margin-bottom:16px}
.progress-labels{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:800}
.progress-labels .start{color:var(--ink-soft)}
.progress-labels .end{color:var(--brand)}
.progress-track{
  height:14px;border-radius:100px;background:var(--surface-3);
  overflow:hidden;position:relative;border:1px solid var(--line);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.1);
}
.progress-fill{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg, var(--brand), var(--brand-2));
  box-shadow:0 0 15px rgba(34,211,238,.5);
  position:relative;transition:width 1s cubic-bezier(.2,.8,.2,1);
}
.progress-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
  animation:shine 2s infinite;
}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* Remaining Time Text */
.remaining-text{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:20px;padding:14px;border-radius:16px;
  background:var(--glass);border:1px solid var(--line);
  font-size:14px;font-weight:800;color:var(--ink-soft);
  position:relative;z-index:2;
}
.remaining-text b{color:var(--brand-2);font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.5px}

/* ============ LOGOUT ============ */
.logout{
  width:100%;padding:16px;border-radius:18px;font-size:15.5px;font-weight:900;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
  background:rgba(244,63,94,.07);border:1px solid rgba(244,63,94,.24);color:var(--red);
  transition:all .3s cubic-bezier(.2,.9,.3,1);
  animation:riseIn .7s cubic-bezier(.2,.9,.3,1) both .2s;
}
.logout:hover{background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.45);transform:translateY(-3px);box-shadow:0 16px 34px -12px rgba(244,63,94,.4)}
.logout:active{transform:translateY(0) scale(.99)}
.logout svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ============ ANIMATIONS ============ */
@keyframes riseIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

/* ============ RESPONSIVE ============ */
@media (max-width:520px){
  .wrap{padding:22px 14px}
  .hero-inner{padding:26px 20px}
  .avatar{width:76px;height:76px;font-size:32px;border-radius:22px}
  .avatar-ring{border-radius:28px}
  .sub-card{padding:22px 18px;border-radius:22px}
  .brand small{display:none}
  .detail{padding:16px;border-radius:18px}
  .detail-value{font-size:15px}
  .icon-box{width:48px;height:48px;border-radius:15px}
  .icon-box svg{width:22px;height:22px}
  .progress-labels{font-size:12px}
  .remaining-text{font-size:13px;padding:12px}
  .remaining-text b{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<!-- Ambient backdrop -->
<div class="ambient" aria-hidden="true">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
</div>

<header class="top">
  <div class="brand" onclick="window.location.href='index.html'">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
    <span>ثانوية <span style="color:var(--brand)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
  </div>
  <div class="top-right">
    <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="تبديل الثيم">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    <a href="subjects.html" class="btn-back">← المواد</a>
  </div>
</header>

<main class="wrap" id="main">
  <div style="text-align:center;padding:60px 20px;color:var(--muted);font-weight:700">جاري تحميل بياناتك...</div>
</main>

<script>
(function(){
'use strict';
const API_BASE = '', TOKEN_KEY = 'student_token', TOKEN = localStorage.getItem(TOKEN_KEY);
if (!TOKEN) { window.location.replace('login.html'); return; }
const $ = id => document.getElementById(id);
let countdownInterval = null;

function formatArabicDate(ts){if(!ts)return 'غير محدد';const d=new Date(ts);return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'long',year:'numeric'}).format(d);}
function formatArabicTime(ts){if(!ts)return '';const d=new Date(ts);return new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit',hour12:true}).format(d);}
function getSectionName(sec){const m={scientific_sciences:'علمي علوم',scientific_math:'علمي رياضة',literary:'أدبي',azhari:'أزهر'};return m[sec]||sec||'غير محدد';}

async function loadProfile() {
  try {
    const res = await fetch(API_BASE + '/api/auth/me', { headers: { 'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/json' } });
    if (res.status === 401 || res.status === 403) { localStorage.removeItem(TOKEN_KEY); window.location.replace('login.html'); return; }
    const data = await res.json();
    if (!res.ok || data.success === false) throw new Error(data.message || 'فشل جلب البيانات');
    
    const me = data.data;
    const name = me.name || 'طالب';
    const firstLetter = name.trim().charAt(0);
    const expiresAt = me.expiresAt;
    const createdAtTs = expiresAt ? (expiresAt - 30*24*3600*1000) : Date.now();
    const createdAt = formatArabicDate(createdAtTs);
    const section = getSectionName(me.section);

    const html = `
      <section class="hero">
        <div class="hero-inner">
          <div class="avatar-wrap">
            <div class="avatar-ring"></div>
            <div class="avatar">${firstLetter}</div>
          </div>
          <div class="hero-text">
            <span class="eyebrow">👤 حساب طالب</span>
            <h1 class="hero-name">${name}</h1>
            <p class="hero-sub">أهلاً بيك في رحلة نجاحك ✨ كل تفاصيل حسابك في مكان واحد.</p>
          </div>
        </div>
      </section>

      <div class="sec-title"><span class="bar"></span>بيانات الحساب<span class="line"></span></div>

      <div class="grid-details">
        <div class="detail">
          <div class="detail-info"><span class="detail-label">المسار</span><span class="detail-value">${section}</span></div>
          <div class="icon-box violet"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
        </div>
        <div class="detail">
          <div class="detail-info"><span class="detail-label">كود الطالب</span><span class="detail-value brand">${me.code || '—'}</span></div>
          <div class="icon-box cyan"><svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg></div>
        </div>
        <div class="detail">
          <div class="detail-info"><span class="detail-label">تاريخ إنشاء الحساب</span><span class="detail-value">${createdAt}</span></div>
          <div class="icon-box"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        </div>
        <div class="detail">
          <div class="detail-info"><span class="detail-label">الحالة</span><span class="status-badge">مفعل</span></div>
          <div class="icon-box green"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/></svg></div>
        </div>
      </div>

      <div class="sec-title"><span class="bar"></span>الاشتراك<span class="line"></span></div>

      <section class="sub-card">
        <div class="sub-head">
          <div class="sub-title">
            <h2>تفاصيل الاشتراك</h2>
            <p>ينتهي ${formatArabicDate(expiresAt)} في ${formatArabicTime(expiresAt)}</p>
          </div>
          <div class="live-badge"><span class="pulse"></span>العداد شغال</div>
        </div>
        
        <div class="progress-wrap">
          <div class="progress-labels">
            <span class="start">تاريخ البدء</span>
            <span class="end">تاريخ الانتهاء</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill" style="width:100%"></div>
          </div>
        </div>

        <div class="remaining-text">
          ⏳ الوقت المتبقي: <b id="t-remaining">جاري الحساب...</b>
        </div>
      </section>

      <button class="logout" id="logout-btn">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        تسجيل الخروج من الحساب
      </button>
    `;
    $('main').innerHTML = html;

    document.getElementById('logout-btn').addEventListener('click', function() {
      if(confirm('هل تريد تسجيل الخروج من الحساب؟')) { localStorage.removeItem(TOKEN_KEY); window.location.href = 'login.html'; }
    });

    if (expiresAt) {
      if (countdownInterval) clearInterval(countdownInterval);
      updateProgress(createdAtTs, expiresAt);
      countdownInterval = setInterval(() => updateProgress(createdAtTs, expiresAt), 1000);
    }
  } catch (e) {
    $('main').innerHTML = `<div style="text-align:center;color:var(--red);padding:50px;font-weight:800">خطأ: ${e.message}</div>`;
  }
}

function updateProgress(startTs, endTs) {
  const now = Date.now();
  const total = endTs - startTs;
  const passed = now - startTs;
  const remaining = endTs - now;

  if (remaining <= 0) {
    const fill = document.getElementById('progress-fill');
    const text = document.getElementById('t-remaining');
    if(fill) fill.style.width = '0%';
    if(text) text.innerText = 'انتهى الاشتراك';
    if (countdownInterval) clearInterval(countdownInterval); 
    return;
  }

  // Update Progress Bar
  let percent = (passed / total) * 100;
  if (percent < 0) percent = 0;
  if (percent > 100) percent = 100;
  
  const fill = document.getElementById('progress-fill');
  if(fill) fill.style.width = percent + '%';

  // Update Text Timer
  const days = Math.floor(remaining / 86400000);
  const hours = Math.floor((remaining % 86400000) / 3600000);
  const mins = Math.floor((remaining % 3600000) / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);

  let timeStr = '';
  if (days > 0) timeStr += `${days} يوم `;
  if (hours > 0) timeStr += `${hours} ساعة `;
  if (mins > 0) timeStr += `${mins} دقيقة `;
  timeStr += `${secs} ثانية`;

  const textEl = document.getElementById('t-remaining');
  if (textEl) textEl.innerText = timeStr.trim();
}

loadProfile();
})();
</script>
<script src="theme.js"></script>
</body>
