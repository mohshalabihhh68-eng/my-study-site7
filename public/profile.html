<!doctype html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ملفي | ثانوية club</title>
<script>
(function(){
  try{
    var t=localStorage.getItem('thanawya_theme')||'dark';
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── tokens ───────────────────────────────────────────── */
:root{
  --bg:#050d1a;
  --surface:#0d1829;
  --surface2:#111f35;
  --border:rgba(91,79,255,.14);
  --border-soft:rgba(255,255,255,.06);
  --ink:#e8edf8;
  --ink2:#8fa0be;
  --indigo:#5b4fff;
  --indigo-dim:rgba(91,79,255,.12);
  --cyan:#06c0e8;
  --cyan-dim:rgba(6,192,232,.10);
  --green:#0ecb7c;
  --green-dim:rgba(14,203,124,.12);
  --red:#f04848;
  --red-dim:rgba(240,72,72,.10);
  --nav:rgba(5,13,26,.82);
  --radius-card:22px;
  --radius-sm:14px;
  --shadow-card:0 2px 24px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f0f4fc;
  --surface:#ffffff;
  --surface2:#e8edf8;
  --border:rgba(91,79,255,.12);
  --border-soft:rgba(91,79,255,.07);
  --ink:#111827;
  --ink2:#5b6b8a;
  --indigo:#4f46e5;
  --indigo-dim:rgba(79,70,229,.10);
  --cyan:#0ea5c9;
  --cyan-dim:rgba(14,165,201,.08);
  --green:#059669;
  --green-dim:rgba(5,150,105,.09);
  --red:#dc2626;
  --red-dim:rgba(220,38,38,.08);
  --nav:rgba(240,244,252,.88);
  --shadow-card:0 2px 20px rgba(0,0,0,.08);
}

/* ── reset ────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:60px;transition:background .3s,color .3s}

/* ── nav ──────────────────────────────────────────────── */
.nav{
  position:sticky;top:0;z-index:100;
  background:var(--nav);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-soft);
  padding:12px 20px;
  display:flex;align-items:center;gap:12px;
}
.nav-logo{
  display:flex;align-items:center;gap:10px;
  font-weight:900;font-size:15px;color:var(--ink);
  cursor:pointer;text-decoration:none;
}
.nav-mark{
  width:40px;height:40px;border-radius:13px;
  background:linear-gradient(140deg,var(--indigo),var(--cyan));
  display:grid;place-items:center;
  box-shadow:0 6px 20px rgba(91,79,255,.3);
  flex-shrink:0;
}
.nav-mark svg{width:22px;height:22px;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none}
.nav-name{line-height:1.1}
.nav-name small{display:block;font-size:10px;font-weight:600;color:var(--ink2);margin-top:1px}
.nav-name em{color:var(--indigo);font-style:normal}
.nav-actions{margin-right:auto;display:flex;align-items:center;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--ink);cursor:pointer;
  display:grid;place-items:center;
  transition:background .2s,border-color .2s,transform .2s;
}
.icon-btn:hover{background:var(--surface2);border-color:var(--indigo);transform:scale(1.07)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;pointer-events:none}
.icon-btn .sun{display:none}
[data-theme="dark"] .icon-btn .sun{display:block}
[data-theme="dark"] .icon-btn .moon{display:none}
.btn-back{
  padding:7px 15px;border-radius:10px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--ink);font-size:13px;font-weight:700;
  cursor:pointer;text-decoration:none;
  transition:background .2s,border-color .2s;
  white-space:nowrap;
}
.btn-back:hover{background:var(--surface2);border-color:var(--indigo)}

/* ── layout ───────────────────────────────────────────── */
.page{max-width:680px;margin:0 auto;padding:28px 16px}

/* ── identity block ───────────────────────────────────── */
.identity{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-card);
  padding:32px 28px;
  display:flex;align-items:center;gap:22px;
  margin-bottom:16px;
  box-shadow:var(--shadow-card);
  position:relative;overflow:hidden;
}
.identity::before{
  content:'';
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 100% 0,rgba(91,79,255,.07) 0%,transparent 65%);
  pointer-events:none;
}
.avatar{
  width:72px;height:72px;border-radius:20px;
  background:linear-gradient(140deg,var(--indigo),var(--cyan));
  display:grid;place-items:center;
  font-size:30px;font-weight:900;color:#fff;
  flex-shrink:0;
  box-shadow:0 8px 24px rgba(91,79,255,.35);
  position:relative;z-index:1;
}
.id-text{position:relative;z-index:1;text-align:right}
.id-eyebrow{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:800;
  color:var(--indigo);
  background:var(--indigo-dim);
  border:1px solid rgba(91,79,255,.2);
  border-radius:20px;padding:3px 10px;
  margin-bottom:8px;
}
.id-eyebrow::before{content:'';width:5px;height:5px;background:var(--indigo);border-radius:50%}
.id-name{font-size:28px;font-weight:900;color:var(--ink);line-height:1.1;margin-bottom:4px}
.id-sub{font-size:13px;font-weight:600;color:var(--ink2)}

/* ── meta row ─────────────────────────────────────────── */
.meta-row{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  margin-bottom:16px;
}
@media(max-width:480px){.meta-row{grid-template-columns:1fr}}
.meta-cell{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:18px 20px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-card);
  transition:border-color .2s,background .2s;
}
.meta-cell:hover{border-color:rgba(91,79,255,.28);background:var(--surface2)}
.meta-label{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.meta-val{font-size:17px;font-weight:900;color:var(--ink)}
.meta-icon{
  width:42px;height:42px;border-radius:13px;
  display:grid;place-items:center;flex-shrink:0;
}
.meta-icon svg{width:21px;height:21px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.mi-indigo{background:var(--indigo-dim);color:var(--indigo)}
.mi-cyan{background:var(--cyan-dim);color:var(--cyan)}
.mi-green{background:var(--green-dim);color:var(--green)}
.pill-active{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--green-dim);color:var(--green);
  border-radius:20px;padding:4px 11px;
  font-size:13px;font-weight:800;
}
.pill-active::before{content:'';width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── countdown ────────────────────────────────────────── */
.countdown-wrap{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-card);
  padding:32px 24px 28px;
  margin-bottom:16px;
  box-shadow:var(--shadow-card);
  position:relative;overflow:hidden;
}
/* single halo — the bold element */
.countdown-wrap::before{
  content:'';
  position:absolute;
  top:-60px;left:50%;transform:translateX(-50%);
  width:400px;height:220px;
  background:radial-gradient(ellipse at center,rgba(91,79,255,.18) 0%,transparent 70%);
  pointer-events:none;
}
.cd-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;position:relative;z-index:1;
}
.cd-title{text-align:right}
.cd-title h2{font-size:20px;font-weight:900;color:var(--ink);margin-bottom:3px}
.cd-title p{font-size:12px;font-weight:600;color:var(--ink2)}
.cd-live{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:800;color:var(--cyan);
  background:var(--cyan-dim);
  border:1px solid rgba(6,192,232,.18);
  border-radius:20px;padding:5px 12px;
}
.cd-live::before{content:'';width:6px;height:6px;background:var(--cyan);border-radius:50%;animation:blink 1.6s infinite}

/* segmented display */
.cd-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
  position:relative;z-index:1;
}
.cd-unit{display:flex;flex-direction:column;align-items:center;gap:10px}
.cd-num{
  font-size:52px;font-weight:900;line-height:1;
  color:var(--ink);letter-spacing:-1px;
  font-variant-numeric:tabular-nums;
  width:100%;text-align:center;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:16px;padding:16px 4px 14px;
  transition:color .2s;
  position:relative;
}
/* colon separator between units on wide screen */
.cd-sep{
  display:none;
  align-self:center;
  font-size:40px;font-weight:900;
  color:var(--indigo);opacity:.4;
  padding-bottom:18px;
}
@media(min-width:420px){
  .cd-grid{gap:4px;align-items:end}
  .cd-sep{display:block}
  .cd-grid{grid-template-columns:1fr max-content 1fr max-content 1fr max-content 1fr}
}
.cd-label{font-size:12px;font-weight:700;color:var(--ink2)}
.cd-num.flash{animation:numFlash .5s ease}
@keyframes numFlash{0%{color:var(--cyan)}100%{color:var(--ink)}}

/* ── logout ───────────────────────────────────────────── */
.logout{
  width:100%;padding:15px;
  background:var(--red-dim);border:1px solid rgba(240,72,72,.2);
  color:var(--red);border-radius:var(--radius-sm);
  font-size:15px;font-weight:900;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;transition:background .2s,box-shadow .2s;
}
.logout:hover{background:rgba(240,72,72,.18);box-shadow:0 6px 20px rgba(240,72,72,.18)}
.logout svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}

/* ── mobile tweaks ────────────────────────────────────── */
@media(max-width:480px){
  .identity{padding:22px 18px;gap:16px}
  .avatar{width:58px;height:58px;font-size:24px;border-radius:16px}
  .id-name{font-size:22px}
  .cd-num{font-size:36px;padding:12px 2px 10px;border-radius:12px}
  .countdown-wrap{padding:24px 16px 20px}
}
</style>
</head>
<body>

<header class="nav">
  <a class="nav-logo" href="index.html">
    <span class="nav-mark">
      <svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5"/></svg>
    </span>
    <span class="nav-name">ثانوية <em>club</em><small>مستقبلك الدراسي في مكان واحد</small></span>
  </a>
  <div class="nav-actions">
    <button class="icon-btn" id="theme-btn" aria-label="تبديل الثيم">
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
    <a href="subjects.html" class="btn-back">← المواد</a>
  </div>
</header>

<main class="page" id="main">
  <div style="text-align:center;padding:60px;color:var(--ink2)">جاري تحميل بياناتك…</div>
</main>

<script>
(function(){
'use strict';

/* ── theme toggle ─────────────────────────────────────── */
document.getElementById('theme-btn').addEventListener('click',function(){
  var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('thanawya_theme',t)}catch(e){}
});

/* ── constants ────────────────────────────────────────── */
const TOKEN_KEY='student_token';
const TOKEN=localStorage.getItem(TOKEN_KEY);
if(!TOKEN){window.location.replace('login.html');return;}

let cdInterval=null, lastSec=null;

/* ── helpers ──────────────────────────────────────────── */
function arabicDate(ts){
  if(!ts)return'غير محدد';
  return new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'long',year:'numeric'}).format(new Date(ts));
}
function arabicTime(ts){
  if(!ts)return'';
  return new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(ts));
}
function sectionLabel(s){
  return({scientific_sciences:'علمي علوم',scientific_math:'علمي رياضة',literary:'أدبي',azhari:'أزهر'})[s]||s||'—';
}
function pad(n){return String(n).padStart(2,'0')}

/* ── countdown logic ──────────────────────────────────── */
function tick(exp){
  const diff=exp-Date.now();
  const el=id=>document.getElementById(id);
  if(diff<=0){
    ['cd-d','cd-h','cd-m','cd-s'].forEach(x=>{if(el(x))el(x).textContent='00'});
    clearInterval(cdInterval);return;
  }
  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  if(el('cd-d'))el('cd-d').textContent=pad(d);
  if(el('cd-h'))el('cd-h').textContent=pad(h);
  if(el('cd-m'))el('cd-m').textContent=pad(m);
  if(el('cd-s')&&lastSec!==s){
    const se=el('cd-s');
    se.textContent=pad(s);
    se.classList.remove('flash');
    void se.offsetWidth;
    se.classList.add('flash');
    lastSec=s;
  }
}

/* ── render ───────────────────────────────────────────── */
function render(me){
  const name=me.name||'طالب';
  const letter=name.charAt(0);
  const exp=me.expiresAt;

  document.getElementById('main').innerHTML=`
<div class="identity">
  <div class="avatar">${letter}</div>
  <div class="id-text">
    <span class="id-eyebrow">حساب طالب</span>
    <div class="id-name">${name}</div>
    <div class="id-sub">أهلاً بيك — رحلتك هنا</div>
  </div>
</div>

<div class="meta-row">
  <div class="meta-cell">
    <div>
      <div class="meta-label">المسار الدراسي</div>
      <div class="meta-val">${sectionLabel(me.section)}</div>
    </div>
    <div class="meta-icon mi-indigo">
      <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    </div>
  </div>
  <div class="meta-cell">
    <div>
      <div class="meta-label">كود الطالب</div>
      <div class="meta-val" style="color:var(--indigo)">${me.code||'—'}</div>
    </div>
    <div class="meta-icon mi-cyan">
      <svg viewBox="0 0 24 24"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
    </div>
  </div>
  <div class="meta-cell">
    <div>
      <div class="meta-label">تاريخ إنشاء الحساب</div>
      <div class="meta-val" style="font-size:14px">${arabicDate(exp?(exp-30*24*3600000):Date.now())}</div>
    </div>
    <div class="meta-icon mi-indigo">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
  </div>
  <div class="meta-cell">
    <div>
      <div class="meta-label">حالة الاشتراك</div>
      <div class="pill-active">مفعّل</div>
    </div>
    <div class="meta-icon mi-green">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
  </div>
</div>

<div class="countdown-wrap">
  <div class="cd-header">
    <div class="cd-live">مباشر</div>
    <div class="cd-title">
      <h2>الوقت المتبقي في اشتراكك</h2>
      <p>ينتهي ${arabicDate(exp)} — ${arabicTime(exp)}</p>
    </div>
  </div>
  <div class="cd-grid">
    <div class="cd-unit">
      <div class="cd-num" id="cd-d">00</div>
      <div class="cd-label">يوم</div>
    </div>
    <div class="cd-sep">:</div>
    <div class="cd-unit">
      <div class="cd-num" id="cd-h">00</div>
      <div class="cd-label">ساعة</div>
    </div>
    <div class="cd-sep">:</div>
    <div class="cd-unit">
      <div class="cd-num" id="cd-m">00</div>
      <div class="cd-label">دقيقة</div>
    </div>
    <div class="cd-sep">:</div>
    <div class="cd-unit">
      <div class="cd-num" id="cd-s">00</div>
      <div class="cd-label">ثانية</div>
    </div>
  </div>
</div>

<button class="logout" id="logout-btn">
  <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  تسجيل الخروج
</button>
`;

  document.getElementById('logout-btn').addEventListener('click',function(){
    if(confirm('تأكيد تسجيل الخروج؟')){
      localStorage.removeItem(TOKEN_KEY);
      window.location.href='login.html';
    }
  });

  if(exp){
    tick(exp);
    cdInterval=setInterval(()=>tick(exp),1000);
  }
}

/* ── fetch ────────────────────────────────────────────── */
async function load(){
  try{
    const res=await fetch('/api/auth/me',{
      headers:{'Authorization':'Bearer '+TOKEN,'Accept':'application/json'}
    });
    if(res.status===401||res.status===403){
      localStorage.removeItem(TOKEN_KEY);
      window.location.replace('login.html');return;
    }
    const data=await res.json();
    if(!res.ok||data.success===false)throw new Error(data.message||'فشل جلب البيانات');
    render(data.data);
  }catch(e){
    document.getElementById('main').innerHTML=
      `<div style="text-align:center;color:var(--red);padding:60px;font-weight:700">خطأ: ${e.message}</div>`;
  }
}

load();
})();
</script>
</body>
</html>
