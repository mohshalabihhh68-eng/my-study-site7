<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>الفصول | ثانوية club</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('thanawya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t === 'dark' ? '#070b14' : '#f8fafc');
  } catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#070b14;--card:#121a2b;--card-hover:#182338;--card-inner:#0d1424;--ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.14);--blue:#7c74ff;--blue2:#22d3ee;--red:#ef4444;--nav-bg:rgba(7,11,20,.85);--shadow:0 6px 22px rgba(0,0,0,.35);--glow:rgba(124,116,255,.24);--ph-bg:linear-gradient(135deg,#1a2540,#0f172a);--bg-pattern:radial-gradient(circle at top right,rgba(124,116,255,.12),transparent 45%),radial-gradient(circle at bottom left,rgba(34,211,238,.08),transparent 40%)}
[data-theme="light"]{--bg:#f8fafc;--card:#fff;--card-hover:#f1f5f9;--card-inner:#eef2f8;--ink:#1e293b;--muted:#64748b;--line:rgba(108,99,255,.12);--blue:#6c63ff;--blue2:#00d4ff;--red:#ef4444;--nav-bg:rgba(255,255,255,.88);--shadow:0 6px 22px rgba(108,99,255,.08);--glow:rgba(108,99,255,.2);--ph-bg:linear-gradient(135deg,#dde4f0,#eef1f8);--bg-pattern:radial-gradient(circle at top right,rgba(108,99,255,.09),transparent 45%),radial-gradient(circle at bottom left,rgba(0,212,255,.07),transparent 40%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);background-image:var(--bg-pattern);background-attachment:fixed;color:var(--ink);font-family:Cairo,system-ui,sans-serif;min-height:100vh;transition:background-color .35s,color .35s}
button,input{font:inherit;outline:none;border:none}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-500px 0}100%{background-position:500px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

#scroll-progress{position:fixed;top:0;right:0;height:3px;width:0%;z-index:9999;background:linear-gradient(270deg,var(--blue),var(--blue2));transition:width .1s ease-out}

/* nav */
.app-nav{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:var(--nav-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 8px 26px var(--glow);color:#fff}
.brand .logo svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-3px}
.nav-right{display:flex;align-items:center;gap:10px;margin-right:auto}
.profile-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 6px 6px 16px;font-weight:800;font-size:14px;color:var(--ink);transition:.2s}
.profile-btn:hover{border-color:var(--blue)}
.profile-btn .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.theme-toggle{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
.theme-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .icon-sun{display:none}.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}[data-theme="dark"] .theme-toggle .icon-moon{display:none}

/* page */
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 70px}
body.leaving .wrap{opacity:0;transform:translateY(-8px);transition:opacity .26s,transform .26s}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:10px 20px;font-weight:700;font-size:14px;transition:border-color .2s,transform .2s}
.back-btn:hover{border-color:var(--blue);transform:translateX(4px)}
.back-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.search-box{position:relative;flex:1;min-width:200px;max-width:320px;margin-right:auto}
.search-box svg{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.search-box input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:11px 42px 11px 14px;font-size:14px;font-weight:700;transition:border-color .2s,box-shadow .2s}
.search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--glow)}
.page-head{margin-bottom:26px;animation:rise .5s ease backwards}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.crumb{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:800;color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,transparent);border:1px solid color-mix(in srgb,var(--blue) 20%,transparent)}
.page-head h1{margin:0 0 6px;font-size:clamp(22px,3vw,30px);font-weight:900}
.page-head p{margin:0;color:var(--muted);font-size:14px;font-weight:700}
.page-head p b{color:var(--ink)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.chapter-card{position:relative;display:flex;flex-direction:column;gap:16px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);cursor:pointer;overflow:hidden;-webkit-touch-callout:none;transition:transform .3s ease,border-color .3s,box-shadow .3s,opacity .3s;animation:rise .5s ease backwards;animation-delay:calc(var(--i,0)*60ms)}
.chapter-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--blue),var(--blue2));opacity:0;transition:opacity .3s}
.chapter-card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--blue) 45%,transparent);box-shadow:0 22px 44px var(--glow)}
.chapter-card:hover::before{opacity:1}
.chapter-card:active{transform:scale(.985)}
.chapter-card.opening{transform:scale(.98);opacity:.92}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.card-text{flex:1;min-width:0;padding-top:4px}
.chapter-label{display:inline-block;margin-bottom:8px;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:800;color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.chapter-title{margin:0;font-size:20px;font-weight:900;line-height:1.45;overflow-wrap:anywhere}
.card-image{position:relative;flex:none;width:100px;height:100px;border-radius:20px;padding:3px;background:linear-gradient(135deg,var(--blue),var(--blue2));pointer-events:none}
.card-image,.card-image *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card-image img{width:100%;height:100%;object-fit:cover;border-radius:17px;display:block;background:var(--card-inner);-webkit-user-drag:none}
.image-placeholder{width:100%;height:100%;border-radius:17px;background:var(--ph-bg);display:grid;place-items:center;color:var(--muted)}
.image-placeholder svg{width:30px;height:30px;opacity:.6}
.lectures-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card-inner);border:1px solid var(--line);border-radius:14px;padding:11px 16px}
.lectures-bar-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.lectures-bar-label svg{width:18px;height:18px;color:var(--blue);fill:none;stroke:currentColor;stroke-width:2}
.lectures-badge{min-width:34px;height:34px;padding:0 8px;border-radius:99px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 4px 12px var(--glow)}
.view-btn{width:100%;padding:13px;border-radius:14px;font-size:15px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px var(--glow);transition:gap .2s,filter .2s}
.chapter-card:hover .view-btn{gap:14px;filter:brightness(1.07)}
.view-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;transform:scaleX(-1)}
.view-btn.is-loading{pointer-events:none}
.view-btn.is-loading svg{display:none}
.view-btn.is-loading::after{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite}

/* skeleton + states */
.sk-card{height:268px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);background-size:500px 100%;animation:shimmer 1.4s infinite linear}
.state{grid-column:1/-1;text-align:center;padding:56px 16px;color:var(--muted);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:14px}
.state.err{color:var(--red)}
.state button{padding:10px 22px;border-radius:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2))}
.foot{text-align:center;color:var(--muted);font-weight:700;font-size:13px;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px))}
.foot b{color:var(--blue)}
.to-top{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 10px 24px var(--glow);opacity:0;visibility:hidden;transform:translateY(10px);transition:.25s;z-index:30}
.to-top.show{opacity:1;visibility:visible;transform:none}

@media(max-width:768px){
  .grid{grid-template-columns:1fr;gap:16px}
  .brand small{display:none}
  .profile-btn #nav-name{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .search-box{max-width:none;flex-basis:100%;order:3;margin-right:0}
  .chapter-card{padding:18px;border-radius:20px}
  .chapter-title{font-size:18px}
  .card-image{width:88px;height:88px}
}
</style>
</head>
<body>
<div id="scroll-progress"></div>

<header class="app-nav"><div class="app-nav-in">
  <div class="brand" onclick="window.location.href='index.html'">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
    <span>ثانوية <span style="color:var(--blue)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
  </div>
  <div class="nav-right">
    <button type="button" class="profile-btn" onclick="window.location.href='profile.html'" aria-label="الملف الشخصي"><span class="av" id="nav-av">؟</span><span id="nav-name">—</span></button>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="تبديل الثيم">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</div></header>

<main class="wrap" id="main">
  <div class="top-row">
    <button class="back-btn" type="button" onclick="goBack()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>رجوع للمدرسين</button>
  </div>
  <div class="page-head">
    <div class="crumbs" id="crumbs"></div>
    <h1 id="title">الفصول المتاحة</h1>
    <p id="sub">جاري التحميل…</p>
  </div>
  <div class="grid" id="grid">
    <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
  </div>
</main>
<footer class="foot">ثانوية <b>club</b> · مستقبلك الدراسي في مكان واحد</footer>
<button type="button" class="to-top" id="to-top" aria-label="للأعلى"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 14 6-6 6 6"/></svg></button>

<script>
(function(){
'use strict';
const API_BASE = '', TOKEN_KEY = 'student_token', token = localStorage.getItem(TOKEN_KEY);
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const teacherId = qs.get('teacherId');
const teacherName = qs.get('teacherName') || '';
const subjectName = qs.get('subjectName') || '';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let ALL = [];

const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => String(s || '').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,'').toLowerCase().trim();
const proxyImg = u => {
  if (!u) return '';
  u = String(u);
  if (u.startsWith('/api/img')) return u;
  if (/^https?:\/\//i.test(u)) {
    try { return '/api/img?u=' + btoa(unescape(encodeURIComponent(u))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
    catch(e){ return u; }
  }
  return u;
};
const api = async path => {
  const headers = { Accept: 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { headers });
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); location.replace('login.html'); return null; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'خطأ في السيرفر');
  return data.data;
};
const lecCount = c => Number(c.lectures_count || c.lecture_count || c.count || 0);
const chapName = c => String(c.name || c.title || 'فصل');

window.goBack = function(){
  if (document.referrer && document.referrer.indexOf('teachers.html') !== -1 && history.length > 1) history.back();
  else location.href = 'subjects.html';
};

/* progress + to-top */
const bar = $('scroll-progress'), toTop = $('to-top');
addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
  toTop.classList.toggle('show', scrollY > 500);
}, { passive: true });
toTop.addEventListener('click', () => scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }));

/* render */
const BOOK = '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
function cardHTML(c, i){
  const img = proxyImg(c.image_url || '');
  const name = chapName(c);
  const url = 'lectures.html?chapterId=' + encodeURIComponent(c.id) + '&chapterName=' + encodeURIComponent(name) + '&teacherName=' + encodeURIComponent(teacherName) + '&subjectName=' + encodeURIComponent(subjectName);
  return `
  <div class="chapter-card" id="card-${esc(c.id)}" data-url="${esc(url)}" role="link" tabindex="0" aria-label="${esc(name)} — عرض المحاضرات" style="--i:${Math.min(i, 8)}">
    <div class="card-top">
      <div class="card-text"><span class="chapter-label">الفصل ${c._n}</span><h2 class="chapter-title">${esc(name)}</h2></div>
      <div class="card-image">
        ${img ? `<img src="${esc(img)}" alt="" draggable="false" loading="${i < 4 ? 'eager' : 'lazy'}" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">` : ''}
        <div class="image-placeholder" style="display:${img ? 'none' : 'grid'}">${BOOK}</div>
      </div>
    </div>
    <div class="lectures-bar">
      <div class="lectures-bar-label">${BOOK}عدد المحاضرات</div>
      <div class="lectures-badge">${lecCount(c)}</div>
    </div>
    <button class="view-btn" type="button" tabindex="-1"><span>عرض المحاضرات</span><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  </div>`;
}
function renderGrid(list){
  const grid = $('grid');
  if (!list.length){ grid.innerHTML = '<div class="state">مفيش فصل بالاسم ده.</div>'; return; }
  grid.innerHTML = list.map(cardHTML).join('');
}
function updateSub(shown){
  const lec = ALL.reduce((a, c) => a + lecCount(c), 0);
  const head = shown === ALL.length ? '<b>' + ALL.length + '</b> ' + (ALL.length === 1 ? 'فصل' : 'فصول') : shown + ' من ' + ALL.length + ' فصل';
  $('sub').innerHTML = head + ' · <b>' + lec + '</b> محاضرة';
}
function addSearch(){
  if (ALL.length < 6) return;
  const box = document.createElement('div');
  box.className = 'search-box';
  box.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="c-search" autocomplete="off" placeholder="ابحث عن فصل…" aria-label="بحث عن فصل">';
  document.querySelector('.top-row').appendChild(box);
  let t = null;
  $('c-search').addEventListener('input', e => {
    clearTimeout(t);
    t = setTimeout(() => {
      const q = norm(e.target.value);
      const list = q ? ALL.filter(c => norm(chapName(c)).includes(q)) : ALL;
      updateSub(list.length); renderGrid(list);
    }, 120);
  });
}

/* open */
let navigating = false;
function openCard(card){
  if (!card || navigating) return;
  navigating = true;
  card.classList.add('opening');
  const b = card.querySelector('.view-btn');
  b.classList.add('is-loading'); b.querySelector('span').textContent = 'جاري الفتح...';
  document.body.classList.add('leaving');
  setTimeout(() => { location.href = card.dataset.url; }, 260);
}
$('grid').addEventListener('click', e => openCard(e.target.closest('.chapter-card')));
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const c = e.target.closest && e.target.closest('.chapter-card');
  if (c && e.target === c){ e.preventDefault(); openCard(c); }
});
addEventListener('pageshow', () => {
  navigating = false; document.body.classList.remove('leaving');
  document.querySelectorAll('.chapter-card.opening').forEach(c => {
    c.classList.remove('opening');
    const b = c.querySelector('.view-btn');
    if (b){ b.classList.remove('is-loading'); b.querySelector('span').textContent = 'عرض المحاضرات'; }
  });
});
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.card-image')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });

function showError(msg){
  $('sub').textContent = '';
  $('grid').innerHTML = '<div class="state err"><div>تعذّر تحميل الفصول: ' + esc(msg) + '</div><button type="button" onclick="location.reload()">إعادة المحاولة</button></div>';
}

async function load(){
  const crumbs = $('crumbs');
  crumbs.innerHTML = [subjectName, teacherName].filter(Boolean).map(x => '<span class="crumb">' + esc(x) + '</span>').join('');
  if (teacherName){
    $('title').textContent = 'فصول ' + teacherName;
    document.title = teacherName + ' — الفصول | ثانوية club';
  }
  if (!teacherId){
    $('sub').textContent = '';
    $('grid').innerHTML = '<div class="state">معرف المدرس غير موجود.<button type="button" onclick="location.href=\'subjects.html\'">الرجوع للمواد</button></div>';
    return;
  }
  try {
    let chapters = await api('/api/teachers/' + encodeURIComponent(teacherId) + '/chapters');
    if (chapters === null) return;
    if (!Array.isArray(chapters)) chapters = (chapters && chapters.chapters) || [];
    // شيل فصل «كتب المدرس» فقط — سيب حل الكتب وأي كورس تاني
    chapters = chapters.filter(c => c && !/كتب\s*المدرس|كتاب\s*المدرس/i.test(chapName(c)));
    ALL = chapters.map((c, i) => Object.assign({}, c, { _n: i + 1 }));
    // نفس العدد يظهر في صفحتي المدرسين والمواد
    try { sessionStorage.setItem('chc_' + teacherId, JSON.stringify({ n: ALL.length, t: Date.now() })); } catch(e){}
    if (!ALL.length){
      $('sub').textContent = '';
      $('grid').innerHTML = '<div class="state">لا يوجد فصول متاحة.</div>';
      return;
    }
    updateSub(ALL.length);
    addSearch();
    renderGrid(ALL);
  } catch(e){ showError(e.message); }
}

async function loadProfile(){
  try {
    const me = await api('/api/auth/me');
    if (me){ $('nav-name').textContent = me.name || 'طالب'; $('nav-av').textContent = (me.name || 'ط').charAt(0); }
  } catch(e){}
}

load(); loadProfile();
})();
</script>
<script src="theme.js"></script>
</body>
</html>
