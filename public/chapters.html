<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الفصول | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14;
  --card:#121a2b;
  --card-hover:#162036;
  --ink:#eef2ff;
  --muted:#8b9bb8;
  --line:rgba(148,163,184,.12);
  --blue:#3b82f6;
  --blue2:#60a5fa;
  --blue3:#2563eb;
}

*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif}
button{font:inherit;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Navbar */
.app-nav{position:sticky;top:0;z-index:40;background:rgba(7,11,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer}
.brand img{width:36px;height:36px;border-radius:11px}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.profile-wrap{position:relative;margin-right:auto}
.profile-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font-weight:800;font-size:12px;color:var(--ink)}
.profile-btn .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.profile-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.45);display:none;z-index:50}
.profile-menu.open{display:block}
.profile-menu button{width:100%;text-align:right;border:0;background:transparent;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.profile-menu button:hover{background:rgba(255,255,255,.04)}
.profile-menu button.danger{color:#ff8a80}

/* Main Content */
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 90px}
.back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:800;font-size:12px;cursor:pointer;margin-bottom:14px;color:var(--ink);transition:.2s}
.page-head{margin-bottom:22px;animation:fadeUp .4s ease}
.page-head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.12);color:var(--blue2);border:1px solid rgba(59,130,246,.2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;margin-bottom:10px}
.page-head h1{margin:0;font-size:26px;font-weight:900}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:13px}

/* Grid Layout */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}

/* New Card Style */
.chapter-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
  position:relative;
  transition:all .3s ease;
  animation:fadeUp .45s ease both;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}
.chapter-card:hover{
  border-color:rgba(59,130,246,.4);
  box-shadow:0 15px 40px rgba(37,99,235,.15);
  transform:translateY(-4px);
}

/* Top Part: Text + Image */
.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.card-text{
  flex:1;
  padding-top:4px;
}
.chapter-label{
  font-size:13px;
  font-weight:800;
  color:var(--blue2);
  margin-bottom:4px;
  display:block;
}
.chapter-title{
  font-size:20px;
  font-weight:900;
  color:var(--ink);
  line-height:1.4;
  margin:0;
}
.chapter-teacher{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin-top:6px;
}

/* Image Container */
.card-image{
  width:100px;
  height:100px;
  border-radius:18px;
  position:relative;
  flex-shrink:0;
  background:linear-gradient(135deg, #1e293b, #0f172a);
  padding:3px; /* عشان نعمل إطار */
}
.card-image::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:18px;
  padding:2px;
  background:linear-gradient(135deg, var(--blue), var(--blue3));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  z-index:1;
}
.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:16px;
  position:relative;
  z-index:2;
  background:#1e293b;
}
.image-placeholder{
  width:100%;
  height:100%;
  border-radius:16px;
  background:linear-gradient(135deg, #1e293b, #0f172a);
  display:grid;
  place-items:center;
  color:var(--muted);
  position:relative;
  z-index:2;
}
.image-placeholder svg{width:30px;height:30px;opacity:.6}

/* Lectures Count Bar */
.lectures-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0d1424;
  border:1px solid rgba(255,255,255,.05);
  border-radius:14px;
  padding:12px 16px;
}
.lectures-bar-label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:700;
  color:#cbd5e1;
}
.lectures-bar-label svg{
  width:18px;
  height:18px;
  color:var(--blue2);
}
.lectures-badge{
  background:linear-gradient(135deg, var(--blue), var(--blue3));
  color:#fff;
  font-size:14px;
  font-weight:900;
  width:32px;
  height:32px;
  border-radius:50%;
  display:grid;
  place-items:center;
  box-shadow:0 4px 10px rgba(59,130,246,.3);
}

/* Action Button */
.view-btn{
  background:linear-gradient(90deg, var(--blue3), var(--blue));
  color:#fff;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  transition:all .2s ease;
  width:100%;
}
.view-btn:hover{
  background:linear-gradient(90deg, var(--blue), var(--blue2));
  box-shadow:0 6px 20px rgba(59,130,246,.4);
}
.view-btn svg{
  width:18px;
  height:18px;
  fill:currentColor;
}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}

@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <header class="app-nav"><div class="app-nav-in">
    <div class="brand" id="brand-home"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M32 14 8 26l24 12 24-12z' fill='%23fff'/%3E%3C/svg%3E" alt=""><div>ثانوية club<small>منصة الثانوية العامة</small></div></div>
    <div class="profile-wrap"><button type="button" class="profile-btn" id="profile-btn"><span class="av" id="nav-av">?</span><span id="nav-name">—</span></button><div class="profile-menu" id="profile-menu"><button type="button" id="menu-account">حسابي</button><button type="button" class="danger" id="menu-logout">خروج</button></div></div>
  </div></header>

  <main class="wrap" id="main"><div class="loading"><div class="spinner"></div><p>جاري تحميل الفصول...</p></div></main>

<script>
(function(){
'use strict';
const API_BASE = '', TOKEN_KEY = 'cstk_tok', token = localStorage.getItem(TOKEN_KEY);
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const teacherId = qs.get('teacherId');
const teacherName = qs.get('teacherName') || '';
const subjectName = qs.get('subjectName') || '';

const api = async (path, opts = {}) => {
  const headers = { Accept: 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { method: opts.method || 'GET', headers, body: opts.body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'خطأ في السيرفر');
  return data.data;
};
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function load() {
  if (!teacherId) { $('main').innerHTML = '<div style="text-align:center;padding:50px">معرف المدرس غير موجود.</div>'; return; }
  try {
    const chapters = await api('/api/teachers/' + teacherId + '/chapters');
    if (!chapters || !chapters.length) { $('main').innerHTML = '<div style="text-align:center;padding:50px;color:var(--muted)">لا يوجد فصول متاحة.</div>'; return; }
    
    let html = `<button class="back-btn" onclick="history.back()">← رجوع</button>
    <div class="page-head">
      <div class="badge">الفصول</div>
      <h1>الفصول المتاحة</h1>
      <p>اختار الفصل لعرض المحاضرات</p>
    </div>
    <div class="grid">`;
    
    chapters.forEach((c, index) => {
      const imgUrl = c.image_url || '';
      const imgHtml = imgUrl 
        ? `<img src="${esc(imgUrl)}" alt="${esc(c.name)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">` 
        : '';
      
      const phHtml = `<div class="image-placeholder" style="display:${imgUrl ? 'none' : 'grid'};">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>`;

      html += `
      <div class="chapter-card" onclick="window.location.href='lectures.html?chapterId=${c.id}&chapterName=${encodeURIComponent(c.name)}&teacherName=${encodeURIComponent(teacherName)}&subjectName=${encodeURIComponent(subjectName)}'">
        
        <div class="card-top">
          <div class="card-text">
            <span class="chapter-label">الفصل ${index + 1}</span>
            <h2 class="chapter-title">${esc(c.name)}</h2>
            <!-- شيلنا اسم المستر زي ما طلبت -->
          </div>
          <div class="card-image">
            ${imgHtml}
            ${phHtml}
          </div>
        </div>

        <div class="lectures-bar">
          <div class="lectures-bar-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            عدد المحاضرات
          </div>
          <div class="lectures-badge">${c.lecture_count || 0}</div>
        </div>

        <button class="view-btn">
          عرض المحاضرات
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

      </div>`;
    });
    html += '</div>'; $('main').innerHTML = html;
  } catch (e) { $('main').innerHTML = `<div style="text-align:center;color:#ff5252;padding:50px;">خطأ: ${e.message}</div>`; }
}
async function loadProfile() { try { const me = await api('/api/profile'); $('nav-name').textContent = me.name || 'طالب'; $('nav-av').textContent = (me.name || 'ط').charAt(0); } catch (e) {} }
$('brand-home').onclick = () => window.location.href = 'subjects.html';
$('profile-btn').onclick = () => $('profile-menu').classList.toggle('open');
document.addEventListener('click', (e) => { if (!e.target.closest('.profile-wrap')) $('profile-menu').classList.remove('open'); });
$('menu-account').onclick = () => window.location.href = 'profile.html';
$('menu-logout').onclick = () => { localStorage.removeItem(TOKEN_KEY); window.location.replace('index.html'); };
load(); loadProfile();
})();
</script>
</body>
</html>
