<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>محتوى المحاضرة | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b14;
  --card: #121a2b;
  --card-hover: #162036;
  --ink: #eef2ff;
  --muted: #8b9bb8;
  --line: rgba(148, 163, 184, .12);
  --blue: #3b82f6;
  --blue2: #60a5fa;
  --blue3: #2563eb;
  --green: #10b981;
  --radius: 18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'Cairo', sans-serif; overflow-x: hidden; }
button { font: inherit; cursor: pointer; border: none; outline: none; }
a { text-decoration: none; color: inherit; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

/* Navbar */
.app-nav { position: sticky; top: 0; z-index: 40; background: rgba(7, 11, 20, .85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
.app-nav-in { max-width: 1120px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 16px; cursor: pointer; }
.brand img { width: 38px; height: 38px; border-radius: 12px; box-shadow: 0 4px 12px rgba(37,99,235,.3); }
.brand small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 2px; }
.profile-wrap { position: relative; margin-right: auto; }
.profile-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px 5px 5px; font-weight: 800; font-size: 13px; color: var(--ink); }
.profile-btn .av { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--blue3)); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 14px; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 90px; }

/* Header Area */
.top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; animation: fadeUp .4s ease both; flex-wrap: wrap; gap: 16px;}
.header-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; width: 100%; justify-content: flex-end; min-height: 30px;}
.tag { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 700; color: #d1d5db; display: inline-flex; align-items: center; gap: 6px; }
.tag.active { background: rgba(59,130,246,.15); color: var(--blue2); border-color: rgba(59,130,246,.3); }
.tag svg { width: 14px; height: 14px; fill: currentColor; }
.page-title { font-size: clamp(24px, 4vw, 32px); font-weight: 900; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: var(--ink);}
.page-subtitle { color: var(--muted); font-size: 14px; font-weight: 600; }
.back-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 12px 20px; font-weight: 800; font-size: 14px; color: var(--ink); transition: all .2s ease; }
.back-btn:hover { background: var(--card-hover); transform: translateX(4px); }

/* Section Box */
.section-box { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 24px; margin-bottom: 24px; animation: fadeUp .5s ease both;}
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.section-title { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 900; color: var(--ink); }
.section-title-icon { width: 44px; height: 44px; border-radius: 14px; background: rgba(59,130,246,.12); color: var(--blue2); display: grid; place-items: center; }
.section-title-icon svg { width: 24px; height: 24px; }
.section-subtitle { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 4px; }

/* Video Grid */
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.video-card { background: #0d1424; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; transition: all .3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; display: flex; flex-direction: column;}
.video-card:hover { transform: translateY(-5px); border-color: rgba(59,130,246,.4); box-shadow: 0 15px 35px rgba(0,0,0,.4); }

/* Thumbnail */
.video-thumb { position: relative; aspect-ratio: 16/9; background: linear-gradient(135deg, var(--blue3), #1e1b4b); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.video-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
.video-thumb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(13,20,36,1) 0%, transparent 50%); }
.play-icon-circle { width: 64px; height: 64px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 2; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform .2s; }
.video-card:hover .play-icon-circle { transform: scale(1.1); }
.play-icon-circle svg { width: 24px; height: 24px; fill: var(--blue3); margin-left: 4px; }

/* Badges */
.badge-top-right { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; z-index: 3; }
.badge-watched { position: absolute; top: 12px; left: 12px; background: var(--green); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px; z-index: 3; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.4); }
.badge-duration { position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; display: flex; align-items: center; gap: 4px; z-index: 3; }

/* Video Info */
.video-info { padding: 20px; display: flex; flex-direction: column; flex: 1; }
.video-title { font-size: 17px; font-weight: 800; line-height: 1.5; margin-bottom: 16px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
.action-btn { width: 100%; padding: 12px; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 900; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .2s ease; }
.action-btn:hover { background: var(--blue2); box-shadow: 0 4px 15px rgba(59,130,246,.4); }
.action-btn svg { width: 16px; height: 16px; fill: currentColor; }

/* File List Style */
.file-list { display: flex; flex-direction: column; gap: 12px; }
.file-item { display: flex; align-items: center; justify-content: space-between; background: #0d1424; border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; transition: all .2s ease; }
.file-item:hover { border-color: rgba(59,130,246,.4); background: var(--card-hover); }
.file-info { display: flex; align-items: center; gap: 14px; flex: 1; }
.file-icon { width: 44px; height: 44px; background: rgba(59,130,246,.12); color: var(--blue2); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.file-text { font-size: 15px; font-weight: 700; color: var(--ink); }
.file-btn { background: rgba(59,130,246,.1); color: var(--blue2); border: 1px solid rgba(59,130,246,.3); border-radius: 10px; padding: 8px 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; transition: .2s; }
.file-btn:hover { background: rgba(59,130,246,.2); }

/* Loading & Error */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px; color: var(--muted); }
.spinner { width: 40px; height: 40px; border: 3px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .top-header { flex-direction: column; align-items: flex-start; }
  .header-tags { justify-content: flex-start; }
  .video-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="app-nav">
  <div class="app-nav-in">
    <div class="brand" onclick="window.location.href='subjects.html'">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M32 14 8 26l24 12 24-12z' fill='%23fff'/%3E%3C/svg%3E" alt="Logo">
      <div>ثانوية club<small>منصة الثانوية العامة</small></div>
    </div>
    <div class="profile-wrap">
      <button class="profile-btn" onclick="window.location.href='profile.html'">
        <span class="av" id="nav-av">?</span>
        <span id="nav-name">—</span>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="loading"><div class="spinner"></div><p>جاري تحميل المحتوى...</p></div>
</main>

<script>
(function(){
  'use strict';
  
  const API_BASE = ''; 
  const TOKEN_KEY = 'cstk_tok'; 
  const token = localStorage.getItem(TOKEN_KEY);
  const $ = id => document.getElementById(id);
  
  const qs = new URLSearchParams(location.search);
  const lectureId = qs.get('lectureId'); 
  
  // استقبال الاسم الجديد من الرابط
  const urlLectureName = qs.get('lectureName') || '';
  const urlTeacher = qs.get('teacherName') || '';
  const urlChapter = qs.get('chapterName') || '';
  const urlSubject = qs.get('subjectName') || '';

  const api = async (path, opts = {}) => {
    const headers = { Accept: 'application/json', ...opts.headers };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_BASE + path, { method: opts.method || 'GET', headers, body: opts.body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'خطأ في السيرفر');
    return data.data;
  };
  
  const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function formatDuration(seconds) {
    if (!seconds || isNaN(seconds)) return '00:00';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function isVideoWatched(videoId) {
    try {
      const saved = JSON.parse(localStorage.getItem('cstk_w_' + videoId) || 'null');
      return saved && (saved.watched || saved.percent >= 90);
    } catch(e) { return false; }
  }

  async function load() {
    if (!lectureId) {
      $('main').innerHTML = '<div style="text-align:center;padding:50px">معرف المحاضرة غير موجود في الرابط (lectureId).</div>';
      return;
    }
    
    try {
      const data = await api('/api/lectures/' + lectureId + '/content'); 
      
      const videos = data.videos || data.video || [];
      const files = data.files || data.file || data.attachments || data.pdfs || data.documents || [];
      
      // هنا التعديل: الاسم بقى ياخد من الرابط الأول
      const lectureName = urlLectureName || (data.lecture && data.lecture.name) || data.lecture_name || data.name || data.title || 'محتوى المحاضرة';
      
      const teacherName = urlTeacher || data.teacher_name || (data.teacher && data.teacher.name) || '';
      const chapterName = urlChapter || data.chapter_name || (data.chapter && data.chapter.name) || '';
      const subjectName = urlSubject || data.subject_name || (data.subject && data.subject.name) || '';

      let tagsHtml = '';
      if (teacherName) {
        tagsHtml += `
          <span class="tag active">
             <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
             مع أ. ${esc(teacherName)}
          </span>
        `;
      }
      if (chapterName) {
        tagsHtml += `
          <span class="tag">
             <svg viewBox="0 0 24 24" style="color:#ef4444"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
             ${esc(chapterName)}
          </span>
        `;
      }
      if (subjectName) {
        tagsHtml += `<span class="tag">${esc(subjectName)}</span>`;
      }

      let html = `
        <div class="top-header">
          <div style="display:flex; flex-direction: column; gap: 16px; align-items: flex-start; width: 100%;">
             <div class="header-tags">
                ${tagsHtml}
             </div>
             <div>
                <h1 class="page-title">${esc(lectureName)} <span style="font-size: 32px;">🧪</span></h1>
                <p class="page-subtitle">ذاكر المحاضرة كاملة من فيديوهات وملفات، وفي الآخر اختبر نفسك.</p>
             </div>
          </div>
          <button class="back-btn" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            رجوع للفصل
          </button>
        </div>

        <div class="section-box">
          <div class="section-head">
            <div>
              <div class="section-title">
                <div class="section-title-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
                </div>
                <div>
                  <span>الفيديوهات</span>
                  <div class="section-subtitle">${videos.length} فيديو متاح</div>
                </div>
              </div>
            </div>
          </div>

          <div class="video-grid">
      `;

      if (videos.length === 0) {
        html += `<div style="text-align:center; padding: 20px; color: var(--muted); grid-column: 1 / -1;">لا توجد فيديوهات في هذه المحاضرة.</div>`;
      } else {
        videos.forEach((v, index) => {
          const isWatched = isVideoWatched(v.id);
          const duration = v.duration || v.duration_seconds || 0;
          const thumbnail = v.thumbnail || v.thumb || v.thumbnail_url || v.image_url || '';
          
          html += `
            <div class="video-card">
              <div class="video-thumb" ${thumbnail ? `style="background: url('${esc(thumbnail)}') center/cover;"` : ''}>
                ${thumbnail ? `<img src="${esc(thumbnail)}" alt="Thumbnail" onerror="this.style.display='none'">` : ''}
                <div class="badge-top-right">فيديو #${index + 1}</div>
                ${isWatched ? `
                  <div class="badge-watched">
                     <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                     تم المشاهدة
                  </div>
                ` : ''}
                <div class="badge-duration">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                  ${formatDuration(duration)}
                </div>
                <div class="play-icon-circle">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
              <div class="video-info">
                <div class="video-title">${esc(v.title || v.name || 'فيديو بدون عنوان')}</div>
                <button class="action-btn" onclick="window.location.href='player.html?lectureId=${lectureId}&videoId=${v.id}'">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                  تشغيل الفيديو
                </button>
              </div>
            </div>
          `;
        });
      }

      html += `</div></div>`; 

      if (files.length > 0) {
        html += `
          <div class="section-box">
            <div class="section-head">
              <div class="section-title">
                <div class="section-title-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </div>
                <div>
                  <span>الملفات والمذكرات</span>
                  <div class="section-subtitle">${files.length} ملف متاح</div>
                </div>
              </div>
            </div>
            <div class="file-list">
        `;
        files.forEach(f => {
          const fileName = f.title || f.name || f.file_name || f.filename || 'ملف مرفق';
          const fileUrl = f.file_url || f.url || f.link || f.path || f.download_url || '#';

          html += `
            <div class="file-item">
              <div class="file-info">
                <div class="file-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                </div>
                <div class="file-text">${esc(fileName)}</div>
              </div>
              <button class="file-btn" onclick="window.open('${esc(fileUrl)}', '_blank')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                فتح الملف
              </button>
            </div>
          `;
        });
        html += `</div></div>`;
      }

      $('main').innerHTML = html;

    } catch (e) {
      $('main').innerHTML = `<div style="text-align:center;color:#ff5252;padding:50px;">خطأ: ${e.message}</div>`;
    }
  }

  async function loadProfile() {
    try {
      const me = await api('/api/profile');
      $('nav-name').textContent = me.name || 'طالب';
      $('nav-av').textContent = (me.name || 'ط').charAt(0);
    } catch (e) {}
  }

  load();
  loadProfile();

})();
</script>
</body>
</html>
