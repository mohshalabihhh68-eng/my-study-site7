<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>محتوى المحاضرة | ثانوية club</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('thanawya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t === 'dark' ? '#070b14' : '#f8fafc');
  } catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"]{--bg:#070b14;--card:#121a2b;--card-hover:#182338;--card-inner:#0d1424;--ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.12);--line-soft:rgba(255,255,255,.05);--blue:#3b82f6;--blue2:#60a5fa;--blue3:#2563eb;--green:#10b981;--red:#ef4444;--nav-bg:rgba(7,11,20,.88);--back-btn-bg:#111a2b;--back-btn-bg-hover:#1a253a;--placeholder-bg:linear-gradient(135deg,#1e293b,#0f172a);--video-card-bg:#0d1424}
[data-theme="light"]{--bg:#f8fafc;--card:#ffffff;--card-hover:#f1f5f9;--card-inner:#f1f5f9;--ink:#1e293b;--muted:#64748b;--line:rgba(108,99,255,.10);--line-soft:rgba(108,99,255,.05);--blue:#6c63ff;--blue2:#00d4ff;--blue3:#5a52d5;--green:#10b981;--red:#ef4444;--nav-bg:rgba(255,255,255,.88);--back-btn-bg:#ffffff;--back-btn-bg-hover:#f1f5f9;--placeholder-bg:linear-gradient(135deg,#e2e8f0,#f1f5f9);--video-card-bg:#ffffff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;overflow-x:hidden;transition:background-color .35s,color .35s}
button{font:inherit;cursor:pointer;border:none;outline:none}
a{text-decoration:none;color:inherit}

#scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#6c63ff,#00d4ff);width:0%;z-index:9999;transition:width .1s ease-out;box-shadow:0 0 10px rgba(108,99,255,.5)}
#scroll-progress-side{position:fixed;top:0;right:0;width:4px;background:linear-gradient(180deg,#6c63ff,#00d4ff);height:0%;z-index:9999;transition:height .1s ease-out;box-shadow:0 0 10px rgba(108,99,255,.5);border-radius:0 0 0 4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.app-nav{position:sticky;top:0;z-index:40;background:var(--nav-bg);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#6c63ff,#00d4ff);box-shadow:0 8px 26px rgba(108,99,255,.35);color:white}
.brand .logo svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-3px}
.nav-right{display:flex;align-items:center;gap:10px;margin-right:auto}

.profile-wrap{position:relative}
.profile-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px 6px 6px;cursor:pointer;font-weight:800;font-size:14px;color:var(--ink);transition:.2s}
.profile-btn:hover{background:var(--card-hover);border-color:rgba(108,99,255,.3)}
.profile-btn .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}

.theme-toggle{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .25s,background .25s,border-color .25s;padding:0;flex-shrink:0}
.theme-toggle:hover{background:var(--card-hover);border-color:var(--blue);transform:rotate(15deg)}
.theme-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;display:block}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}
[data-theme="dark"] .theme-toggle .icon-moon{display:none}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 90px}
.header-action{display:flex;justify-content:flex-start;margin-bottom:20px}
.back-btn{display:inline-flex;align-items:center;gap:10px;background:var(--back-btn-bg);border:1px solid var(--line-soft);color:var(--ink);border-radius:14px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s}
.back-btn:hover{background:var(--back-btn-bg-hover)}
.back-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.top-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;animation:fadeUp .4s ease both;flex-wrap:wrap;gap:16px}
.header-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;width:100%;justify-content:flex-end;min-height:30px}
.tag{background:var(--card-inner);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tag.active{background:rgba(108,99,255,.10);color:var(--blue);border-color:rgba(108,99,255,.2)}
.tag svg{width:14px;height:14px;fill:currentColor}
.page-title{font-size:clamp(24px,4vw,32px);font-weight:900;display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--ink)}
.page-subtitle{color:var(--muted);font-size:14px;font-weight:600}
.section-box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:24px;animation:fadeUp .5s ease both;box-shadow:0 4px 15px rgba(108,99,255,.05)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.section-title{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900;color:var(--ink)}
.section-title-icon{width:44px;height:44px;border-radius:14px;background:rgba(108,99,255,.10);color:var(--blue);display:grid;place-items:center}
.section-title-icon svg{width:24px;height:24px}
.section-subtitle{font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}

/* ========================================= */
/* تصميم القائمة الأفقية (الشكل الجديد) */
/* ========================================= */
.video-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.video-row {
  display: flex;
  align-items: center;
  background: var(--card-inner);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  padding: 12px;
  gap: 16px;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.video-row:hover {
  background: var(--card-hover);
  border-color: var(--blue);
  transform: translateX(-5px); /* حركة بسيطة لليسار */
  box-shadow: 0 10px 25px rgba(108, 99, 255, 0.1);
}

/* توهج جانبي عند الوقوف */
.video-row::before {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--blue);
  opacity: 0;
  transition: opacity 0.25s;
}
.video-row:hover::before {
  opacity: 1;
}

/* الصورة المصغرة */
.v-thumb {
  width: 140px;
  height: 85px;
  border-radius: 12px;
  background: var(--placeholder-bg);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.v-thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}
.v-thumb::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.2);
  z-index: 2;
}
/* أيقونة التشغيل الصغيرة جوه الصورة */
.v-play-icon {
  position: relative;
  z-index: 3;
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}
.video-row:hover .v-play-icon {
  transform: scale(1.1);
  background: var(--blue);
  color: #fff;
}
.v-play-icon svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
  margin-right: 2px;
}

/* بيانات الفيديو */
.v-details {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.v-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.v-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
}
.v-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* علامة تم المشاهدة */
.v-watched {
  background: rgba(16, 185, 129, 0.15);
  color: var(--green);
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
}

/* زر السهم في الآخر */
.v-arrow {
  color: var(--muted);
  transition: transform 0.2s, color 0.2s;
}
.video-row:hover .v-arrow {
  color: var(--blue);
  transform: translateX(-5px);
}

/* ========================================= */
/* تصميم الملفات */
/* ========================================= */
.file-list{display:flex;flex-direction:column;gap:12px}
.file-item{display:flex;align-items:center;justify-content:space-between;background:var(--video-card-bg);border:1px solid var(--line);border-radius:16px;padding:16px 20px;transition:all .2s ease}
.file-item:hover{border-color:rgba(108,99,255,.35);background:var(--card-hover)}
.file-info{display:flex;align-items:center;gap:14px;flex:1}
.file-icon{width:44px;height:44px;background:rgba(108,99,255,.10);color:var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center}
.file-text{font-size:15px;font-weight:700;color:var(--ink)}
.file-btn{background:rgba(108,99,255,.10);color:var(--blue);border:1px solid rgba(108,99,255,.3);border-radius:10px;padding:8px 16px;font-weight:800;display:flex;align-items:center;gap:6px;transition:.2s}
.file-btn:hover{background:rgba(108,99,255,.2)}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
@media(max-width:768px){
  .top-header{flex-direction:column;align-items:flex-start}.header-tags{justify-content:flex-start}.brand small{display:none}#scroll-progress-side{width:3px}
  .video-row { padding: 10px; gap: 12px; }
  .v-thumb { width: 100px; height: 60px; border-radius: 8px; }
  .v-title { font-size: 14px; }
  .v-play-icon { width: 28px; height: 28px; }
  .v-play-icon svg { width: 12px; height: 12px; }
  .v-meta { font-size: 11px; gap: 8px; }
  .v-arrow { display: none; } /* إخفاء السهم في الموبايل عشان المساحة */
}
</style>
</head>
<body>
<div id="scroll-progress"></div>
<div id="scroll-progress-side"></div>

<header class="app-nav">
  <div class="app-nav-in">
    <div class="brand" onclick="window.location.href='index.html'">
      <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
      <span>ثانوية <span style="color:var(--blue)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
    </div>
    <div class="nav-right">
      <div class="profile-wrap"><button class="profile-btn" onclick="window.location.href='profile.html'"><span class="av" id="nav-av">?</span><span id="nav-name">—</span></button></div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="تبديل الثيم">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="wrap" id="main"><div class="loading"><div class="spinner"></div><p>جاري تحميل المحتوى...</p></div></main>
<script>
(function(){
'use strict';
const API_BASE = ''; const TOKEN_KEY = 'student_token'; const token = localStorage.getItem(TOKEN_KEY);
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const lectureId = qs.get('lectureId');
const urlLectureName = qs.get('lectureName') || '';
const urlTeacher = qs.get('teacherName') || '';
const urlChapter = qs.get('chapterName') || '';
const urlSubject = qs.get('subjectName') || '';

const progressBar = $('scroll-progress');
const progressBarSide = $('scroll-progress-side');
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  if (progressBar) progressBar.style.width = progress + '%';
  if (progressBarSide) progressBarSide.style.height = progress + '%';
}, { passive: true });

const api = async (path, opts = {}) => {
  const headers = { Accept: 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { method: opts.method || 'GET', headers, body: opts.body });
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); window.location.replace('login.html'); return; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'خطأ في السيرفر');
  return data.data;
};
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function formatDuration(seconds) {
  if (!seconds || isNaN(seconds)) return '00:00';
  const h = Math.floor(seconds / 3600); const m = Math.floor((seconds % 3600) / 60); const s = Math.floor(seconds % 60);
  if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function isVideoWatched(videoId) {
  try { const saved = JSON.parse(localStorage.getItem('cstk_w_' + videoId) || 'null'); return saved && (saved.watched || saved.percent >= 90); } catch(e) { return false; }
}

async function load() {
  if (!lectureId) { $('main').innerHTML = '<div style="text-align:center;padding:50px">معرف المحاضرة غير موجود في الرابط (lectureId).</div>'; return; }
  try {
    const data = await api('/api/lectures/' + lectureId + '/content');
    const videos = data.videos || data.video || [];
    const files = data.files || data.file || data.attachments || data.pdfs || data.documents || [];
    const lectureName = urlLectureName || (data.lecture && data.lecture.name) || data.lecture_name || data.name || data.title || 'محتوى المحاضرة';
    const teacherName = urlTeacher || data.teacher_name || (data.teacher && data.teacher.name) || '';
    const chapterName = urlChapter || data.chapter_name || (data.chapter && data.chapter.name) || '';
    const subjectName = urlSubject || data.subject_name || (data.subject && data.subject.name) || '';
    
    let tagsHtml = '';
    if (teacherName) tagsHtml += `<span class="tag active"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> مع أ. ${esc(teacherName)}</span>`;
    if (chapterName) tagsHtml += `<span class="tag"><svg viewBox="0 0 24 24" style="color:#ef4444"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg> ${esc(chapterName)}</span>`;
    if (subjectName) tagsHtml += `<span class="tag">${esc(subjectName)}</span>`;
    
    let html = `
    <div class="header-action"><button class="back-btn" onclick="history.back()"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>رجوع للمحاضرات</button></div>
    <div class="top-header">
      <div style="display:flex;flex-direction:column;gap:16px;align-items:flex-start;width:100%">
        <div class="header-tags">${tagsHtml}</div>
        <div>
          <h1 class="page-title">${esc(lectureName)}</h1>
          <p class="page-subtitle">ذاكر المحاضرة كاملة من فيديوهات وملفات.</p>
        </div>
      </div>
    </div>
    <div class="section-box">
      <div class="section-head"><div><div class="section-title"><div class="section-title-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg></div><div><span>الفيديوهات</span><div class="section-subtitle">${videos.length} فيديو متاح</div></div></div></div></div>
      
      <!-- القائمة الأفقية الجديدة -->
      <div class="video-list">`;
      
    if (videos.length === 0) {
      html += `<div style="text-align:center;padding:20px;color:var(--muted);">لا توجد فيديوهات في هذه المحاضرة.</div>`;
    } else {
      videos.forEach((v, index) => {
        const isWatched = isVideoWatched(v.id);
        const duration = v.duration || v.duration_seconds || 0;
        const thumbnail = v.thumbnail || v.thumb || v.thumbnail_url || v.image_url || '';
        
        html += `
        <div class="video-row" onclick="window.location.href='player.html?lectureId=${lectureId}&videoId=${v.id}'">
          
          <div class="v-thumb">
            ${thumbnail ? `<img src="${esc(thumbnail)}" alt="Thumbnail" onerror="this.style.display='none'">` : ''}
            <div class="v-play-icon">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
          
          <div class="v-details">
            <div class="v-title">${esc(v.title || v.name || 'فيديو بدون عنوان')}</div>
            <div class="v-meta">
              <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${formatDuration(duration)}</span>
              ${isWatched ? `<span class="v-watched">تم المشاهدة ✓</span>` : ''}
            </div>
          </div>

          <div class="v-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </div>

        </div>`;
      });
    }
    html += `</div></div>`;
    
    if (files.length > 0) {
      html += `<div class="section-box"><div class="section-head"><div class="section-title"><div class="section-title-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div><div><span>الملفات والمذكرات</span><div class="section-subtitle">${files.length} ملف متاح</div></div></div></div><div class="file-list">`;
      files.forEach(f => {
        const fileName = f.title || f.name || f.file_name || f.filename || 'ملف مرفق';
        const rawUrl = f.file_url || f.url || f.link || f.path || f.download_url || '#';
        const fileUrl = rawUrl !== '#' ? ('/api/file-proxy/document.pdf?url=' + encodeURIComponent(rawUrl)) : '#';
        html += `<div class="file-item"><div class="file-info"><div class="file-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg></div><div class="file-text">${esc(fileName)}</div></div><button class="file-btn" onclick="window.open('${esc(fileUrl)}', '_blank')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> فتح الملف</button></div>`;
      });
      html += `</div></div>`;
    }
    $('main').innerHTML = html;
  } catch (e) { $('main').innerHTML = `<div style="text-align:center;color:#ff5252;padding:50px;">خطأ: ${e.message}</div>`; }
}

load(); loadProfile();
})();
