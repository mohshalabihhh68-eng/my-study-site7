<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة كورساتك - المواد</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    header { text-align: center; margin-bottom: 40px; padding: 20px; background: #1e293b; border-radius: 12px; }
    header h1 { color: #38bdf8; font-size: 28px; }
    header p { color: #94a3b8; margin-top: 8px; }
    #loading, #error { text-align: center; padding: 40px; font-size: 18px; }
    #error { color: #f87171; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.3s; border: 1px solid #334155; }
    .card:hover { transform: translateY(-5px); border-color: #38bdf8; box-shadow: 0 10px 25px rgba(56,189,248,0.2); }
    .card img { width: 100%; height: 140px; object-fit: cover; background: #334155; display: block; }
    .card .info { padding: 16px; }
    .card h3 { font-size: 16px; color: #e2e8f0; }
    .card .id { font-size: 12px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>📚 منصة كورساتك</h1>
    <p>اختر المادة لعرض المدرسين</p>
  </header>

  <div id="loading">⏳ جاري تحميل المواد...</div>
  <div id="error" style="display:none"></div>
  <div class="grid" id="grid"></div>

  <script>
    const API = ""; // نفس السيرفر
    const YEAR_ID = 4;

    async function loadSubjects() {
      try {
        const res = await fetch(`${API}/api/subjects/${YEAR_ID}`);
        const data = await res.json();
        if (!data.success || !Array.isArray(data.data)) throw new Error("لا توجد مواد");

        document.getElementById("loading").style.display = "none";
        const grid = document.getElementById("grid");

        data.data.forEach(sub => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <img src="${sub.image_url || 'https://via.placeholder.com/200x140/334155/94a3b8?text=' + encodeURIComponent(sub.name)}" 
                 alt="${sub.name}" onerror="this.src='https://via.placeholder.com/200x140/334155/94a3b8?text=No+Image'">
            <div class="info">
              <h3>${sub.name}</h3>
              <div class="id">ID: ${sub.id}</div>
            </div>
          `;
          card.onclick = () => {
            window.location.href = `subjects.html?id=${sub.id}&name=${encodeURIComponent(sub.name)}`;
          };
          grid.appendChild(card);
        });
      } catch (e) {
        document.getElementById("loading").style.display = "none";
        const err = document.getElementById("error");
        err.style.display = "block";
        err.textContent = "❌ خطأ: " + e.message;
      }
    }

    loadSubjects();
  </script>
</body>
</html>
