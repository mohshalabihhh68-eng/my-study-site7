<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>منصة الدروس</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
</head>
<body>
  <header class="topbar">
    <div class="logo" onclick="goHome()">منصة الدروس</div>
    <div id="profile-chip" class="chip hidden"></div>
  </header>

  <main id="app">
    <div class="loading">جاري التحميل...</div>
  </main>

  <div id="player-modal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" onclick="closePlayer()">✕</button>
      <h3 id="player-title"></h3>
      <video id="video" controls playsinline></video>
      <div id="player-status" class="status"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
