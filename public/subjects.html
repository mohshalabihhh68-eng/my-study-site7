<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>المواد الدراسية | ثانوية club</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('thanawya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t === 'dark' ? '#070b14' : '#f8fafc');
  } catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"]{--bg:#070b14;--card:#121a2b;--card-hover:#182338;--card-inner:#0d1424;--ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.12);--line-soft:rgba(255,255,255,.05);--blue:#3b82f6;--blue2:#60a5fa;--blue3:#2563eb;--green:#10b981;--red:#ef4444;--nav-bg:rgba(7,11,20,.88);--back-btn-bg:#111a2b;--back-btn-bg-hover:#1a253a}
[data-theme="light"]{--bg:#f8fafc;--card:#ffffff;--card-hover:#f1f5f9;--card-inner:#f1f5f9;--ink:#1e293b;--muted:#64748b;--line:rgba(108,99,255,.10);--line-soft:rgba(108,99,255,.05);--blue:#6c63ff;--blue2:#00d4ff;--blue3:#5a52d5;--green:#10b981;--red:#ef4444;--nav-bg:rgba(255,255,255,.88);--back-btn-bg:#ffffff;--back-btn-bg-hover:#f1f5f9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;overflow-x:hidden;transition:background-color .35s,color .35s}
button{font:inherit;cursor:pointer;border:none;outline:none}
a{text-decoration:none;color:inherit}

/* شريط التقدم العلوي */
#scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#6c63ff,#00d4ff);width:0%;z-index:9999;transition:width .1s ease-out;box-shadow:0 0 10px rgba(108,99,255,.5)}

@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.app-nav{position:sticky;top:0;z-index:40;background:var(--nav-bg);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#6c63ff,#00d4ff);box-shadow:0 8px 26px rgba(108,99,255,.35);color:white}
.brand .logo svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-3px}
.nav-right{display:flex;align-items:center;gap:10px;margin-right:auto}
.profile-wrap{position:relative}
.profile-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;font-weight:800;font-size:13px;color:var(--ink);transition:.2s}
.profile-btn:hover{background:var(--card-hover)}
.profile-btn .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px}
.theme-toggle{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .25s,background .25s,border-color .25s;padding:0;flex-shrink:0}
.theme-toggle:hover{background:var(--card-hover);border-color:var(--blue);transform:rotate(15deg)}
.theme-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;display:block}
.theme-toggle .icon-sun{display:none}
.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}
[data-theme="dark"] .theme-toggle .icon-moon{display:none}

.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 90px}
.top-header{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;animation:fadeUp .4s ease both}
.top-header .tag{background:var(--card-inner);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;width:fit-content}
.top-header .tag svg{width:14px;height:14px;fill:currentColor}
.page-title{font-size:clamp(22px,4vw,30px);font-weight:900;color:var(--ink);display:flex;align-items:center;gap:8px}
.page-title span.name{background:linear-gradient(90deg, var(--blue), var(--blue2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 12px rgba(108,99,255,.4)); display:inline-block}
.page-subtitle{color:var(--muted);font-size:14px;font-weight:600}

.subjects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.subject-card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s;display:flex;flex-direction:column;position:relative;animation:fadeUp .5s ease both;box-shadow:0 4px 15px rgba(108,99,255,.03)}
.subject-card:hover{transform:translateY(-5px);border-color:rgba(108,99,255,.3);box-shadow:0 15px 35px rgba(108,99,255,.12)}
.subject-thumb{position:relative;width:100%;aspect-ratio:16/10;background:var(--card-inner);overflow:hidden;display:flex;align-items:center;justify-content:center}
.subject-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 80%;transition:transform .5s ease}
.subject-card:hover .subject-thumb img{transform:scale(1.05)}
.subject-thumb-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,23,42,.6) 0%,transparent 40%)}
.subject-info{padding:20px;display:flex;flex-direction:column;flex:1;gap:16px;text-align:center}
.subject-info h3{font-size:18px;font-weight:900;color:var(--ink)}
.subject-info p{font-size:13px;color:var(--muted);font-weight:700}
.subject-btn{width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s ease;box-shadow:0 4px 12px rgba(108,99,255,.2);margin-top:auto}
.subject-btn:hover{box-shadow:0 8px 20px rgba(108,99,255,.35);transform:translateY(-1px)}
.subject-btn svg{width:16px;height:16px;fill:currentColor}
.no-subjects{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);font-weight:700}

@media(max-width:768px){.brand small{display:none}.page-title{font-size:22px}}
</style>
</head>
<body>
<!-- شريط التقدم -->
<div id="scroll-progress"></div>

<header class="app-nav">
  <div class="app-nav-in">
    <div class="brand" onclick="window.location.href='index.html'">
      <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
      <span>ثانوية <span style="color:var(--blue)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
    </div>
    <div class="nav-right">
      <div class="profile-wrap"><button class="profile-btn" onclick="window.location.href='profile.html'"><span class="av" id="nav-av">?</span><span id="nav-name">—</span></button></div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="تبديل الثيم">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="top-header">
    <span class="tag"><svg viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5-9-5Z"/></svg> المواد الدراسية</span>
    <div class="page-title">مساء الخير يا <span class="name" id="main-name">—</span> 🌅</div>
    <div class="page-subtitle" id="subjects-count">جاري التحميل...</div>
  </div>

  <!-- تم حذف خانة المقولات من هنا -->

  <div class="subjects-grid" id="subjectsGrid">
    <div style="text-align:center;padding:40px;grid-column:1/-1;color:var(--muted)">جاري تحميل موادك...</div>
  </div>
</main>

<script>
(function() {
  'use strict';
  const API = '';
  const TOKEN_KEY = 'student_token';
  const TOKEN = localStorage.getItem(TOKEN_KEY);
  if (!TOKEN) { window.location.replace('login.html'); return; }

  const $ = id => document.getElementById(id);
  
  // شريط التقدم
  const progressBar = $('scroll-progress');
  window.addEventListener('scroll', () => {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    if (progressBar) progressBar.style.width = progress + '%';
  }, { passive: true });

  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  
  function getGreeting() {
    const h = new Date().getHours();
    if (h < 12) return 'صباح الخير يا';
    if (h < 18) return 'مساء الخير يا';
    return 'مساء الخير يا';
  }

  async function api(path, opts = {}) {
    const headers = { Accept: 'application/json', ...opts.headers };
    if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
    const res = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body });
    if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); window.location.replace('login.html'); return; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'خطأ في السيرفر');
    return data.data;
  }

  async function loadProfile() {
    try {
      const me = await api('/api/auth/me');
      if (me) {
        $('nav-name').textContent = me.name || 'طالب';
        $('nav-av').textContent = (me.name || 'ط').charAt(0);
        // تحديث الاسم في العنوان
        const greetTextNode = document.querySelector('.page-title');
        greetTextNode.innerHTML = `${getGreeting()} <span class="name" id="main-name">${esc(me.name || 'طالب')}</span> 🌅`;
      }
    } catch (e) {}
  }

  async function loadSubjects() {
    try {
      // تم إرجاع الرابط الأصلي اللي كان بيشتغل معاك
      const data = await api('/api/lectures/student/subjects');
      const subjects = (data.subjects || data || []);
      const grid = $('subjectsGrid');
      
      if (subjects.length === 0) {
        grid.innerHTML = `<div class="no-subjects">لا توجد مواد متاحة لك حالياً.</div>`;
        $('subjects-count').textContent = '0 مواد متاحة';
        return;
      }

      $('subjects-count').textContent = `${subjects.length} مواد متاحة`;

      grid.innerHTML = subjects.map((sub, i) => {
        const imageUrl = sub.image_url || sub.image || sub.cover || sub.thumbnail || 'https://via.placeholder.com/400x250?text=' + encodeURIComponent(sub.name);
        return `
          <article class="subject-card" style="animation-delay:${i * 0.05}s" onclick="window.location.href='teachers.html?subjectId=${sub.id}&subjectName=${encodeURIComponent(sub.name)}'">
            <div class="subject-thumb">
              <img src="${esc(imageUrl)}" alt="${esc(sub.name)}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x250?text=${encodeURIComponent(sub.name)}'">
              <div class="subject-thumb-overlay"></div>
            </div>
            <div class="subject-info">
              <h3>${esc(sub.name)}</h3>
              <p>مادة دراسية</p>
              <button class="subject-btn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                عرض المدرسين
              </button>
            </div>
          </article>
        `;
      }).join('');
    } catch (e) {
      $('subjectsGrid').innerHTML = `<div class="no-subjects" style="color:#ff5252">خطأ: ${esc(e.message)}</div>`;
    }
  }

  // تشغيل التحميل
  $('main-name').textContent = localStorage.getItem('student_name') || 'طالب';
  const greetTextNode = document.querySelector('.page-title');
  greetTextNode.innerHTML = `${getGreeting()} <span class="name" id="main-name">${esc(localStorage.getItem('student_name') || 'طالب')}</span> 🌅`;

  loadProfile();
  loadSubjects();
})();
</script>
<script src="theme.js"></script>
</body>
</html>
