<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>المواد | ثانوية club</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('thanawya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t === 'dark' ? '#070b14' : '#f8fafc');
  } catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"]{--bg:#070b14;--card:#121a2b;--card-hover:#182338;--card-inner:#0d1424;--ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.12);--line-soft:rgba(255,255,255,.05);--blue:#3b82f6;--blue2:#60a5fa;--blue3:#2563eb;--green:#10b981;--red:#ef4444;--purple:#8b5cf6;--nav-bg:rgba(7,11,20,.88);--bg-pattern:radial-gradient(circle at top right,rgba(59,130,246,.05),transparent 40%)}
[data-theme="light"]{--bg:#f8fafc;--card:#ffffff;--card-hover:#f1f5f9;--card-inner:#f1f5f9;--ink:#1e293b;--muted:#64748b;--line:rgba(108,99,255,.10);--line-soft:rgba(108,99,255,.05);--blue:#6c63ff;--blue2:#00d4ff;--blue3:#5a52d5;--green:#10b981;--red:#ef4444;--purple:#8b5cf6;--nav-bg:rgba(255,255,255,.88);--bg-pattern:radial-gradient(circle at top right,rgba(108,99,255,.05),transparent 40%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);background-image:var(--bg-pattern);color:var(--ink);font-family:Cairo,sans-serif;min-height:100vh;transition:background-color .35s,color .35s}
button{font:inherit;cursor:pointer;outline:none;border:none}
#scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#6c63ff,#00d4ff);width:0%;z-index:9999;transition:width .1s ease-out}
#scroll-progress-side{position:fixed;top:0;right:0;width:4px;background:linear-gradient(180deg,#6c63ff,#00d4ff);height:0%;z-index:9999;transition:height .1s ease-out;border-radius:0 0 0 4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.app-nav{position:sticky;top:0;z-index:40;background:var(--nav-bg);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);transition:background .35s}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#6c63ff,#00d4ff);box-shadow:0 8px 26px rgba(108,99,255,.35);color:white}
.brand .logo svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-3px}
.nav-right{display:flex;align-items:center;gap:10px;margin-right:auto}
.profile-wrap{position:relative}
.profile-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px 6px 6px;cursor:pointer;font-weight:800;font-size:14px;color:var(--ink);transition:.2s}
.profile-btn .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.theme-toggle{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.theme-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.theme-toggle .icon-sun{display:none}.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}[data-theme="dark"] .theme-toggle .icon-moon{display:none}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 90px}
.page-head{margin-bottom:20px}
.page-head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(108,99,255,.10);color:var(--blue);border:1px solid rgba(108,99,255,.2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;margin-bottom:10px}
.greeting{margin:0;font-size:24px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.name-span{font-size: 26px;font-weight: 900;background: linear-gradient(to right, #00d4ff, #3b82f6, #1e3a8a);-webkit-background-clip: text;background-clip: text;-webkit-text-fill-color: transparent;color: transparent;display: inline-block;}
[data-theme="dark"] .name-span {background: linear-gradient(to right, #00d4ff, #60a5fa, #3b82f6);-webkit-background-clip: text;background-clip: text;-webkit-text-fill-color: transparent;color: transparent;}
.page-head p{margin:12px 0 0;color:var(--ink);font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.page-head h1 .count{font-size:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:4px 14px;border-radius:99px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;margin-top:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;animation:fadeUp .45s ease both;position:relative;display:flex;flex-direction:column;box-shadow:0 4px 15px rgba(108,99,255,.05)}
.card:hover{transform:translateY(-8px);border-color:rgba(108,99,255,.35);box-shadow:0 20px 40px rgba(108,99,255,.15)}
.side-progress-bar{position:absolute;top:0;bottom:0;left:0;width:6px;background:rgba(0,0,0,.05);z-index:10;border-radius:0 0 0 24px}
.side-progress-bar .fill{position:absolute;top:0;left:0;width:100%;height:0%;background:linear-gradient(180deg,#10b981,#34d399,#6ee7b7);box-shadow:0 0 15px #34d399;transition:height 0.5s ease-in-out;border-radius:0 0 0 24px}
.card-img{width:100%;aspect-ratio:16/10;background:var(--card-inner);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;pointer-events:none}
.card-img img{width:100%;height:100%;object-fit:cover;object-position:center 80%;transition:transform .4s ease}
.card-img .ph{position:absolute;inset:0;display:none;place-items:center;background:var(--card-inner);color:var(--blue)}
.card-body{padding:20px;display:flex;flex-direction:column;flex:1;background:var(--card)}
.card-body h3{margin:0;font-size:20px;font-weight:900;margin-bottom:4px;color:var(--ink)}
.card-body .sub{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:20px}
.action-btn{width:100%;padding:12px;border-radius:14px;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;box-shadow:0 4px 12px rgba(108,99,255,.2)}
.action-btn svg{width:16px;height:16px;fill:currentColor}
.sk-card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.sk-img{width:100%;aspect-ratio:16/10;background:linear-gradient(90deg,var(--card-inner),var(--card-hover),var(--card-inner));background-size:800px 100%;animation:shimmer 1.5s infinite linear}
.sk-body{padding:20px}
.sk-line{height:14px;border-radius:6px;margin-bottom:10px;background:linear-gradient(90deg,var(--card-inner),var(--card-hover),var(--card-inner));background-size:800px 100%;animation:shimmer 1.5s infinite linear}
.sk-line.title{width:70%;height:18px;margin-bottom:8px}
.sk-line.sub{width:40%}
.sk-line.btn{width:100%;height:40px;margin-top:16px;border-radius:14px}
@media(max-width:700px){.grid{display:flex;flex-direction:column;gap:16px}.card{border-radius:20px;width:100%}.card-img{aspect-ratio:16/9}.card-body{padding:16px;align-items:center;text-align:center}.action-btn{width:100%;padding:14px}.brand small{display:none}#scroll-progress-side{width:3px}}
</style>
</head>
<body>
<div id="scroll-progress"></div><div id="scroll-progress-side"></div>
<header class="app-nav"><div class="app-nav-in">
  <div class="brand" onclick="window.location.href='index.html'">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
    <span>ثانوية <span style="color:var(--blue)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
  </div>
  <div class="nav-right">
    <div class="profile-wrap"><button type="button" class="profile-btn" onclick="window.location.href='profile.html'"><span class="av" id="nav-av">?</span><span id="nav-name">—</span></button></div>
    <button type="button" class="theme-toggle" data-theme-toggle><svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
  </div>
</div></header>
<main class="wrap" id="main">
  <div class="page-head">
    <div class="badge">المواد الدراسية</div>
    <h1 class="greeting" id="greeting">جاري التحميل...</h1>
    <p>موادك المتاحة <span class="count" id="subject-count" style="display:none">0</span></p>
  </div>
  <div class="grid" id="subjects-grid">
    <!-- سكيلتون -->
    <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line title"></div><div class="sk-line sub"></div><div class="sk-line btn"></div></div></div>
    <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line title"></div><div class="sk-line sub"></div><div class="sk-line btn"></div></div></div>
  </div>
</main>
<script>
(function(){
'use strict';
const API_BASE = '', TOKEN_KEY = 'student_token', token = localStorage.getItem(TOKEN_KEY);
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const subjectId = qs.get('subjectId') || '4';

// شريط التقدم
const progressBar = $('scroll-progress');
const progressBarSide = $('scroll-progress-side');
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
  if (progressBar) progressBar.style.width = progress + '%';
  if (progressBarSide) progressBarSide.style.height = progress + '%';
}, { passive: true });

const api = async (path, opts = {}) => {
  const headers = { Accept: 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { method: opts.method || 'GET', headers, body: opts.body });
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); window.location.replace('login.html'); return; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'خطأ');
  return data.data;
};
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function setGreeting(name){
  const hour = new Date().getHours();
  let greet = "صباح الخير"; 
  if (hour >= 18 || hour < 4) { greet = "مساء الخير"; }
  $('greeting').innerHTML = `${greet} يا <span class="name-span">${esc(name)}</span>`;
}

window.goToTeachers = function(url, cardEl) {
  const barFill = cardEl.querySelector('.side-progress-bar .fill');
  if(barFill) barFill.style.height = '100%';
  setTimeout(() => { window.location.href = url; }, 400); // سرعنا وقت النقل
};

async function init() {
  // 1. نعرض اسم الطالب من الكاش فوراً عشان نحس بالسرعة
  const cachedName = localStorage.getItem('student_name');
  if (cachedName) setGreeting(cachedName);

  try {
    // 2. نطلب الداتا والبروفايل في نفس الوقت (السرعة القصوى)
    const [subjects, me] = await Promise.all([
      api('/api/subjects/' + subjectId),
      cachedName ? Promise.resolve({name: cachedName}) : api('/api/auth/me').catch(()=>null)
    ]);

    // تحديث البروفايل
    if (me && me.name) {
      $('nav-name').textContent = me.name;
      $('nav-av').textContent = me.name.charAt(0);
      localStorage.setItem('student_name', me.name);
      if(!cachedName) setGreeting(me.name);
    }

    // عرض المواد
    if (!subjects || !subjects.length) { 
      $('subjects-grid').innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)">لا يوجد مواد متاحة.</div>`; 
      return; 
    }
    
    const countEl = $('subject-count');
    countEl.textContent = subjects.length;
    countEl.style.display = 'inline-block';
    
    $('subjects-grid').innerHTML = subjects.map(s => `
      <div class="card" id="card-${s.id}">
        <div class="side-progress-bar"><div class="fill"></div></div>
        <div class="card-img">
          ${s.image_url ? `<img src="${esc(s.image_url)}" alt="${esc(s.name)}" loading="lazy" onerror="this.style.display='none'">` : ''}
          <div class="ph" style="display:${s.image_url?'none':'grid'}"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
        </div>
        <div class="card-body">
          <h3>${esc(s.name)}</h3>
          <div class="sub">مادة دراسية</div>
          <button class="action-btn" onclick="goToTeachers('teachers.html?subjectId=${s.id}&subjectName=${encodeURIComponent(s.name)}', document.getElementById('card-${s.id}'))">عرض المدرسين<svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    $('subjects-grid').innerHTML = `<div style="text-align:center;color:var(--red);padding:40px">خطأ: ${esc(e.message)}</div>`;
  }
}
init();
})();
</script>
<script src="theme.js"></script>
</body>
</html>
