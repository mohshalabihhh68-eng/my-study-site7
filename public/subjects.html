<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>المواد | ثانوية club</title>
<script>
(function(){
  try {
    var t = localStorage.getItem('thanawya_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', t === 'dark' ? '#070b14' : '#f8fafc');
  } catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#070b14;--card:#121a2b;--card-hover:#182338;--card-inner:#0d1424;--ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.14);--blue:#7c74ff;--blue2:#22d3ee;--amber:#f59e0b;--red:#ef4444;--nav-bg:rgba(7,11,20,.85);--bg-pattern:radial-gradient(circle at top right,rgba(124,116,255,.12),transparent 45%),radial-gradient(circle at bottom left,rgba(34,211,238,.08),transparent 40%);--shadow:0 6px 22px rgba(0,0,0,.35);--mark:linear-gradient(100deg,rgba(124,116,255,.45),rgba(34,211,238,.38))}
[data-theme="light"]{--bg:#f8fafc;--card:#fff;--card-hover:#f1f5f9;--card-inner:#eef2f8;--ink:#1e293b;--muted:#64748b;--line:rgba(108,99,255,.12);--blue:#6c63ff;--blue2:#00d4ff;--nav-bg:rgba(255,255,255,.88);--bg-pattern:radial-gradient(circle at top right,rgba(108,99,255,.09),transparent 45%),radial-gradient(circle at bottom left,rgba(0,212,255,.07),transparent 40%);--shadow:0 6px 22px rgba(108,99,255,.08);--mark:linear-gradient(100deg,rgba(108,99,255,.20),rgba(0,212,255,.34))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);background-image:var(--bg-pattern);background-attachment:fixed;color:var(--ink);font-family:Cairo,system-ui,sans-serif;min-height:100vh;transition:background-color .35s,color .35s}
button,input{font:inherit;outline:none;border:none}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}

/* splash */
#splash{position:fixed;inset:0;z-index:10000;background:var(--bg);display:grid;place-items:center;transition:opacity .55s ease,visibility .55s}
#splash.hide{opacity:0;visibility:hidden}
.splash-in{text-align:center}
.splash-logo{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 14px 44px color-mix(in srgb,var(--blue) 45%,transparent);animation:float 1.6s ease-in-out infinite}
.splash-logo svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.7}
.splash-name{font-size:24px;font-weight:900}
.splash-name b{color:var(--blue)}
.splash-bar{width:190px;height:5px;border-radius:9px;background:var(--card-inner);margin:18px auto 0;overflow:hidden}
.splash-bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--blue2));animation:slide 1.1s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes slide{0%{transform:translateX(250%)}100%{transform:translateX(-250%)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes notif-in{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes badge-pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes notif-item{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

#scroll-progress{position:fixed;top:0;right:0;height:3px;background:linear-gradient(270deg,var(--blue),var(--blue2));width:0%;z-index:9999;transition:width .1s ease-out}

/* nav */
.app-nav{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:var(--nav-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,var(--blue),var(--blue2));box-shadow:0 8px 26px color-mix(in srgb,var(--blue) 35%,transparent);color:#fff}
.brand .logo svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:-3px}
.nav-right{display:flex;align-items:center;gap:8px;margin-right:auto;flex-direction:row}
/* في RTL: أول عنصر في الـ DOM يظهر يمين المجموعة — البروفايل آخر عنصر = أقصى الشمال */
.nav-right .profile-btn{order:3}
.nav-right .theme-toggle{order:2}
.nav-right .notif-wrap{order:1}
.profile-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 6px 6px 16px;font-weight:800;font-size:14px;color:var(--ink);transition:.2s}
.profile-btn:hover{border-color:var(--blue)}
.profile-btn .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.theme-toggle{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0;flex:none}
.theme-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.theme-toggle .icon-sun{display:none}.theme-toggle .icon-moon{display:block}
[data-theme="dark"] .theme-toggle .icon-sun{display:block}[data-theme="dark"] .theme-toggle .icon-moon{display:none}

/* ============ NOTIFICATION BELL ============ */
.notif-wrap{position:relative;flex:none}
.notif-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0;transition:border-color .2s,background .2s}
.notif-btn:hover{border-color:var(--blue);background:var(--card-hover)}
.notif-btn.active{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.notif-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.notif-badge{position:absolute;top:-5px;left:-5px;min-width:20px;height:20px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg);display:none;animation:badge-pop .35s cubic-bezier(.34,1.56,.64,1) forwards}
.notif-badge.show{display:grid}

/* dropdown */
.notif-panel{position:absolute;top:calc(100% + 10px);left:0;width:340px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);z-index:200;overflow:hidden;animation:notif-in .22s ease;display:none}
.notif-panel.open{display:block}
.notif-panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.notif-panel-head h3{margin:0;font-size:15px;font-weight:900}
.notif-read-all{font-size:12px;font-weight:800;color:var(--blue);background:none;border:none;cursor:pointer;padding:4px 10px;border-radius:8px;transition:.15s}
.notif-read-all:hover{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.notif-list{max-height:360px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.notif-list::-webkit-scrollbar{width:4px}.notif-list::-webkit-scrollbar-track{background:transparent}.notif-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.notif-item{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--line);animation:notif-item .25s ease backwards}
.notif-item:last-child{border-bottom:0}
.notif-item:hover{background:var(--card-hover)}
.notif-item.unread{background:color-mix(in srgb,var(--blue) 6%,var(--card))}
.notif-item.unread:hover{background:color-mix(in srgb,var(--blue) 10%,var(--card))}
.notif-thumb{width:46px;height:46px;border-radius:12px;flex:none;object-fit:cover;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;overflow:hidden}
.notif-thumb svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.notif-thumb img{width:100%;height:100%;object-fit:cover}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;margin-top:7px;transition:opacity .2s}
.notif-item:not(.unread) .notif-dot{opacity:0}
.notif-body{flex:1;min-width:0}
.notif-title{font-size:13px;font-weight:800;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.notif-sub{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.notif-time{font-size:10px;font-weight:700;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:4px}
.notif-time svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.notif-empty{padding:36px 18px;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.notif-empty svg{width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.5;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto}
.notif-footer{padding:12px 18px;border-top:1px solid var(--line);text-align:center}
.notif-footer button{font-size:13px;font-weight:800;color:var(--blue);background:none;border:none;cursor:pointer}
.notif-loading{padding:28px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}
.notif-loading::after{content:"";display:inline-block;width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
/* ============================================ */

/* hero */
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 70px}
.hello-sub{margin:0 0 6px;color:var(--muted);font-weight:700;font-size:14px}
.greeting{margin:0;font-size:clamp(26px,5vw,40px);font-weight:900;line-height:1.7;min-height:1.7em}
.hl{position:relative;display:inline-block;padding:0 .3em;z-index:0;white-space:nowrap}
.hl::before{content:"";position:absolute;inset:.5em -.15em .05em -.15em;z-index:-1;background:var(--mark);border-radius:.25em .9em .35em 1em;transform-origin:right center;transform:scaleX(0) rotate(-1.4deg)}
.hl::after{content:"";position:absolute;left:-.05em;right:-.05em;bottom:.04em;height:.12em;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2));transform-origin:right center;transform:scaleX(0)}
.go .hl::before{animation:mark 1.15s cubic-bezier(.65,0,.3,1) .25s forwards}
.go .hl::after{animation:ul .6s cubic-bezier(.65,0,.3,1) 1.05s forwards}
@keyframes mark{to{transform:scaleX(1) rotate(-1.4deg)}}
@keyframes ul{to{transform:scaleX(1)}}
.quote{margin:8px 0 0;color:var(--muted);font-weight:600;font-size:15px}

/* summary */
.summary{--accent:var(--blue);position:relative;display:grid;grid-template-columns:1.2fr 1fr;margin-top:26px;border-radius:26px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.summary.warn{--accent:var(--amber)}
.summary.danger{--accent:var(--red)}
.summary::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;z-index:2;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 35%,var(--blue2)))}
.summary::after{content:"";position:absolute;width:260px;height:260px;right:-80px;top:-110px;border-radius:50%;background:var(--accent);opacity:.09;filter:blur(8px);pointer-events:none}
.sum-days{position:relative;z-index:1;display:flex;align-items:center;gap:18px;padding:24px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(90deg) scaleX(-1)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bg{stroke:var(--card-inner)}
.ring .fg{stroke:var(--accent);stroke-dasharray:176;stroke-dashoffset:176;transition:stroke-dashoffset 1.4s cubic-bezier(.3,.8,.3,1) .3s}
.ring .ico{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent)}
.ring .ico svg{width:30px;height:30px;transform:none;fill:none;stroke:currentColor;stroke-width:1.9}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.num{font-size:38px;font-weight:900;line-height:1.1;margin-top:2px}
.num small{font-size:16px;font-weight:800;color:var(--muted);margin-right:6px}
.chip{display:inline-block;margin-top:8px;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.date{display:block;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.sum-stats{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;border-right:1px solid var(--line)}
.mini{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:20px 12px;text-align:center}
.mini+.mini{border-right:1px solid var(--line)}
.mini-ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 8px 20px color-mix(in srgb,var(--blue) 30%,transparent)}
.mini-ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mini-num{font-size:30px;font-weight:900;line-height:1}
.mini-num.loading{opacity:.4}
.mini-lbl{font-size:12px;font-weight:700;color:var(--muted)}

/* cards */
.sec-head{display:flex;align-items:center;margin-top:34px}
.sec-head h2{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:10px}
.count{font-size:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:3px 13px;border-radius:99px;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin-top:20px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;-webkit-touch-callout:none;transition:transform .3s ease,border-color .3s,box-shadow .3s,opacity .3s;animation:rise .5s ease backwards;animation-delay:calc(var(--i,0)*70ms)}
.card:hover{transform:translateY(-8px);border-color:color-mix(in srgb,var(--blue) 45%,transparent);box-shadow:0 22px 44px color-mix(in srgb,var(--blue) 22%,transparent)}
.card:hover .card-img img{transform:scale(1.07)}
.card:active{transform:scale(.985)}
.card.opening{transform:scale(.98);opacity:.92}
.card-img{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center}
.card-img,.card-img *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 80%;transition:transform .5s ease;pointer-events:none;-webkit-user-drag:none}
.card-img .ph{color:rgba(255,255,255,.9)}
.card-img .ph svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:1.5}
.card-img::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to top,rgba(0,0,0,.28),transparent);pointer-events:none}
.card-img::before{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.card-body h3{margin:0 0 8px;font-size:20px;font-weight:900}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;min-height:28px}
.chip-mini{display:inline-flex;align-items:center;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:800;color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.action-btn{width:100%;margin-top:auto;padding:12px;border-radius:14px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 30%,transparent);transition:gap .2s,filter .2s}
.action-btn:hover{gap:14px;filter:brightness(1.07)}
.action-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;transform:scaleX(-1)}
.action-btn.is-loading{pointer-events:none}
.action-btn.is-loading svg{display:none}
.action-btn.is-loading::after{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite}
body.leaving main{opacity:0;transform:translateY(-8px);transition:opacity .26s,transform .26s}

/* skeleton */
.sk-card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.sk-img,.sk-line{background:linear-gradient(90deg,var(--card-inner),var(--card-hover),var(--card-inner));background-size:800px 100%;animation:shimmer 1.4s infinite linear}
.sk-img{width:100%;aspect-ratio:16/10}
.sk-body{padding:20px}
.sk-line{height:14px;border-radius:6px;margin-bottom:10px}
.sk-line.t{width:70%;height:18px}.sk-line.s{width:40%}.sk-line.b{width:100%;height:42px;margin-top:16px;border-radius:14px}
.state{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);font-weight:700}
.state.err{color:var(--red)}
.state button{margin-top:14px;padding:10px 22px;border-radius:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2))}

.foot{text-align:center;color:var(--muted);font-weight:700;font-size:13px;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px))}
.foot b{color:var(--blue)}
.to-top{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 10px 24px color-mix(in srgb,var(--blue) 35%,transparent);opacity:0;visibility:hidden;transform:translateY(10px);transition:.25s;z-index:30}
.to-top.show{opacity:1;visibility:visible;transform:none}

@media(max-width:700px){
  .app-nav-in{padding:10px 12px;gap:6px}.brand small{display:none}
  .profile-btn #nav-name{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .summary{grid-template-columns:1fr;border-radius:22px}
  .sum-days{padding:20px}
  .sum-stats{border-right:0;border-top:1px solid var(--line)}
  .mini{padding:16px 8px}
  .num{font-size:32px}
  .grid{grid-template-columns:1fr;gap:16px}
  .card{border-radius:20px}.card-img{aspect-ratio:16/9}
  .notif-panel{width:300px;left:auto;right:0}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="splash" role="status" aria-label="جاري التحميل">
  <div class="splash-in">
    <div class="splash-logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></div>
    <div class="splash-name">ثانوية <b>club</b></div>
    <div class="splash-bar"><i></i></div>
  </div>
</div>

<div id="scroll-progress"></div>

<header class="app-nav"><div class="app-nav-in">
  <div class="brand" onclick="window.location.href='index.html'">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg></span>
    <span>ثانوية <span style="color:var(--blue)">club</span><small>مستقبلك الدراسي في مكان واحد</small></span>
  </div>
  <div class="nav-right">
    <!-- ترتيب RTL: الثيم ثم الإشعارات ثم البروفايل → البروفايل على الشمال والأزرار يمينه -->

<script>
(function(){
'use strict';
const API_BASE = '', TOKEN_KEY = 'student_token', token = localStorage.getItem(TOKEN_KEY);
const $ = id => document.getElementById(id);
const yearId = new URLSearchParams(location.search).get('subjectId') || '4';
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const H = 36e5, D = 864e5, STD = [3, 7, 15, 30, 45, 60, 90, 120, 180, 365];

const norm = s => String(s || '').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,'').toLowerCase().trim();
const HIDDEN = ['عبدالله الحبشي'].map(norm);

const isHidden = n => HIDDEN.includes(norm(n));

/* ---- فلترة المواد حسب شعبة الطالب (نفس السيرفر) ---- */
const SECTION_KINDS = {
  scientific_sciences: ["arabic", "english", "physics", "chemistry", "biology"],
  scientific_math: ["arabic", "english", "physics", "chemistry", "math"],
  literary: ["arabic", "english", "history", "geography", "statistics"],
  languages: ["arabic", "english", "french", "german"],
  azhari: ["arabic", "english", "physics", "chemistry", "biology", "math", "history", "geography", "statistics", "fiqh", "tawhid", "tafsir", "hadith", "quran", "sharia_other"]
};
function normalizeSectionClient(raw){
  const s = String(raw || "").trim().toLowerCase().replace(/\s+/g, "_");
  if (!s) return "scientific_sciences";
  if (["scientific_sciences","scientific_math","literary","azhari","languages"].includes(s)) return s;
  if (/علوم/.test(s) && !/رياض/.test(s)) return "scientific_sciences";
  if (/رياض/.test(s)) return "scientific_math";
  if (/أدب|ادب|literary/.test(s)) return "literary";
  if (/أزهر|ازهر|azhar/.test(s)) return "azhari";
  if (/لغات|language/.test(s)) return "languages";
  return s;
}
function subjectKindClient(name){
  const n = String(name || "");
  if (/إحصاء|احصاء|statistics/i.test(n)) return "statistics";
  if (/تاريخ|history/i.test(n)) return "history";
  if (/جغراف|geography/i.test(n)) return "geography";
  if (/فقه/i.test(n)) return "fiqh";
  if (/توحيد|عقيدة/i.test(n)) return "tawhid";
  if (/تفسير/i.test(n)) return "tafsir";
  if (/حديث/i.test(n)) return "hadith";
  if (/قرآن|تجويد|قراءات/i.test(n)) return "quran";
  if (/عربي|عربية|arabic/i.test(n)) return "arabic";
  if (/english|إنجل|انجليز/i.test(n)) return "english";
  if (/كيمياء|chemistry/i.test(n)) return "chemistry";
  if (/فيزياء|physics/i.test(n)) return "physics";
  if (/أحياء|احياء|biology/i.test(n)) return "biology";
  if (/رياض|math|جبر|تفاضل|استاتيكا|ديناميكا/i.test(n)) return "math";
  if (/فرنس|french/i.test(n)) return "french";
  if (/ألمان|المان|german/i.test(n)) return "german";
  return "other";
}
function filterSubjectsBySection(list, section){
  const sec = normalizeSectionClient(section);
  const wanted = SECTION_KINDS[sec] || SECTION_KINDS.scientific_sciences;
  const byKind = new Map();
  for (const s of list || []) {
    const kind = s._kind || subjectKindClient(s.name);
    if (!wanted.includes(kind)) continue;
    if (!byKind.has(kind)) byKind.set(kind, s);
  }
  // لو الفلتر صفّر بالغلط (أسماء غريبة) — رجّع اللي الاسم واضح إنه ضمن الشعبة فقط مش الكل
  let out = wanted.map(k => byKind.get(k)).filter(Boolean);
  if (!out.length && (list || []).length) {
    out = (list || []).filter(s => wanted.includes(subjectKindClient(s.name)));
  }
  return out;
}
let studentSection = "scientific_sciences";


const QUOTES = ['الخطوة الصغيرة كل يوم أحسن من حماس يوم واحد.','اللي بيذاكر النهارده بيرتاح بكرة.','ركّز في حصة واحدة وخلّصها، والباقي هيمشي.','مفيش حد بيوصل من غير ما يبدأ.','اشرب مياه، خد استراحة، وارجع أقوى.','كل فصل بتخلصه بيقرّبك من حلمك.','التعب مؤقت، والنتيجة بتفضل.','ابدأ بأصعب حاجة وهتلاقي الباقي أسهل.','تنظيم وقتك نص النجاح.','أنت أقدر مما تتخيل.'];
const dayQuote = () => { const d = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0)) / D); return QUOTES[d % QUOTES.length]; };

const bar = $('scroll-progress'), toTop = $('to-top');
addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
  toTop.classList.toggle('show', scrollY > 500);
}, { passive: true });
toTop.addEventListener('click', () => scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }));

const api = async (path) => {
  const headers = { Accept: 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { headers });
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); location.replace('login.html'); return; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'حصل خطأ');
  return data.data;
};

function countUp(el, to){
  if (reduce || to <= 0) { el.textContent = to; return; }
  const t0 = performance.now(), dur = 900;
  (function f(t){
    const p = Math.min((t - t0) / dur, 1);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(f);
  })(t0);
}

function setGreeting(name){
  const h = new Date().getHours();
  $('time-greet').textContent = h >= 18 || h < 4 ? 'مساء الخير 🌙' : (h < 12 ? 'صباح الخير ☀️' : 'نهارك سعيد 🌤️');
  $('greeting').innerHTML = '<span class="hl">أهلاً بك يا ' + esc(name) + '</span>';
}

function findDays(me){
  if (!me) return null;
  const srcs = [me, me.subscription, me.sub, me.student, me.user].filter(Boolean);
  const numKeys = ['days_left','daysLeft','remaining_days','remainingDays','days_remaining','daysRemaining'];
  const dateKeys = ['expiresAt','expires_at','subscription_end','subscriptionEnd','subscription_ends_at','subscription_expires_at','expiry_date','expiry','end_date','endDate','expires'];
  for (const s of srcs){
    for (const k of numKeys){ if (s[k] != null && s[k] !== '' && !isNaN(+s[k])) { const ms = Math.max(0, +s[k]) * D; return { ms, end: new Date(Date.now() + ms) }; } }
    for (const k of dateKeys){
      if (!s[k]) continue;
      const v = /^\d{10,}$/.test(String(s[k])) ? +s[k] : s[k];
      const end = new Date(v);
      if (!isNaN(end)) return { ms: Math.max(0, end - Date.now()), end };
    }
  }
  return null;
}

function renderDays(info){
  const box = $('summary'), num = $('days-num'), chip = $('days-chip'), fg = $('ring-fg'), unit = $('days-unit'), lbl = $('days-lbl'), date = $('days-date');
  box.classList.remove('warn','danger');
  if (!info){
    num.textContent = '∞'; unit.textContent = ''; chip.textContent = 'اشتراك مفتوح'; date.textContent = '';
    fg.style.strokeDashoffset = 0; return;
  }
  const ms = info.ms, inHours = ms < D;
  const val = inHours ? (ms > 0 ? Math.max(1, Math.ceil(ms / H)) : 0) : Math.ceil(ms / D);
  lbl.textContent = inHours ? 'الساعات المتبقية في اشتراكك' : 'الأيام المتبقية في اشتراكك';
  const many = val >= 3 && val <= 10;
  unit.textContent = inHours ? (many ? 'ساعات' : 'ساعة') : (many ? 'أيام' : 'يوم');
  countUp(num, val);
  const days = ms / D;
  if (ms <= 0){ box.classList.add('danger'); chip.textContent = 'اشتراكك خلص — جدّده'; }
  else if (days <= 7){ box.classList.add('danger'); chip.textContent = 'قرّب ينتهي — جدّد دلوقتي'; }
  else if (days <= 30){ box.classList.add('warn'); chip.textContent = 'باقي أقل من شهر'; }
  else chip.textContent = 'اشتراكك شغال تمام';
  date.textContent = info.end && ms > 0 ? 'ينتهي في ' + info.end.toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const base = inHours ? 24 : (STD.find(x => x >= val) || val || 1);
  const ratio = Math.min(1, val / base);
  requestAnimationFrame(() => { fg.style.strokeDashoffset = 176 * (1 - ratio); });
  try { localStorage.setItem('student_days', String(val)); } catch(e){}
}

/* ======================================================
   NOTIFICATION SYSTEM
   • مسح كل المواد × كل المدرسين × كل الفصول
   • أول مسح = baseline بدون إشعارات
   • أي محاضرة جديدة تظهر فوراً — الأحدث فوق
   • زر التحديث بدون سباق / تخبيط
   ====================================================== */

const NOTIF_KNOWN_KEY = 'notif_known_v7';
const NOTIF_ITEMS_KEY = 'notif_items_v7';
const NOTIF_READ_KEY  = 'notif_read_v7';
const POLL_INTERVAL_MS = 90_000;
const NOTIF_CONCURRENCY = 4;

let notifItems  = [];
let knownIds    = new Set();
let readIds     = new Set();
let subjectList = [];
let teacherMap  = {};
let chapterMap  = {};
let pollTimer   = null;
let panelOpen   = false;
let polling     = false;
let pollGen     = 0;
let seeded      = false;

function notifKey(base){
  return base + '_' + normalizeSectionClient(studentSection);
}
function loadNotifState(){
  try {
    const k = JSON.parse(localStorage.getItem(notifKey(NOTIF_KNOWN_KEY)) || '[]');
    knownIds = new Set(Array.isArray(k) ? k.map(String) : []);
    seeded = knownIds.size > 0;
  } catch(e){ knownIds = new Set(); seeded = false; }
  try {
    const r = JSON.parse(localStorage.getItem(notifKey(NOTIF_READ_KEY)) || '[]');
    readIds = new Set(Array.isArray(r) ? r.map(String) : []);
  } catch(e){ readIds = new Set(); }
  try {
    const items = JSON.parse(localStorage.getItem(notifKey(NOTIF_ITEMS_KEY)) || '[]');
    notifItems = Array.isArray(items) ? items : [];
    notifItems.forEach(n => { n.unread = !readIds.has(String(n.id)); });
  } catch(e){ notifItems = []; }
}

function saveNotifState(){
  try {
    localStorage.setItem(notifKey(NOTIF_KNOWN_KEY), JSON.stringify([...knownIds].slice(-2000)));
    localStorage.setItem(notifKey(NOTIF_READ_KEY), JSON.stringify([...readIds].slice(-1000)));
    notifItems = sortNotifNewestFirst(notifItems);
    localStorage.setItem(notifKey(NOTIF_ITEMS_KEY), JSON.stringify(notifItems.slice(0, 200)));
  } catch(e){}
}

function unreadCount(){ return notifItems.filter(n => n.unread).length; }

function updateBadge(){
  const badge = $('notif-badge'), n = unreadCount();
  if (!badge) return;
  badge.textContent = n > 9 ? '9+' : String(n);
  badge.classList.toggle('show', n > 0);
}

function parseLectureDate(lec){
  if (!lec || typeof lec !== 'object') return 0;
  const keys = ['published_at','created_at','updated_at','released_at','date','createdAt','publishedAt','uploaded_at','time'];
  for (const k of keys) {
    const v = lec[k];
    if (v == null || v === '') continue;
    if (typeof v === 'number' && v > 1e11) return v;          // ms
    if (typeof v === 'number' && v > 1e9) return v * 1000;   // sec
    const t = Date.parse(String(v));
    if (!Number.isNaN(t) && t > 0) return t;
  }
  return 0;
}
function relativeTime(ts){
  const t = Number(ts) || 0;
  // تجاهل تواريخ باطلة أو قديمة جدًا (قبل 2018) عشان متظهرش ١ يناير ١٩٧٠
  if (t < 1514764800000) return '';
  const diff = Date.now() - t;
  if (diff < 0) return 'الآن';
  if (diff < 60e3) return 'الآن';
  if (diff < 3600e3) return Math.floor(diff / 60e3) + ' دقيقة';
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' ساعة';
  if (diff < 7 * 86400e3) return Math.floor(diff / 86400e3) + ' يوم';
  if (diff < 30 * 86400e3) return Math.floor(diff / 86400e3) + ' يوم';
  return new Date(t).toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short', year: 'numeric' });
}

/** ترتيب الأحدث → الأقدم (معرّف المحاضرة كمقياس تقريبي للحداثة) */
function lectureRecency(n){
  if (n && n.recency) return Number(n.recency) || 0;
  const raw = String((n && (n.lectureId || n.id)) || '');
  const digits = raw.replace(/\D/g, '');
  if (digits.length) return Number(digits.slice(-10)) || 0;
  return 0;
}
function sortNotifNewestFirst(list){
  return (list || []).slice().sort((a, b) => {
    // تاريخ حقيقي أولاً لو موجود
    const ta = Number(a && a.at) || 0, tb = Number(b && b.at) || 0;
    if (ta >= 1514764800000 && tb >= 1514764800000 && ta !== tb) return tb - ta;
    const rb = lectureRecency(b) - lectureRecency(a);
    if (rb) return rb;
    return tb - ta;
  });
}

function renderNotifList(){
  const list = $('notif-list');
  if (!list) return;
  notifItems = sortNotifNewestFirst(notifItems);
  if (!notifItems.length){
    list.innerHTML = `<div class="notif-empty">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      مفيش إشعارات جديدة دلوقتي
    </div>`;
    return;
  }
  list.innerHTML = notifItems.slice(0, 50).map((n, i) => `
    <div class="notif-item ${n.unread ? 'unread' : ''}"
         data-id="${esc(n.id)}"
         data-subject="${esc(n.subjectId)}"
         data-subject-name="${esc(n.subjectName)}"
         data-lecture="${esc(n.lectureId)}"
         data-chapter="${esc(n.chapterId || '')}"
         style="animation-delay:${Math.min(i, 12) * 30}ms"
         role="button" tabindex="0" aria-label="${esc(n.lectureTitle)} — ${esc(n.teacherName)}">
      <div class="notif-thumb">
        ${n.imageUrl ? `<img src="${esc(n.imageUrl)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<svg viewBox=&quot;0 0 24 24&quot;><path d=&quot;M4 19.5A2.5 2.5 0 0 1 6.5 17H20&quot;/><path d=&quot;M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z&quot;/></svg>'">` :
          `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`}
      </div>
      <div class="notif-body">
        <div class="notif-title">${esc(n.lectureTitle)}</div>
        <div class="notif-sub">${esc(n.subjectName)} · ${esc(n.teacherName)}${n.chapterName ? ' · ' + esc(n.chapterName) : ''}</div>
        ${relativeTime(n.at) ? `<div class="notif-time">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          ${relativeTime(n.at)}
        </div>` : ''}
      </div>
      <div class="notif-dot"></div>
    </div>`).join('');
}

function openNotifItem(el){
  if (!el) return;
  const id = el.dataset.id;
  const item = notifItems.find(n => n.id === id);
  if (item) item.unread = false;
  readIds.add(String(id));
  saveNotifState();
  updateBadge();
  renderNotifList();
  closePanel();

  const lectureId   = (item && item.lectureId) || el.dataset.lecture || '';
  const lectureName = (item && item.lectureTitle) || '';
  const teacherName = (item && item.teacherName) || '';
  const subjectName = (item && item.subjectName) || el.dataset.subjectName || '';
  const chapterName = (item && item.chapterName) || '';
  const chapterId   = (item && item.chapterId) || el.dataset.chapter || '';

  if (lectureId) {
    let url = 'player.html?lectureId=' + encodeURIComponent(lectureId)
      + '&lectureName=' + encodeURIComponent(lectureName)
      + '&teacherName=' + encodeURIComponent(teacherName)
      + '&subjectName=' + encodeURIComponent(subjectName);
    if (chapterName) url += '&chapterName=' + encodeURIComponent(chapterName);
    if (chapterId) url += '&chapterId=' + encodeURIComponent(chapterId);
    location.href = url;
    return;
  }
  if (chapterId) {
    location.href = 'lectures.html?chapterId=' + encodeURIComponent(chapterId)
      + '&chapterName=' + encodeURIComponent(chapterName)
      + '&teacherName=' + encodeURIComponent(teacherName)
      + '&subjectName=' + encodeURIComponent(subjectName);
    return;
  }
  const subjectId = (item && item.subjectId) || el.dataset.subject || '';
  if (subjectId) {
    location.href = 'teachers.html?subjectId=' + encodeURIComponent(subjectId)
      + '&subjectName=' + encodeURIComponent(subjectName);
  }
}

}
function closePanel(){
  panelOpen = false;
  const btn = $('notif-btn'), panel = $('notif-panel');
  if (btn) { btn.classList.remove('active'); btn.setAttribute('aria-expanded', 'false'); }
  if (panel) panel.classList.remove('open');
}
function togglePanel(){ if (panelOpen) closePanel(); else openPanel(); }

(function bindNotifUI(){
  const list = $('notif-list');
  if (list) {
    list.addEventListener('click', e => {
      const item = e.target.closest('.notif-item[data-id]');

    });

      const item = e.target.closest('.notif-item[data-id]');
      if (item) { e.preventDefault(); openNotifItem(item); }
    });
  }
  const btn = $('notif-btn');
  if (btn) btn.addEventListener('click', e => { e.stopPropagation(); togglePanel(); });
  const readAll = $('notif-read-all');
  if (readAll) readAll.addEventListener('click', e => {
    e.stopPropagation();
    notifItems.forEach(n => { n.unread = false; readIds.add(String(n.id)); });

    updateBadge();

  });

  if (refresh) refresh.addEventListener('click', e => {

  });

async function fetchSubjectsOnce(){
  if (subjectList.length) return subjectList;
  const data = await api('/api/subjects/' + yearId);
  const raw = Array.isArray(data) ? data : [];
  // مواد الشعبة فقط — نفس اللي ظاهر في صفحة المواد
  subjectList = filterSubjectsBySection(raw, studentSection);
  return subjectList;
}

/** فلترة المدرسين حسب الشعبة — نفس منطق صفحة المدرسين / السيرفر */
function filterTeachersForSection(teachers, section, subjectName){
  const sec = normalizeSectionClient(section);
  const kind = subjectKindClient(subjectName);
  let list = (teachers || []).filter(t => t && t.id != null && !isHidden(t.name));
  const nameOf = t => String(t.name || "");
  const isSaeed = t => /سعيد\s*الفقي|سعيد\s*الفقى|سعيد\s*الفي/i.test(nameOf(t));
  const isMohamedOrReda = t => /رضا\s*الفاروق|محمد\s*صلاح/i.test(nameOf(t));

  if (kind === "arabic") {
    if (sec === "azhari") {
      // أزهر عربي → سعيد الفقي فقط (من غير محمد صلاح ورضا الفاروق)
      list = list.filter(isSaeed);
    } else {
      // علمي علوم / رياضة / أدبي → محمد صلاح ورضا يظهروا، سعيد الفقي (أزهر) يختفي
      list = list.filter(t => !isSaeed(t));
    }
  } else if (sec === "azhari") {
    // مواد أزهر غير العربي: استبعد محمد صلاح ورضا لو ظهروا بالغلط
    list = list.filter(t => !isMohamedOrReda(t));
  }
  // غير الأزهر: محمد صلاح ورضا يفضلوا ظاهرين في أي مادة
  return list;
}

async function fetchTeachersFor(subjectId, useCache, subjectName){
  const cacheKey = String(subjectId) + '::' + normalizeSectionClient(studentSection);
  if (useCache && teacherMap[cacheKey]) return teacherMap[cacheKey];
  const data = await api('/api/subjects/' + encodeURIComponent(subjectId) + '/teachers').catch(() => null);
  let teachers = [];
  if (Array.isArray(data)) teachers = data;
  else if (data && Array.isArray(data.teachers)) teachers = data.teachers;
  teachers = filterTeachersForSection(teachers, studentSection, subjectName || '');
  teacherMap[cacheKey] = teachers;
  return teachers;
}

async function fetchChaptersFor(teacherId, useCache){
  if (useCache && chapterMap[teacherId]) return chapterMap[teacherId];
  const data = await api('/api/teachers/' + encodeURIComponent(teacherId) + '/chapters').catch(() => null);
  let chapters = [];
  if (Array.isArray(data)) chapters = data;
  else if (data && Array.isArray(data.data)) chapters = data.data;
  chapterMap[teacherId] = chapters;
  return chapters;
}

async function fetchLecturesFor(chapterId){
  const data = await api('/api/chapters/' + encodeURIComponent(chapterId) + '/lectures').catch(() => null);
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.data)) return data.data;
  return [];
}

async function mapPool(items, limit, fn){
  const results = new Array(items.length);
  let i = 0;
  async function worker(){
    while (i < items.length){
      const idx = i++;
      try { results[idx] = await fn(items[idx], idx); }
      catch (e) { results[idx] = null; }
    }
  }
  const n = Math.min(limit, Math.max(1, items.length || 1));
  await Promise.all(Array.from({ length: n }, () => worker()));
  return results;
}

function setRefreshBusy(on){
  const btn = $('notif-refresh');
  if (!btn) return;
  btn.disabled = !!on;
  btn.textContent = on ? 'جاري التحديث…' : 'تحديث الآن';
}

async function pollNotifications(force = false){
  if (polling && !force) return;
  const myGen = ++pollGen;
  polling = true;
  if (force) {
    teacherMap = {};
    chapterMap = {};
    setRefreshBusy(true);
  }
  try {
    const subjects = await fetchSubjectsOnce();
    if (myGen !== pollGen) return;
    if (!subjects.length) return;

    const discovered = [];
    const stamp = Date.now();

    // كل المواد × كل المدرسين × كل الفصول
    await mapPool(subjects, NOTIF_CONCURRENCY, async (subj) => {
      if (myGen !== pollGen) return;
      const teachers = await fetchTeachersFor(subj.id, !force, subj.name).catch(() => []);
      if (myGen !== pollGen) return;
      await mapPool(teachers, NOTIF_CONCURRENCY, async (teacher) => {
        if (myGen !== pollGen) return;
        const chapters = await fetchChaptersFor(teacher.id, !force).catch(() => []);
        if (myGen !== pollGen) return;
        for (const ch of chapters) {
          if (myGen !== pollGen) return;
          const lectures = await fetchLecturesFor(ch.id).catch(() => []);
          for (const lec of lectures) {
            const lecId = String(lec.id || lec.video_id || lec.videoId || '');
            if (!lecId) continue;
            const notifId = String(subj.id) + '_' + lecId;
            const realAt = parseLectureDate(lec);
            discovered.push({
              id: notifId,
              lectureId: lecId,
              lectureTitle: lec.name || lec.title || 'محاضرة جديدة',
              teacherName: teacher.name || '',
              teacherId: String(teacher.id || ''),
              chapterId: String(ch.id || ''),
              chapterName: ch.name || ch.title || '',
              subjectId: String(subj.id || ''),
              subjectName: subj.name || '',
              imageUrl: lec.image_url || teacher.image_url || subj.image_url || null,
              at: realAt || 0,
              recency: lectureRecency({ lectureId: lecId }) || 0,
              unread: true
            });
          }
        }
      });
    });

    if (myGen !== pollGen) return;

    // ابنِ قائمة الإشعارات من كل المحاضرات المكتشفة (كل المدرسين/الفصول تحت مواد الشعبة)
    const byId = new Map(notifItems.map(n => [String(n.id), n]));
    const firstFill = !seeded;
    let addedNew = 0;

    for (const n of discovered) {
      const id = String(n.id);
      knownIds.add(id);
      const prev = byId.get(id);
      if (prev) {
        // حدّث البيانات مع الحفاظ على حالة القراءة
        prev.lectureTitle = n.lectureTitle || prev.lectureTitle;
        prev.teacherName = n.teacherName || prev.teacherName;
        prev.chapterName = n.chapterName || prev.chapterName;
        prev.subjectName = n.subjectName || prev.subjectName;
        prev.imageUrl = n.imageUrl || prev.imageUrl;
        prev.chapterId = n.chapterId || prev.chapterId;
        prev.unread = !readIds.has(id);
        continue;
      }
      // محاضرة جديدة في القائمة — at = تاريخ حقيقي فقط (مش ID)
      if (!(Number(n.at) >= 1514764800000)) n.at = 0;
      if (!n.recency) n.recency = lectureRecency(n);
      if (firstFill) {
        n.unread = false;
        readIds.add(id);
      } else {
        n.unread = true;
        // لو مفيش تاريخ من السيرفر، وقت الاكتشاف = الآن
        if (!(Number(n.at) >= 1514764800000)) n.at = Date.now();
        addedNew++;
      }
      byId.set(id, n);
    }

    seeded = true;
    notifItems = sortNotifNewestFirst([...byId.values()]).slice(0, 200);
    saveNotifState();
    updateBadge();
    if (panelOpen) renderNotifList();
    if (force && !addedNew && panelOpen) {
      // التحديث يدوي لسه يعرض القائمة كاملة مرتبة
      renderNotifList();
    }
  } catch (e) {
    console.warn('[notif poll]', e && e.message);
  } finally {
    if (myGen === pollGen) {
      polling = false;
      setRefreshBusy(false);
    }
  }
}

function startPolling(){
  pollNotifications(false);
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => pollNotifications(false), POLL_INTERVAL_MS);
}

/* subjects, counts, meta */
const subjMeta = new Map();
const countOf = th => {
  for (const k of ['chapter_count','chapters_count','count']){
    if (th && th[k] != null && th[k] !== '' && !isNaN(+th[k])) return +th[k];
  }
  return null;
};
const ccGet = id => {
  try { const o = JSON.parse(sessionStorage.getItem('chc_' + id) || 'null'); if (o && Date.now() - o.t < 6e5) return o.n; } catch(e){}
  return null;
};
async function pool(items, n, fn){
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length){ const idx = i++; out[idx] = await fn(items[idx]).catch(() => null); }
  }));
  return out;
}
async function fetchTeachersSubj(s){
  const t = await api('/api/subjects/' + encodeURIComponent(s.id) + '/teachers');
  return Array.isArray(t) ? t : ((t && Array.isArray(t.teachers)) ? t.teachers : []);
}
async function loadCounts(list){
  const rows = await pool(list, 3, async s => {
    const teachers = (await fetchTeachersSubj(s)).filter(th => th && !isHidden(th.name));
    let chapters = 0; const unknown = [];
    teachers.forEach(th => { const c = ccGet(th.id); const v = c != null ? c : countOf(th); if (v == null) unknown.push(th); else chapters += v; });
    if (unknown.length){
      const extra = await pool(unknown, 3, th => api('/api/teachers/' + encodeURIComponent(th.id) + '/chapters'));
      extra.forEach(a => { if (Array.isArray(a)) chapters += a.length; });
    }
    return { id: s.id, teachers: teachers.length, chapters };
  });
  return rows.filter(Boolean);
}
function metaHtml(id){
  const m = subjMeta.get(String(id));
  if (!m) return '<span class="chip-mini">مادة دراسية</span>';
  return '<span class="chip-mini">' + m.teachers + ' مدرس</span><span class="chip-mini">' + m.chapters + ' فصل</span>';
}
function applyMeta(){
  document.querySelectorAll('.card[data-id] .meta').forEach(el => { el.innerHTML = metaHtml(el.closest('.card').dataset.id); });
}
function renderCounts(list){
  const cn = $('courses-num'), tn = $('teachers-num');
  const done = () => [cn, tn].forEach(el => el.classList.remove('loading'));
  if (!list.length){ cn.textContent = '0'; tn.textContent = '0'; done(); return; }
  loadCounts(list).then(rows => {
    done();
    if (!rows.length){ cn.textContent = '—'; tn.textContent = '—'; $('courses-lbl').textContent = 'تعذّر قراءة الفصول'; return; }
    rows.forEach(r => subjMeta.set(String(r.id), r));
    applyMeta();
    const c = rows.reduce((a, r) => a + r.chapters, 0), t = rows.reduce((a, r) => a + r.teachers, 0);
    countUp(cn, c); countUp(tn, t);
    try { localStorage.setItem('student_counts', JSON.stringify({ c, t })); } catch(e){}
  });
}

function renderSubjects(list){
  const grid = $('subjects-grid');
  grid.innerHTML = list.map((s, i) => `
    <div class="card" id="card-${esc(s.id)}" data-id="${esc(s.id)}" data-name="${esc(s.name)}" role="link" tabindex="0" aria-label="${esc(s.name)} — عرض المدرسين" style="--i:${i}">
      <div class="card-img">
        <div class="ph"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
        ${s.image_url ? `<img src="${esc(s.image_url)}" alt="" draggable="false" loading="lazy" decoding="async" onerror="this.remove()">` : ''}
      </div>
      <div class="card-body">
        <h3>${esc(s.name)}</h3>
        <div class="meta">${metaHtml(s.id)}</div>
        <button class="action-btn" type="button" tabindex="-1"><span>عرض المدرسين</span><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      </div>
    </div>`).join('');
}

let navigating = false;
function openCard(card){
  if (!card || navigating) return;
  navigating = true;
  const id = card.dataset.id, name = card.dataset.name;
  card.classList.add('opening');
  const b = card.querySelector('.action-btn');
  b.classList.add('is-loading'); b.querySelector('span').textContent = 'جاري الفتح...';
  document.body.classList.add('leaving');
  setTimeout(() => { location.href = 'teachers.html?subjectId=' + encodeURIComponent(id) + '&subjectName=' + encodeURIComponent(name); }, 260);
}
$('subjects-grid').addEventListener('click', e => openCard(e.target.closest('.card[data-id]')));
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const c = e.target.closest && e.target.closest('.card[data-id]');

});

});
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.card-img')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (e.target && e.target.tagName === 'IMG') e.preventDefault(); });

function hideSplash(){
  const sp = $('splash');
  if (!sp) return;
  sp.classList.add('hide');
  setTimeout(() => sp.remove(), 700);
  document.body.classList.add('go');
}

function showError(msg){
  $('subjects-grid').innerHTML = `<div class="state err">حصل خطأ: ${esc(msg)}<br><button type="button" onclick="location.reload()">حاول تاني</button></div>`;
  ['courses-num','teachers-num'].forEach(id => { $(id).textContent = '—'; $(id).classList.remove('loading'); });
  $('days-chip').textContent = '—';
}

async function init(){
  const started = performance.now();
  $('tagline').textContent = dayQuote();

  // load notification state from storage first
  loadNotifState();
  updateBadge();
  // show cached items immediately if panel is opened before poll finishes
  renderNotifList();

  const cachedName = localStorage.getItem('student_name');
  if (cachedName){
    setGreeting(cachedName);
    $('nav-name').textContent = cachedName;
    $('nav-av').textContent = cachedName.charAt(0);
  }
  try {
    const c = JSON.parse(localStorage.getItem('student_counts') || 'null');
    if (c){ $('courses-num').textContent = c.c; $('teachers-num').textContent = c.t; }
    const d = localStorage.getItem('student_days');
    if (d != null && !isNaN(+d)) $('days-num').textContent = d;
  } catch(e){}

  const [subjectsRes, meRes] = await Promise.allSettled([api('/api/subjects/' + yearId), api('/api/auth/me')]);
  await new Promise(r => setTimeout(r, Math.max(0, 700 - (performance.now() - started))));

  const me = meRes.status === 'fulfilled' ? meRes.value : null;
  if (me && me.name){
    $('nav-name').textContent = me.name;
    $('nav-av').textContent = me.name.charAt(0);
    try { localStorage.setItem('student_name', me.name); } catch(e){}
    if (!cachedName) setGreeting(me.name);
  } else if (!cachedName){
    setGreeting('بطل');
  }
  if (me && me.greeting) $('time-greet').textContent = me.greeting + (/صباح/.test(me.greeting) ? ' ☀️' : ' 🌙');
  renderDays(findDays(me));

  if (subjectsRes.status === 'rejected'){ showError(subjectsRes.reason.message); hideSplash(); return; }

  // شعبة الطالب من الحساب
  try {
    const secRaw = (me && (me.section || me.student_section || (me.student && me.student.section))) || localStorage.getItem('student_section') || '';
    studentSection = normalizeSectionClient(secRaw);
    if (secRaw) try { localStorage.setItem('student_section', studentSection); } catch(e){}
  } catch(e){}

  // أعد تحميل الإشعارات الخاصة بالشعبة دي فقط
  loadNotifState();
  updateBadge();
  renderNotifList();

  const subjectsRaw = subjectsRes.value || [];
  const subjects = filterSubjectsBySection(subjectsRaw, studentSection);
  subjectList = subjects;    // إشعارات + شبكة المواد = نفس القائمة
  const countEl = $('subject-count');
  countEl.textContent = subjects.length;
  countEl.style.display = 'inline-block';
  if (!subjects.length){
    $('subjects-grid').innerHTML = '<div class="state">لسه مفيش مواد متاحة ليك. هتظهر هنا أول ما تتفعّل.</div>';
  } else {
    renderSubjects(subjects);
  }
  renderCounts(subjects);
  hideSplash();

  // start notification polling after page is ready
  startPolling();
}

init().catch(e => { showError(e.message); hideSplash(); });
setTimeout(hideSplash, 8000);
})();
