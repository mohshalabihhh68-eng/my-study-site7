<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المدرسين</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; padding: 20px; background: #1e293b; border-radius: 12px; position: relative; }
    header h1 { color: #38bdf8; font-size: 24px; }
    header a { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #94a3b8; text-decoration: none; font-size: 14px; }
    header a:hover { color: #38bdf8; }
    #loading, #error { text-align: center; padding: 40px; font-size: 18px; }
    #error { color: #f87171; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.3s; border: 1px solid #334155; text-align: center; }
    .card:hover { transform: translateY(-5px); border-color: #38bdf8; box-shadow: 0 10px 25px rgba(56,189,248,0.2); }
    .card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background: #334155; margin-bottom: 12px; }
    .card h3 { font-size: 16px; color: #e2e8f0; }
    .card .id { font-size: 12px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">👨‍🏫 المدرسين</h1>
    <a href="index.html">← رجوع للمواد</a>
  </header>

  <div id="loading">⏳ جاري تحميل المدرسين...</div>
  <div id="error" style="display:none"></div>
  <div class="grid" id="grid"></div>

  <script>
    const API = "";
    const params = new URLSearchParams(window.location.search);
    const subjectId = params.get("id");
    const subjectName = params.get("name") || "المادة";

    document.getElementById("title").textContent = "👨‍🏫 مدرسين " + subjectName;

    async function loadTeachers() {
      if (!subjectId) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent = "❌ رقم المادة غير موجود";
        return;
      }
      try {
        const res = await fetch(`${API}/api/subjects/${subjectId}/teachers`);
        const data = await res.json();
        if (!data.success) throw new Error("لا يوجد مدرسين لهذه المادة");

        document.getElementById("loading").style.display = "none";
        const grid = document.getElementById("grid");
        
        // قد ترجع المادة كـ object أو المدرسين كـ array
        let teachers = data.data;
        if (!Array.isArray(teachers)) {
          if (Array.isArray(teachers?.teachers)) teachers = teachers.teachers;
          else if (teachers?.id) teachers = [teachers]; // صفحة المادة نفسها
          else teachers = [];
        }

        if (!teachers.length) {
          document.getElementById("error").style.display = "block";
          document.getElementById("error").textContent = "لا يوجد مدرسين متاحين حالياً.";
          return;
        }

        teachers.forEach(t => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <img src="${t.image_url || 'https://via.placeholder.com/100/334155/94a3b8?text=' + encodeURIComponent(t.name || 'Teacher')}" 
                 alt="${t.name}" onerror="this.src='https://via.placeholder.com/100/334155/94a3b8?text=No'">
            <h3>${t.name || 'مدرس'}</h3>
            <div class="id">ID: ${t.id || subjectId}</div>
          `;
          card.onclick = () => {
            const teacherId = t.id || subjectId;
            window.location.href = `chapters.html?id=${teacherId}&name=${encodeURIComponent(t.name || subjectName)}`;
          };
          grid.appendChild(card);
        });
      } catch (e) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").textContent = "❌ خطأ: " + e.message;
      }
    }

    loadTeachers();
  </script>
</body>
</html>
