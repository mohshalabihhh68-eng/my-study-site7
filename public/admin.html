<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; padding: 16px; background: #0f172a; color: #e2e8f0; }
  h1 { color: #38bdf8; margin: 0 0 5px; }
  h2 { color: #38bdf8; font-size: 18px; margin: 0 0 12px; }
  
  input, select, button {
    padding: 10px 12px; border-radius: 8px;
    border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
    font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: #0ea5e9; }
  button { background: #0ea5e9; cursor: pointer; border: none; padding: 10px 18px; font-weight: 500; }
  button:hover { background: #0284c7; }
  button.danger { background: #ef4444; }
  button.danger:hover { background: #dc2626; }
  button.ghost { background: transparent; border: 1px solid #334155; }
  button.ghost:hover { background: #334155; }
  
  .card {
    background: #1e293b; border: 1px solid #334155;
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .login-card { max-width: 400px; margin: 60px auto; }
  .login-card input { width: 100%; margin-bottom: 10px; }
  .login-card button { width: 100%; }
  
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > input, .row > select { flex: 1; min-width: 140px; }
  .row > button { flex: 0 0 auto; }
  
  .student {
    background: #0f172a; border: 1px solid #334155;
    border-radius: 10px; padding: 12px 14px; margin: 8px 0;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap;
  }
  .student.expired { opacity: 0.55; }
  .student-info { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex: 1; }
  .student-name { font-weight: 600; }
  
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; background: #0ea5e9; color: #fff;
  }
  .badge.red { background: #ef4444; }
  .badge.gray { background: #475569; }
  .badge.green { background: #22c55e; }
  
  .code { font-family: 'Courier New', monospace; color: #facc15; font-size: 15px; letter-spacing: 1px; }
  
  .msg { font-size: 14px; margin-top: 8px; min-height: 20px; }
  .msg.err { color: #ef4444; }
  .msg.ok { color: #22c55e; }
  
  .search { width: 100%; padding: 12px 16px; font-size: 15px; }
  
  .empty { text-align: center; padding: 30px; color: #64748b; }
  
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1e293b; border: 1px solid #334155;
    border-radius: 12px; padding: 24px; max-width: 500px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .modal h2 { margin-top: 0; }
  
  .device {
    background: #0f172a; border: 1px solid #334155;
    border-radius: 8px; padding: 10px 12px; margin: 8px 0;
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
  }
  .device small { color: #64748b; font-size: 12px; }
  
  hr { border: none; border-top: 1px solid #334155; margin: 20px 0; }
  
  .header-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     شاشة تسجيل الدخول
     ═══════════════════════════════════════════════ -->
<div id="loginScreen" class="card login-card">
  <h1>🔐 دخول الأدمن</h1>
  <p style="color: #64748b; font-size: 13px; margin: 5px 0 15px;">سجل دخولك للوصول للوحة التحكم</p>
  
  <input id="loginUser" placeholder="اسم المستخدم" autocomplete="username">
  <input id="loginPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button onclick="doLogin()">دخول</button>
  
  <p id="loginErr" class="msg err"></p>
</div>


<!-- ═══════════════════════════════════════════════
     اللوحة
     ═══════════════════════════════════════════════ -->
<div id="panel" style="display: none;">

  <!-- هيدر -->
  <div class="card">
    <div class="header-bar">
      <div>
        <h1>🎓 لوحة التحكم</h1>
        <p style="color: #64748b; margin: 5px 0 0; font-size: 13px;">
          مرحباً، <strong id="adminName" style="color: #38bdf8;"></strong>
        </p>
      </div>
      <button class="ghost" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <!-- إضافة طالب -->
  <div class="card">
    <h2>➕ إضافة طالب جديد</h2>
    <div class="row">
      <input id="newName" placeholder="اسم الطالب">
      <select id="newType">
        <option value="trial">تجربة (ساعة)</option>
        <option value="month" selected>شهر</option>
        <option value="term">ترم (6 شهور)</option>
        <option value="year">سنة</option>
      </select>
      <input id="newDevices" type="number" value="1" min="1" max="10" style="max-width: 100px;" placeholder="أجهزة">
      <input id="newCode" placeholder="كود مخصص (اختياري)" style="max-width: 180px;">
      <button onclick="addStudent()">إضافة</button>
    </div>
    <p id="addMsg" class="msg"></p>
  </div>

  <!-- الطلاب -->
  <div class="card">
    <h2>👥 الطلاب (<span id="count">0</span>)</h2>
    <input id="search" class="search" placeholder="🔍 بحث بالاسم أو الكود..." oninput="renderStudents()">
    <div id="studentsList" style="margin-top: 12px;"></div>
  </div>

</div>


<!-- ═══════════════════════════════════════════════
     مودال تفاصيل الطالب
     ═══════════════════════════════════════════════ -->
<div id="modal" class="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modalContent"></div>
</div>


<script>
/* ═══════════════════════════════════════════════
   الحالة
   ═══════════════════════════════════════════════ */
let token = localStorage.getItem('admin_token');
let students = [];


/* ═══════════════════════════════════════════════
   Helpers
   ═══════════════════════════════════════════════ */
async function api(path, options = {}) {
  const r = await fetch(path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token,
      ...(options.headers || {})
    }
  });
  
  if (r.status === 401) {
    doLogout();
    throw new Error('انتهت الجلسة');
  }
  
  return r.json();
}

function formatDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString('ar-EG', {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function daysLeft(expiresAt) {
  if (!expiresAt) return null;
  return Math.ceil((expiresAt - Date.now()) / 86400000);
}


/* ═══════════════════════════════════════════════
   تسجيل الدخول
   ═══════════════════════════════════════════════ */
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  
  if (!username || !password) {
    err.textContent = 'اكتب الاسم والباسورد';
    return;
  }
  
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    
    const data = await r.json();
    
    if (!data.success) {
      err.textContent = data.message || 'فشل الدخول';
      return;
    }
    
    token = data.data.token;
    localStorage.setItem('admin_token', token);
    localStorage.setItem('admin_name', data.data.username);
    showPanel();
  } catch (e) {
    err.textContent = 'خطأ في الاتصال';
  }
}

async function doLogout() {
  try {
    await fetch('/api/admin/logout', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token}
    });
  } catch {}
  
  token = null;
  localStorage.removeItem('admin_token');
  localStorage.removeItem('admin_name');
  location.reload();
}

function showPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  document.getElementById('adminName').textContent = localStorage.getItem('admin_name') || 'أدمن';
  loadStudents();
}


/* ═══════════════════════════════════════════════
   الطلاب
   ═══════════════════════════════════════════════ */
async function loadStudents() {
  try {
    const data = await api('/api/admin/students');
    students = data.data || [];
    document.getElementById('count').textContent = students.length;
    renderStudents();
  } catch (e) {
    console.error(e);
  }
}

function renderStudents() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = students.filter(s =>
    !q || s.name.toLowerCase().includes(q) || s.code.includes(q)
  );
  
  const container = document.getElementById('studentsList');
  
  if (!filtered.length) {
    container.innerHTML = '<p class="empty">لا يوجد طلاب</p>';
    return;
  }
  
  container.innerHTML = filtered.map(s => {
    const expired = s.expiresAt && Date.now() > s.expiresAt;
    const inactive = s.active === false;
    const days = daysLeft(s.expiresAt);
    
    let statusBadge = '';
    if (expired) statusBadge = '<span class="badge red">منتهي</span>';
    else if (inactive) statusBadge = '<span class="badge gray">موقوف</span>';
    else if (days !== null) statusBadge = `<span class="badge green">${days} يوم</span>`;
    
    return `
      <div class="student ${expired || inactive ? 'expired' : ''}">
        <div class="student-info">
          <span class="student-name">${s.name}</span>
          <span class="code">${s.code}</span>
          ${statusBadge}
          <span class="badge gray">📱 ${s.devices}/${s.maxDevices}</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button onclick="viewStudent('${s.code}')">تفاصيل</button>
          <button class="danger" onclick="deleteStudent('${s.code}', '${s.name.replace(/'/g, "\\'")}')">حذف</button>
        </div>
      </div>
    `;
  }).join('');
}


/* ═══════════════════════════════════════════════
   إضافة
   ═══════════════════════════════════════════════ */
async function addStudent() {
  const msg = document.getElementById('addMsg');
  msg.className = 'msg';
  msg.textContent = '';
  
  const body = {
    name: document.getElementById('newName').value.trim(),
    type: document.getElementById('newType').value,
    maxDevices: Number(document.getElementById('newDevices').value)
  };
  
  const customCode = document.getElementById('newCode').value.trim();
  if (customCode) body.code = customCode;
  
  if (!body.name) {
    msg.className = 'msg err';
    msg.textContent = 'اسم الطالب مطلوب';
    return;
  }
  
  try {
    const data = await api('/api/admin/students', {
      method: 'POST',
      body: JSON.stringify(body)
    });
    
    if (!data.success) {
      msg.className = 'msg err';
      msg.textContent = data.message;
      return;
    }
    
    msg.className = 'msg ok';
    msg.textContent = '✅ تم! الكود: ' + data.data.code;
    
    document.getElementById('newName').value = '';
    document.getElementById('newCode').value = '';
    loadStudents();
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = e.message;
  }
}


/* ═══════════════════════════════════════════════
   حذف
   ═══════════════════════════════════════════════ */
async function deleteStudent(code, name) {
  if (!confirm(`متأكد من حذف "${name}"؟`)) return;
  
  try {
    const data = await api('/api/admin/students/' + code, { method: 'DELETE' });
    if (!data.success) return alert(data.message);
    loadStudents();
  } catch (e) {
    alert(e.message);
  }
}


/* ═══════════════════════════════════════════════
   تفاصيل
   ═══════════════════════════════════════════════ */
async function viewStudent(code) {
  try {
    const data = await api('/api/admin/students/' + code);
    if (!data.success) return alert(data.message);
    showModal(code, data.data);
  } catch (e) {
    alert(e.message);
  }
}

function showModal(code, s) {
  const devices = s.deviceList || [];
  const days = daysLeft(s.expiresAt);
  
  document.getElementById('modalContent').innerHTML = `
    <h2>${s.name}</h2>
    <p>الكود: <span class="code">${code}</span></p>
    <p>ينتهي: ${formatDate(s.expiresAt)} ${days !== null ? `(${days} يوم)` : ''}</p>
    <p>الأجهزة: ${devices.length}/${s.maxDevices || 1}</p>
    
    <hr>
    
    <h3>📱 الأجهزة</h3>
    ${devices.length ? devices.map(d => `
      <div class="device">
        <div>
          <strong>${d.name || 'جهاز'}</strong><br>
          <small>${d.deviceId}</small><br>
          <small>آخر ظهور: ${formatDate(d.lastSeen)}</small>
        </div>
        <button class="danger" onclick="kickDevice('${code}', '${d.deviceId}')">طرد</button>
      </div>
    `).join('') : '<p class="empty">لا توجد أجهزة</p>'}
    
    <hr>
    
    <h3>⏱️ تمديد</h3>
    <button onclick="extend('${code}', 30)">+30 يوم</button>
    <button onclick="extend('${code}', 180)">+180 يوم</button>
    <button onclick="extend('${code}', 365)">+365 يوم</button>
    
    <hr>
    
    <button class="ghost" onclick="closeModal()" style="width: 100%;">إغلاق</button>
  `;
  
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

async function kickDevice(code, deviceId) {
  if (!confirm('طرد هذا الجهاز؟')) return;
  
  try {
    const data = await api(`/api/admin/students/${code}/devices/${deviceId}`, {
      method: 'DELETE'
    });
    
    alert(data.success ? 'تم الطرد' : data.message);
    if (data.success) {
      viewStudent(code);
      loadStudents();
    }
  } catch (e) {
    alert(e.message);
  }
}

async function extend(code, days) {
  try {
    const data = await api('/api/admin/students/' + code, {
      method: 'PATCH',
      body: JSON.stringify({extendMs: days * 86400000})
    });
    
    alert(data.success ? `تم تمديد ${days} يوم` : data.message);
    if (data.success) {
      viewStudent(code);
      loadStudents();
    }
  } catch (e) {
    alert(e.message);
  }
}


/* ═══════════════════════════════════════════════
   Auto-login عند فتح الصفحة
   ═══════════════════════════════════════════════ */
(async function init() {
  document.getElementById('loginPass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  
  if (token) {
    try {
      const data = await api('/api/admin/me');
      if (data.success) {
        showPanel();
      } else {
        localStorage.removeItem('admin_token');
        token = null;
      }
    } catch {
      localStorage.removeItem('admin_token');
      token = null;
    }
  }
})();
</script>

</body>
</html>
