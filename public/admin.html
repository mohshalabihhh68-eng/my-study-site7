<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>لوحة التحكم — Shalaby</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2f3d;
      --primary: #4f8cff;
      --danger: #ff4d6a;
      --success: #2dd4a8;
      --text: #e8eaed;
      --muted: #9aa3b2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 16px; }
    h1, h2 { font-weight: 600; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--primary); }
    .muted { color: var(--muted); font-size: 0.85rem; }

    /* Login */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      width: 100%;
      max-width: 360px;
    }
    .login-box h1 { text-align: center; margin-bottom: 20px; }
    input, select, button, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #12151c;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 12px;
    }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button {
      background: var(--primary);
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.85; }
    button.danger { background: var(--danger); }
    button.secondary { background: #2a2f3d; }
    button.small { width: auto; padding: 8px 14px; font-size: 0.85rem; margin: 0 4px 4px 0; }
    .error { color: var(--danger); font-size: 0.9rem; margin-bottom: 10px; text-align: center; }
    .success { color: var(--success); font-size: 0.9rem; margin-bottom: 10px; }

    /* App */
    #app-screen { display: none; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab.active { background: var(--primary); border-color: var(--primary); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 120px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .badge.ok { background: #1a3d32; color: var(--success); }
    .badge.off { background: #3d1a24; color: var(--danger); }
    .code-box {
      font-family: monospace;
      background: #12151c;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.3rem;
      letter-spacing: 2px;
      margin: 10px 0;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h1>لوحة التحكم</h1>
      <p class="muted" style="text-align:center;margin-bottom:18px">دخول الأدمن</p>
      <div id="login-error" class="error hidden"></div>
      <input type="text" id="username" placeholder="اليوزر" value="Shalaby" autocomplete="username" />
      <input type="password" id="password" placeholder="الباسورد" autocomplete="current-password" />
      <button onclick="doLogin()">دخول</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app-screen">
    <div class="container">
      <header>
        <div>
          <h1>لوحة التحكم</h1>
          <p class="muted" id="admin-name"></p>
        </div>
        <button class="secondary small" onclick="doLogout()">خروج</button>
      </header>

      <div class="tabs">
        <div class="tab active" data-tab="students" onclick="switchTab('students')">الطلاب</div>
        <div class="tab" data-tab="create" onclick="switchTab('create')">إنشاء كود</div>
        <div class="tab" data-tab="sections" onclick="switchTab('sections')">الشعب</div>
      </div>

      <!-- Students Tab -->
      <div id="tab-students">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h2 style="margin:0">قائمة الطلاب</h2>
            <button class="secondary small" onclick="loadStudents()">تحديث</button>
          </div>
          <div id="students-list">جاري التحميل...</div>
        </div>
      </div>

      <!-- Create Tab -->
      <div id="tab-create" class="hidden">
        <div class="card">
          <h2>إنشاء كود جديد</h2>
          <div id="create-msg" class="hidden"></div>
          <input type="text" id="s-name" placeholder="اسم الطالب" />
          <select id="s-section">
            <option value="scientific_sciences">علمي علوم</option>
            <option value="scientific_math">علمي رياضة</option>
            <option value="literary">أدبي</option>
          </select>
          <select id="s-type">
            <option value="trial">تجربة (ساعة)</option>
            <option value="month" selected>شهر</option>
            <option value="term">ترم (6 شهور)</option>
            <option value="year">سنة</option>
          </select>
          <input type="number" id="s-devices" placeholder="عدد الأجهزة" value="1" min="1" max="10" />
          <input type="text" id="s-code" placeholder="كود مخصص (اختياري — 7 أرقام)" maxlength="7" />
          <button onclick="createStudent()">إنشاء الكود</button>
          <div id="created-code" class="hidden">
            <p class="muted">الكود اللي اتعمل:</p>
            <div class="code-box" id="code-value"></div>
          </div>
        </div>
      </div>

      <!-- Sections Tab -->
      <div id="tab-sections" class="hidden">
        <div class="card">
          <h2>الشعب</h2>
          <div id="sections-list">جاري التحميل...</div>
        </div>
      </div>

      <!-- Student Detail Modal (simple) -->
      <div id="detail-card" class="card hidden">
        <h2>تفاصيل الطالب</h2>
        <div id="detail-content"></div>
        <button class="secondary" style="margin-top:12px" onclick="closeDetail()">إغلاق</button>
      </div>
    </div>
  </div>

<script>
  const API = window.location.origin; // نفس الدومين
  let token = localStorage.getItem("adminToken") || "";

  // ---------- Auth ----------
  async function doLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const err = document.getElementById("login-error");
    err.classList.add("hidden");

    try {
      const r = await fetch(API + "/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await r.json();
      if (!data.success) {
        err.textContent = data.message || "فشل الدخول";
        err.classList.remove("hidden");
        return;
      }
      token = data.data.token;
      localStorage.setItem("adminToken", token);
      showApp(data.data.username);
    } catch (e) {
      err.textContent = "خطأ في الاتصال بالسيرفر";
      err.classList.remove("hidden");
    }
  }

  function doLogout() {
    token = "";
    localStorage.removeItem("adminToken");
    document.getElementById("app-screen").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
  }

  function showApp(name) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "block";
    document.getElementById("admin-name").textContent = "مرحباً، " + (name || "Shalaby");
    loadStudents();
    loadSections();
  }

  // Auto login if token exists
  if (token) {
    fetch(API + "/api/admin/me", {
      headers: { Authorization: "Bearer " + token }
    }).then(r => r.json()).then(d => {
      if (d.success) showApp(d.data.username);
      else doLogout();
    }).catch(() => doLogout());
  }

  // ---------- Tabs ----------
  function switchTab(name) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelector(`.tab[data-tab="${name}"]`).classList.add("active");
    document.getElementById("tab-students").classList.toggle("hidden", name !== "students");
    document.getElementById("tab-create").classList.toggle("hidden", name !== "create");
    document.getElementById("tab-sections").classList.toggle("hidden", name !== "sections");
    document.getElementById("detail-card").classList.add("hidden");
  }

  // ---------- Students ----------
  async function loadStudents() {
    const el = document.getElementById("students-list");
    el.textContent = "جاري التحميل...";
    try {
      const r = await fetch(API + "/api/admin/students", {
        headers: { Authorization: "Bearer " + token }
      });
      const data = await r.json();
      if (!data.success) {
        el.textContent = data.message || "خطأ";
        return;
      }
      const list = data.data || [];
      if (!list.length) {
        el.innerHTML = '<p class="muted">مفيش طلاب لسه</p>';
        return;
      }
      let html = '<table><thead><tr><th>الكود</th><th>الاسم</th><th>النوع</th><th>أجهزة</th><th>الحالة</th><th></th></tr></thead><tbody>';
      for (const s of list) {
        const active = s.active !== false;
        const exp = s.expiresAt ? new Date(s.expiresAt).toLocaleDateString("ar-EG") : "-";
        html += `<tr>
          <td style="font-family:monospace">${s.code}</td>
          <td>${s.name || "-"}</td>
          <td>${s.type || "-"}</td>
          <td>${s.devices || 0}/${s.maxDevices || 1}</td>
          <td><span class="badge ${active ? "ok" : "off"}">${active ? "نشط" : "موقوف"}</span></td>
          <td><button class="small secondary" onclick="showStudent('${s.code}')">تفاصيل</button></td>
        </tr>`;
      }
      html += "</tbody></table>";
      el.innerHTML = html;
    } catch (e) {
      el.textContent = "خطأ في التحميل";
    }
  }

  async function showStudent(code) {
    const card = document.getElementById("detail-card");
    const content = document.getElementById("detail-content");
    card.classList.remove("hidden");
    content.textContent = "جاري التحميل...";
    try {
      const r = await fetch(API + "/api/admin/students/" + code, {
        headers: { Authorization: "Bearer " + token }
      });
      const data = await r.json();
      if (!data.success) {
        content.textContent = data.message;
        return;
      }
      const s = data.data;
      const devices = s.deviceList || [];
      let html = `
        <p><b>الاسم:</b> ${s.name}</p>
        <p><b>الكود:</b> <span style="font-family:monospace">${s.code}</span></p>
        <p><b>الشعبة:</b> ${s.section || "-"}</p>
        <p><b>النوع:</b> ${s.type || "-"}</p>
        <p><b>ينتهي:</b> ${s.expiresAt ? new Date(s.expiresAt).toLocaleString("ar-EG") : "-"}</p>
        <p><b>الأجهزة:</b> ${devices.length} / ${s.maxDevices || 1}</p>
        <hr style="border-color:var(--border);margin:12px 0" />
        <p class="muted">الأجهزة المسجلة:</p>
      `;
      if (!devices.length) {
        html += '<p class="muted">لا يوجد أجهزة</p>';
      } else {
        for (const d of devices) {
          html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
            <div>
              <div>${d.name || "جهاز"}</div>
              <div class="muted" style="font-size:0.75rem">${d.deviceId?.slice(0, 12)}...</div>
            </div>
            <button class="small danger" onclick="kickDevice('${s.code}','${d.deviceId}')">طرد</button>
          </div>`;
        }
      }
      html += `<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="small ${s.active === false ? "secondary" : "danger"}" onclick="toggleActive('${s.code}', ${s.active === false})">
          ${s.active === false ? "تفعيل" : "إيقاف"}
        </button>
        <button class="small danger" onclick="deleteStudent('${s.code}')">حذف الطالب</button>
      </div>`;
      content.innerHTML = html;
    } catch (e) {
      content.textContent = "خطأ";
    }
  }

  function closeDetail() {
    document.getElementById("detail-card").classList.add("hidden");
  }

  async function kickDevice(code, deviceId) {
    if (!confirm("تأكيد طرد الجهاز؟")) return;
    await fetch(API + `/api/admin/students/${code}/devices/${deviceId}`, {
      method: "DELETE",
      headers: { Authorization: "Bearer " + token }
    });
    showStudent(code);
    loadStudents();
  }

  async function toggleActive(code, activate) {
    await fetch(API + "/api/admin/students/" + code, {
      method: "PATCH",
      headers: {
        Authorization: "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ active: activate })
    });
    showStudent(code);
    loadStudents();
  }

  async function deleteStudent(code) {
    if (!confirm("حذف الطالب نهائياً؟")) return;
    await fetch(API + "/api/admin/students/" + code, {
      method: "DELETE",
      headers: { Authorization: "Bearer " + token }
    });
    closeDetail();
    loadStudents();
  }

  // ---------- Create ----------
  async function createStudent() {
    const msg = document.getElementById("create-msg");
    const created = document.getElementById("created-code");
    msg.classList.add("hidden");
    created.classList.add("hidden");

    const body = {
      name: document.getElementById("s-name").value.trim(),
      section: document.getElementById("s-section").value,
      type: document.getElementById("s-type").value,
      maxDevices: Number(document.getElementById("s-devices").value) || 1
    };
    const custom = document.getElementById("s-code").value.trim();
    if (custom) body.code = custom;

    if (!body.name) {
      msg.textContent = "اكتب اسم الطالب";
      msg.className = "error";
      msg.classList.remove("hidden");
      return;
    }

    try {
      const r = await fetch(API + "/api/admin/students", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });
      const data = await r.json();
      if (!data.success) {
        msg.textContent = data.message || "فشل الإنشاء";
        msg.className = "error";
        msg.classList.remove("hidden");
        return;
      }
      document.getElementById("code-value").textContent = data.data.code;
      created.classList.remove("hidden");
      msg.textContent = "تم إنشاء الكود بنجاح";
      msg.className = "success";
      msg.classList.remove("hidden");
      document.getElementById("s-name").value = "";
      document.getElementById("s-code").value = "";
      loadStudents();
    } catch (e) {
      msg.textContent = "خطأ في الاتصال";
      msg.className = "error";
      msg.classList.remove("hidden");
    }
  }

  // ---------- Sections ----------
  async function loadSections() {
    const el = document.getElementById("sections-list");
    try {
      const r = await fetch(API + "/api/admin/sections", {
        headers: { Authorization: "Bearer " + token }
      });
      const data = await r.json();
      if (!data.success) {
        el.textContent = data.message || "خطأ";
        return;
      }
      const list = data.data || [];
      if (!list.length) {
        el.innerHTML = '<p class="muted">مفيش شعب</p>';
        return;
      }
      let html = "";
      for (const s of list) {
        html += `<div style="padding:12px 0;border-bottom:1px solid var(--border)">
          <b>${s.name || s.id}</b>
          <div class="muted">المواد: ${(s.subjectIds || []).join(", ") || "-"}</div>
          <div class="muted">Year ID: ${s.yearId || "-"}</div>
        </div>`;
      }
      el.innerHTML = html;
    } catch (e) {
      el.textContent = "خطأ في التحميل";
    }
  }

  // Enter key on login
  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });
</script>
</body>
</html>
