    log.length ? log.map(l => { const m = LOGIC[l.k] || LOGIC.edit; return `<div class="logline"><span class="ic ${m[1]}">${ic(m[0], 15)}</span><span>${esc(l.t)}</span><time title="${fmt(l.ts)}">${ago(l.ts)}</time></div>`; }).join("") : empty("term", "السجل فاضي", "بيتسجل هنا كل إنشاء/تعديل/حذف بتعمله من المتصفح ده.")}</div></div>
  <div class="card"><div class="card-h"><h3>اختصارات الكيبورد</h3></div><div class="card-b"><div class="kv" style="grid-template-columns:auto 1fr;gap:12px 18px">
    <kbd class="kbd">Ctrl + K</kbd><span>بحث سريع وأوامر</span><kbd class="kbd">Esc</kbd><span>إغلاق أي نافذة</span><kbd class="kbd">Enter</kbd><span>إرسال الرسالة في المحادثة</span><kbd class="kbd">Shift + Enter</kbd><span>سطر جديد في الرسالة</span></div></div></div></div>`;
}};
ACT["sys-check"] = async () => {
  await Promise.all(EPS.map(async (e, i) => { const r = await probe(e[1]), row = $("#ep-" + i); if(!row) return;
    row.children[2].innerHTML = r.ok ? '<span class="badge b-g">شغّال</span>' : `<span class="badge b-r">${r.status ? "خطأ " + r.status : "لا اتصال"}</span>`;
    row.children[3].innerHTML = `<span class="${r.ms > 1200 ? "badge b-a nodot" : "mono"}">${r.ms} ms</span>`; }));
  toast("تم الفحص", "info");
};
ACT["sys-backup"] = () => {
  const data = scrub({ exportedAt:new Date().toISOString(), server:API || window.location.origin, students:S.students, sections:S.sections, admins:S.admins, packages:S.runtime.packages, agents:S.runtime.agents, siteName:S.runtime.siteName, firebaseUrl:S.runtime.firebaseUrl });
  download("thanawya-backup-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(data, null, 2), "application/json"); logAct("io", "تحميل نسخة احتياطية"); toast("تم تحميل النسخة");
};
ACT["log-clear"] = async () => { if(!await ask({ title:"مسح السجل؟", text:"السجل محلي على المتصفح ده بس.", ok:"مسح", danger:true })) return; store.set(K.log, []); renderView(); };

/* =====================================================================
   الشِّل: التنقل، التحميل، الدخول، الباليت، الأحداث
   ===================================================================== */
const NAV = [
  ["الرئيسية", [["home", "home", "نظرة عامة"]]],
  ["الطلاب", [["students", "users", "الطلاب والأكواد"], ["history", "eye", "سجل المشاهدة"], ["visits", "globe", "سجل الزوار"], ["messages", "msg", "الرسائل"], ["sections", "layers", "الشعب والمواد"]]],
  ["المبيعات", [["packages", "tag", "الباقات"], ["agents", "send", "مسؤولو الاشتراك"]]],
  ["النظام", [["runtime", "sliders", "إعدادات التشغيل"], ["admins", "shield", "الأدمنز"], ["system", "pulse", "حالة النظام"]]]
];
function drawNav(){
  $("#nav").innerHTML = NAV.map(g => `<div class="sb-g">${g[0]}</div>` + g[1].map(n => `<button class="nv${S.tab === n[0] ? " on" : ""}" type="button" data-act="goto" data-t="${n[0]}" title="${n[2]}">${ic(n[1], 19)}<span class="t">${n[2]}</span>${n[0] === "messages" ? `<span class="n${S.unread ? "" : " hide"}" id="nv-un">${num(S.unread)}</span>` : ""}</button>`).join("")).join("");
}
function updateBadges(){
  const n = $("#nv-un"); if(n){ n.textContent = S.unread > 99 ? "99+" : num(S.unread); n.classList.toggle("hide", !S.unread); }
  const b = $("#btn-bell"); if(b){ const d = $(".dot", b); if(S.unread){ if(d) d.textContent = S.unread > 99 ? "99+" : S.unread; else b.insertAdjacentHTML("beforeend", `<span class="dot">${S.unread > 99 ? "99+" : S.unread}</span>`); } else if(d) d.remove(); }
  document.title = (S.unread ? "(" + S.unread + ") " : "") + "لوحة تحكم ثانوية club";
}
function renderView(){
  const p = PAGES[S.tab] || PAGES.home, y = window.scrollY;
  $("#view").innerHTML = p.render(); $("#tb-title").textContent = p.title; if(p.after) p.after(); window.scrollTo(0, y);
}
function route(){
  const t = (location.hash.replace(/^#\/?/, "") || "home").split("?")[0], tab = PAGES[t] ? t : "home";
  const prev = PAGES[S.tab]; if(prev && prev.leave && S.tab !== tab) prev.leave();
  S.tab = tab; document.body.classList.remove("nav-open"); drawNav(); updateBadges(); renderView(); window.scrollTo(0, 0);
}
function go(tab){ if(location.hash === "#/" + tab) route(); else location.hash = "#/" + tab; }
window.addEventListener("hashchange", () => { if(S.token) route(); });

async function loadVisitSummary(force){
  if (!force && S.visitSummary && (Date.now() - (S._visitSumAt || 0) < 45_000)) return S.visitSummary;
  try {
    const d = await api("/api/admin/visits/summary");
    S.visitSummary = d.data || {};
    S._visitSumAt = Date.now();
  } catch {
    S.visitSummary = S.visitSummary || {};
  }
  return S.visitSummary;
}
async function loadVisits(force){
  if (!force && Array.isArray(S.visits) && S.visits.length && (Date.now() - (S._visitsAt || 0) < 60_000)) return S.visits;
  try {
    const d = await api("/api/admin/visits?limit=400");
    S.visits = d.data || [];
    S._visitsAt = Date.now();
    S._visitsTotal = d.total || S.visits.length;
  } catch {
    S.visits = S.visits || [];
  }
  return S.visits;
}
async function loadAll(){
  const needFullVisits = S.tab === "visits";
  const needSum = !S.loaded || S.tab === "home" || S.tab === "visits";
  await Promise.all([
    api("/api/admin/students").then(d => { S.students = d.data || []; }).catch(e => { S.students = S.students || []; if(!S.loaded) toast(e.message, "err"); }),
    api("/api/admin/sections").then(d => { S.sections = d.data || []; }).catch(() => {}),
    api("/api/admin/admins").then(d => { S.admins = d.data || []; }).catch(() => { S.admins = []; }),
    api("/api/admin/runtime").then(d => { S.runtime = Object.assign({ packages:[], agents:[] }, d.data); syncTypes(); }).catch(() => {}),
    api("/api/admin/me").then(d => { S.me = Object.assign(S.me || {}, d.data); }).catch(() => {}),
    api("/api/admin/messages").then(d => { S.threads = d.data || []; S.unread = S.threads.reduce((a, t) => a + (Number(t.unreadAdmin) || 0), 0); }).catch(() => {}),
    needFullVisits ? loadVisits(true) : Promise.resolve(),
    needSum ? loadVisitSummary(true) : Promise.resolve()
  ]);
  S.loaded = true; updateBadges();
}
async function reload(){
  await loadAll();
  if(S.tab === "messages") { drawThreads(); return; }
  if(["packages", "agents"].includes(S.tab)) return;
  renderView();
}
ACT.refresh = async el => { const i = el && el.firstElementChild; if(i) i.style.animation = "spin .7s linear"; await reload(); toast("تم تحديث البيانات ✓", "ok"); if(i) i.style.animation = ""; };

function setPing(r){
  S.ping = Object.assign({ at:Date.now() }, r);
  const l = $("#srv-lamp"), t = $("#srv-txt"); if(!l) return;
  const st = !r.status ? "bad" : r.ms > 2000 ? "warn" : "ok"; l.className = "lamp " + st;
  t.textContent = !r.status ? "غير متصل" : "متصل · " + r.ms + "ms";
}
ACT.ping = async () => { setPing(await probe("/api/admin/me")); toast(S.ping.status ? "السيرفر شغال — " + S.ping.ms + "ms" : "السيرفر مش بيرد", S.ping.status ? "ok" : "err"); };
function startPollers(){
  clearInterval(S.timers.bg);
  S.timers.bg = setInterval(async () => {
    if(!S.token || document.hidden) return;
    setPing(await probe("/api/admin/me"));
    if(S.tab !== "messages"){
      const before = S.unread; await loadThreads();
      if(S.unread > before) toast("وصلتك " + (S.unread - before) + " رسالة جديدة", "info");
    }
  }, 45000);
}

function showApp(){
  $("#login").style.display = "none"; $("#app").style.display = "block";
  const u = (S.me && S.me.username) || "";
  $("#me-name").textContent = u; $("#me-av").textContent = u.charAt(0).toUpperCase() || "A";
  $("#me-role").textContent = can("admins_manage") ? "مدير" : "مشرف";
}
async function enterApp(){
  showApp(); drawNav(); $("#view").innerHTML = `<div style="max-width:1100px">${skel(1).replace("62px", "40px")}${skel(4)}</div>`;
  await loadAll(); showApp(); setPing(await probe("/api/admin/me")); startPollers(); route();
}
function forceOut(msg){
  Object.values(S.timers).forEach(clearInterval); S.token = ""; S.me = null; S.loaded = false; rawSet(K.tok, null);
  closeModal(); $("#app").style.display = "none"; $("#login").style.display = "grid"; $("#login-err").textContent = msg || "";
  const c = $("#cb"); if(c && c._res) c._res(false); pingLogin();
}
ACT.logout = async () => { if(S.token) api("/api/admin/logout", { method:"POST", noAuth:true }).catch(() => {}); logAct("auth", "تسجيل خروج"); forceOut(""); };
async function doLogin(){
  const u = $("#user").value.trim(), p = $("#pass").value, err = $("#login-err"); err.textContent = "";
  if(!u || !p){ err.textContent = "اكتب اسم المستخدم وكلمة المرور"; return; }
  const b = $("#btn-login"); b.disabled = true; b.textContent = "جاري الدخول…";
  try{
    const d = await api("/api/admin/login", { method:"POST", body:{ username:u, password:p }, noAuth:true });
    S.token = d.data.token; S.me = d.data; rawSet(K.tok, S.token);
    $("#pass").value = ""; logAct("auth", "تسجيل دخول"); await enterApp();
  }catch(e){ err.textContent = e.message; }
  finally{ b.disabled = false; b.textContent = "دخول للوحة"; }
}
async function pingLogin(){
  const l = $("#l-lamp"), t = $("#l-ping"); if(!l) return; l.className = "lamp"; t.textContent = "جاري الفحص"; t.className = "badge nodot b-m";
  const r = await probe("/api/admin/me");
  if(r.status){ l.className = "lamp " + (r.ms > 2000 ? "warn" : "ok"); t.textContent = "متصل · " + r.ms + "ms"; t.className = "badge nodot " + (r.ms > 2000 ? "b-a" : "b-g"); }
  else { l.className = "lamp bad"; t.textContent = "غير متصل"; t.className = "badge nodot b-r"; }
}

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t); store.set(K.theme, t);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = t === "light" ? "#f1f3f8" : "#070b14";
  const b = $("#btn-theme"); if(b) b.innerHTML = ic(t === "light" ? "moon" : "sun", 18);
}
ACT.theme = () => applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
ACT.menu = () => document.body.classList.toggle("nav-open");
ACT.collapse = () => { document.body.classList.toggle("side-c"); store.set(K.side, document.body.classList.contains("side-c")); };
ACT.goto = el => go(el.dataset.t);
ACT.mclose = () => closeModal();
ACT.eye = el => { const i = $("#" + el.dataset.t); const show = i.type === "password"; i.type = show ? "text" : "password"; el.innerHTML = ic(show ? "eyeoff" : "eye", 17); };

let palIdx = 0, palRows = [];
function palItems(q){
  q = q.trim().toLowerCase(); const out = [];
  NAV.forEach(g => g[1].forEach(n => out.push({ g:"انتقال", i:n[1], l:n[2], run:() => go(n[0]) })));
  if(can("students_create")) out.push({ g:"أوامر", i:"userplus", l:"إنشاء كود جديد", run:() => ACT["st-new"]() }, { g:"أوامر", i:"zap", l:"إنشاء دفعة أكواد", run:() => ACT["st-batch"]() });
  out.push({ g:"أوامر", i:"megaphone", l:"رسالة جماعية", run:() => ACT["bc-open"]() }, { g:"أوامر", i:"plus", l:"رسالة جديدة لطالب", run:() => ACT["msg-new"]() },
    { g:"أوامر", i:"download", l:"تصدير الطلاب CSV", run:() => ACT["st-export"]({ dataset:{ all:"1" } }) }, { g:"أوامر", i:"refresh", l:"تحديث البيانات", run:() => ACT.refresh() },
    { g:"أوامر", i:"sun", l:"تبديل المظهر", run:() => ACT.theme() }, { g:"أوامر", i:"logout", l:"تسجيل الخروج", run:() => ACT.logout() });
  let r = q ? out.filter(x => x.l.toLowerCase().includes(q)) : out.slice(0, 14);
  if(q){ S.students.filter(s => String(s.name || "").toLowerCase().includes(q) || String(s.code).includes(q)).slice(0, 6).forEach(s =>
    r.push({ g:"طلاب", i:"user", l:s.name + " — " + s.code, h:sectionName(s.section), run:() => can("students_view") ? ACT["st-view"]({ dataset:{ code:s.code } }) : (S.st.q = s.code, go("students")) })); }
  return r;
}
function palDraw(){
  const l = $("#pal-l"); let h = "", g = "";
  palRows.forEach((r, i) => { if(r.g !== g){ g = r.g; h += `<li class="gh">${g}</li>`; } h += `<li data-i="${i}" class="${i === palIdx ? "on" : ""}">${ic(r.i, 18)}<span>${esc(r.l)}</span>${r.h ? `<small>${esc(r.h)}</small>` : ""}</li>`; });
  l.innerHTML = h || `<li class="gh" style="text-align:center;padding:20px">مفيش نتايج</li>`;
  const on = $("li.on", l); if(on) on.scrollIntoView({ block:"nearest" });
}
function openPalette(){
  if(!S.token) return; $("#pal").classList.add("open");
  $("#pal-in").innerHTML = `<input id="pal-q" placeholder="ابحث عن صفحة، طالب، أو أمر…" autocomplete="off"><ul id="pal-l"></ul><div class="ft"><span>↑↓ تنقّل</span><span>Enter تنفيذ</span><span>Esc إغلاق</span></div>`;
  palIdx = 0; palRows = palItems(""); palDraw();
  const q = $("#pal-q"); q.focus();
  q.oninput = () => { palIdx = 0; palRows = palItems(q.value); palDraw(); };
  q.onkeydown = e => {
    if(e.key === "ArrowDown"){ e.preventDefault(); palIdx = Math.min(palRows.length - 1, palIdx + 1); palDraw(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); palIdx = Math.max(0, palIdx - 1); palDraw(); }
    else if(e.key === "Enter"){ e.preventDefault(); palRun(palIdx); }
  };
  $("#pal-l").onclick = e => { const li = e.target.closest("li[data-i]"); if(li) palRun(Number(li.dataset.i)); };
}
const closePalette = () => $("#pal").classList.remove("open");
function palRun(i){ const r = palRows[i]; if(!r) return; closePalette(); setTimeout(r.run, 30); }
ACT.palette = openPalette;

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const f = ACT[el.dataset.act]; if(f){ if(el.tagName === "BUTTON" && el.type === "submit") e.preventDefault(); f(el, e); }
});
document.addEventListener("input", e => { const el = e.target.closest("[data-in]"); if(el && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
document.addEventListener("change", e => { const el = e.target.closest("[data-ch]"); if(el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
$("#mb").addEventListener("mousedown", e => { if(e.target === $("#mb")) closeModal(); });
$("#cb").addEventListener("mousedown", e => { if(e.target === $("#cb") && $("#cb")._res) $("#cb")._res(false); });
$("#pal").addEventListener("mousedown", e => { if(e.target === $("#pal")) closePalette(); });
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#pal").classList.contains("open") ? closePalette() : openPalette(); return; }
  if(e.key === "Escape"){
    const cb = $("#cb"); if(cb.classList.contains("open") && cb._res){ cb._res(false); return; }
    if($("#pal").classList.contains("open")){ closePalette(); return; }
    if($("#mb").classList.contains("open")){ closeModal(); return; }
    document.body.classList.remove("nav-open");
  }
});

(function boot(){
  const st = document.createElement("style"); st.textContent = "@keyframes spin{to{transform:rotate(360deg)}}"; document.head.appendChild(st);
  applyTheme(store.get(K.theme, "dark")); if(store.get(K.side, false)) document.body.classList.add("side-c");
  $("#l-url").textContent = (API || window.location.origin).replace("https://", "");
  $("#ic-user").innerHTML = ic("user", 17); $("#ic-key").innerHTML = ic("lock", 17); $("#eye-pass").innerHTML = ic("eye", 17);
  $("#l-feats").innerHTML = [["users", "أكواد وأجهزة الطلاب"], ["msg", "محادثات مباشرة"], ["layers", "شعب ومواد"], ["pulse", "مراقبة السيرفر"]].map(f => `<div>${ic(f[0], 18)}${f[1]}</div>`).join("");
  $("#btn-menu").innerHTML = ic("menu", 19); $("#btn-col").innerHTML = ic("collapse", 18); $("#ic-qs").innerHTML = ic("search", 16);
  $("#btn-bell").innerHTML = ic("bell", 18); $("#btn-ref").innerHTML = ic("refresh", 18); $("#btn-out").innerHTML = ic("logout", 17);
  store.set(K.user, "");
  $("#btn-login").onclick = doLogin;
  $("#pass").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
  $("#user").addEventListener("keydown", e => { if(e.key === "Enter") $("#pass").focus(); });
  pingLogin();
  const t = rawGet(K.tok);
  if(t){
    S.token = t; $("#login").style.display = "none";
    api("/api/admin/me", { noAuth:true }).then(d => { S.me = d.data; return enterApp(); }).catch(() => forceOut(""));
  }
})();
})();
</script>
