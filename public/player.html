<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>مشغل المحاضرة | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d18;--panel:#111a2a;--panel2:#172338;--line:#26344b;
  --text:#f3f6ff;--muted:#91a0ba;--blue:#5b8cff;--blue2:#8ab4ff;--green:#34d399;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 380px at 50% -180px,#173b76 0,transparent 70%),var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}

/* ============ TOP BAR ============ */
.top{position:sticky;top:0;z-index:100;background:#080d18ef;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff12}
.topin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900;display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);box-shadow:0 8px 24px #2563eb40;position:relative;overflow:hidden}
.brand-txt{min-width:0;overflow:hidden}
.brand-txt b{display:block;font-size:14px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:background .18s,transform .18s;white-space:nowrap}
.btn:hover{background:#ffffff12}
.btn:active{transform:scale(.96)}
.btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ============ LAYOUT ============ */
.wrap{max-width:1180px;margin:auto;padding:16px 14px 60px}
.crumb{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.main{min-width:0}

/* ============ PLAYER ============ */
.player-card{background:linear-gradient(180deg,#131d30,#0f1726);border:1px solid #ffffff16;border-radius:20px;overflow:hidden;box-shadow:0 25px 80px #0004}
.screen{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;outline:none}
.screen:fullscreen{width:100%;height:100%;border-radius:0}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:1}

/* Loading & Error */
.loading{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#000a;font-weight:800;font-size:13px;color:#fff}
.loading.show{display:flex}
.spin{width:38px;height:38px;border:3px solid #ffffff30;border-top-color:var(--blue2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{display:none;position:absolute;inset:0;background:linear-gradient(#080d18f7,#0a1222fa);z-index:16;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:14px 18px;}
.error.show{display:flex}
.eic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#ef444422;color:#fca5a5;border:1px solid #ef444455}
.eic svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
.error b{font-size:14.5px;font-weight:900;}
.error p{color:var(--muted);margin:0;font-size:12px;line-height:1.7;max-width:330px}
.eact{display:flex;gap:8px;margin-top:4px;}
.ctrl{border:1px solid #ffffff14;background:#ffffff08;color:#fff;border-radius:12px;padding:9px 14px;font-weight:800;transition:.18s}
.ctrl:hover{background:#ffffff18}

/* Info */
.titlebox{padding:16px 2px 0;}
.titlebox h1{font-size:clamp(18px,3vw,25px);line-height:1.45;margin:4px 0 10px;font-weight:900}
.subline{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
.subline span{background:#ffffff08;border:1px solid #ffffff0c;padding:4px 9px;border-radius:9px;font-weight:700}

/* Panel */
.panel{background:linear-gradient(155deg,#15233aee,#0d1524f5);border:1px solid #8ab4ff20;border-radius:20px;overflow:hidden;position:sticky;top:78px}
.panel-head{padding:16px;border-bottom:1px solid #ffffff0c}
.panel-head h2{font-size:14px;margin:0;font-weight:900}
.list{padding:9px 10px;display:flex;flex-direction:column;gap:7px;max-height:min(62vh,680px);overflow:auto}
.item{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid transparent;border-radius:14px;cursor:pointer;transition:.2s;}
.item:hover{background:#ffffff08;border-color:#ffffff12}
.item.active{background:linear-gradient(105deg,#477ff51b,#477ff508);border-color:#5b8cff45}
.num{flex:0 0 26px;width:26px;height:26px;border-radius:9px;background:#ffffff0d;display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:900}
.item.active .num{background:var(--blue);color:#fff}
.thumb{width:76px;aspect-ratio:16/9;border-radius:9px;background:#111a2a;position:relative;overflow:hidden;border:1px solid #ffffff12}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.itemtxt{min-width:0;flex:1}
.itemtitle{font-size:11.5px;font-weight:800;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.itemmeta{font-size:10px;color:var(--muted);margin-top:4px}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .layout{grid-template-columns:1fr;gap:16px}
  .panel{position:relative;top:auto;order:2}
}
</style>
</head>
<body>

<header class="top">
  <div class="topin">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 11 7-11 7z"/></svg>
      </div>
      <div class="brand-txt">
        <b>ثانوية club</b>
        <span>مشغل المحاضرات</span>
      </div>
    </div>
    <div class="grow"></div>
    <button class="btn" id="backBtn">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg>
      <span>رجوع للمحتوى</span>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="crumb" id="crumb">جاري تجهيز المشغل…</div>

  <div class="layout">
    <section class="main">
      <article class="player-card">
        <div class="screen" id="screen">
          <video id="video" playsinline webkit-playsinline controls></video>

          <!-- Loading -->
          <div class="loading show" id="loading">
            <div class="spin"></div>
            <span id="loadText">جاري تحميل المحاضرة…</span>
          </div>

          <!-- Error -->
          <div class="error" id="error">
            <div class="eic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.1"/></svg></div>
            <b id="errorTitle">مش قادر أشغّل الفيديو</b>
            <p id="errorText">تأكد من الاتصال وحاول مرة تانية.</p>
            <div class="eact">
              <button class="ctrl" id="retryBtn" type="button">إعادة المحاولة</button>
            </div>
          </div>
        </div>
      </article>

      <!-- Info -->
      <div class="titlebox">
        <div class="eyebrow" id="lectureName" style="font-size:11px;color:var(--blue2);font-weight:900;">محتوى المحاضرة</div>
        <h1 id="videoTitle">جاري تجهيز الفيديو…</h1>
        <div class="subline">
          <span id="videoCount">— فيديو</span>
        </div>
      </div>
    </section>

    <!-- PLAYLIST -->
    <aside class="panel">
      <div class="panel-head">
        <h2>قائمة الفيديوهات</h2>
      </div>
      <div class="list" id="videoList"><div style="padding:20px;text-align:center;color:var(--muted)">جاري التحميل...</div></div>
    </aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function(){
'use strict';

const API = '';
const TOKEN_KEY = 'student_token'; 
const token = localStorage.getItem(TOKEN_KEY);
const qs = new URLSearchParams(location.search);
const lectureId = qs.get('lectureId');
const initialVideoId = qs.get('videoId');

const $ = id => document.getElementById(id);
const video = $('video');

let videos = [], current = -1, hls = null;

async function api(path, opts = {}) {
  const headers = { Accept: 'application/json', ...opts.headers };
  if (token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body, cache: 'no-store' });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) {
    const er = new Error(d.message || `خطأ (${r.status})`);
    er.status = r.status;
    throw er;
  }
  return d.data !== undefined ? d.data : d;
}

function setLoading(on, text) {
  const l = $('loading');
  l.classList.toggle('show', !!on);
  if (text) $('loadText').textContent = text;
}

function showError(msg) {
  $('errorText').textContent = msg;
  $('error').classList.add('show');
  setLoading(false);
}
function hideError() { $('error').classList.remove('show'); }

async function playIndex(i, autoplay) {
  if (i < 0 || i >= videos.length) return;
  current = i;
  const item = videos[i];
  
  $('videoTitle').textContent = item.title;
  hideError();
  setLoading(true, 'جاري تجهيز الفيديو...');
  
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute('src');
  video.load();

  try {
    // طلب جلسة تشغيل من السيرفر
    const res = await api('/api/play/' + encodeURIComponent(item.id), { method: 'POST' });
    
    // لو الفيديو يوتيوب
    if (res && res.type === 'youtube') {
      setLoading(false);
      window.location.href = res.youtube_url;
      return;
    }

    // لو الفيديو MP4 مباشر
    if (res && res.type === 'mp4') {
      setLoading(false);
      video.src = res.play_url;
      if (autoplay) video.play().catch(()=>{});
      renderList();
      return;
    }

    // لو الفيديو HLS (الرابط اللي راجع من السيرفر زي /api/hls/...)
    if (res && res.play_url) {
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 30 });
        hls.loadSource(res.play_url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          setLoading(false);
          if (autoplay) video.play().catch(()=>{});
        });
        hls.on(Hls.Events.ERROR, function(_e, d) {
          if (d.fatal) {
            if (d.response && d.response.code === 401) {
               showError('انتهت الجلسة. سجل الدخول من جديد.');
            } else {
               showError('مشكلة في تحميل الفيديو. حاول تاني.');
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = res.play_url;
        setLoading(false);
        if (autoplay) video.play().catch(()=>{});
      } else {
        showError('متصفحك لا يدعم تشغيل HLS');
      }
      renderList();
      return;
    }
    
    throw new Error('لم يتم إرجاع رابط فيديو صالح من السيرفر');
    
  } catch (e) {
    if (e.status === 401) showError('انتهت الجلسة. يرجى تسجيل الدخول مرة أخرى.');
    else showError(e.message || 'حدث خطأ غير متوقع');
  }
}

function renderList() {
  const list = $('videoList');
  if (!videos.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">لا يوجد فيديوهات.</div>';
    return;
  }
  list.innerHTML = videos.map((v, i) => `
    <div class="item ${i === current ? 'active' : ''}" onclick="window.playVideo(${i})">
      <div class="num">${i+1}</div>
      <div class="thumb">${v.thumbnail ? `<img src="${v.thumbnail}">` : ''}</div>
      <div class="itemtxt">
        <div class="itemtitle">${v.title}</div>
      </div>
    </div>
  `).join('');
}

// expose function to onclick
window.playVideo = function(i) { playIndex(i, true); };

async function init() {
  if (!lectureId) {
    showError('رابط المشغل غير صحيح.');
    return;
  }
  try {
    const d = await api('/api/lectures/' + encodeURIComponent(lectureId) + '/content');
    videos = (d.videos || []).map((v, i) => ({
      id: v.id,
      title: v.title || v.name || `فيديو ${i+1}`,
      thumbnail: v.thumbnail || v.image_url || ''
    }));
    
    const lectureName = d.name || d.title || 'المحاضرة';
    $('crumb').textContent = 'المحتوى / ' + lectureName;
    $('lectureName').textContent = lectureName;
    $('videoCount').textContent = videos.length + ' فيديو';

    renderList();
    
    let idx = videos.findIndex(v => String(v.id) === String(initialVideoId));
    if (idx < 0) idx = 0;
    
    if (videos.length > 0) {
      await playIndex(idx, false);
    } else {
      setLoading(false);
      $('videoTitle').textContent = 'لا توجد فيديوهات متاحة';
    }
  } catch (e) {
    if (e.status === 401) showError('انتهت الجلسة. يرجى تسجيل الدخول مرة أخرى.');
    else showError(e.message);
  }
}

$('backBtn').onclick = () => history.back();
$('retryBtn').onclick = () => playIndex(current, true);

init();
})();
</script>
</body>
</html>
