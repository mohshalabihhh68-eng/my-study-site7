<!doctype html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مشغل المحاضرة | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
:root{--bg:#080d18;--panel:#111a2a;--line:rgba(255,255,255,.1);--text:#f3f6ff;--muted:#91a0ba;--blue:#4285ff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh}
.top{position:sticky;top:0;z-index:100;background:rgba(8,13,24,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;font-size:18px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);display:grid;place-items:center}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;padding:8px 16px;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:.2s}
.btn:hover{background:rgba(255,255,255,.1)}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.layout{display:grid;grid-template-columns:1fr 320px;gap:20px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.video-container{background:#000;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:16/9;border:1px solid var(--line);box-shadow:0 20px 40px rgba(0,0,0,.4)}
video{width:100%;height:100%;display:block;object-fit:contain}
.error-overlay{position:absolute;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:10}
.error-overlay.show{display:flex}
.loader{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9}
.loader.show{display:flex}
.spin{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.info-box{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.info-box h1{font-size:22px;margin:0 0 10px;font-weight:900}
.info-box p{color:var(--muted);font-size:14px;margin:0;line-height:1.6}
.playlist{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.playlist-head{padding:16px;border-bottom:1px solid var(--line);font-weight:900;font-size:15px}
.playlist-items{overflow-y:auto;flex:1}
.v-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line);transition:.2s}
.v-item:hover{background:rgba(255,255,255,.03)}
.v-item.active{background:rgba(66,133,255,.1);border-right:3px solid var(--blue)}
.v-item .num{width:24px;height:24px;background:rgba(255,255,255,.05);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0}
.v-item.active .num{background:var(--blue);color:#fff}
.v-item .title{font-size:13px;font-weight:700;line-height:1.4}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m8 5 11 7-11 7z"/></svg></div>ثانوية club</div>
  <a href="javascript:history.back()" class="btn">← رجوع للمواد</a>
</header>

<main class="wrap">
  <div class="layout">
    <div class="main">
      <div class="video-container">
        <video id="player" controls playsinline></video>
        <div class="loader" id="loader"><div class="spin"></div><span style="margin-top:10px;font-weight:700;font-size:14px">جاري التحميل...</span></div>
        <div class="error-overlay" id="errorOverlay">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2" style="margin-bottom:15px"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <h2 id="errorTitle" style="margin:0 0 10px;font-size:18px">مش قادر أشغّل الفيديو</h2>
          <p id="errorText" style="color:var(--muted);font-size:14px;margin-bottom:20px">حاول تحديث الصفحة أو تسجيل الدخول من جديد</p>
          <button class="btn" onclick="location.reload()" style="background:var(--blue);border:none">إعادة المحاولة</button>
        </div>
      </div>
      <div class="info-box">
        <h1 id="videoTitle">جاري تجهيز المحاضرة...</h1>
        <p id="lectureName">يرجى الانتظار...</p>
      </div>
    </div>

    <div class="playlist">
      <div class="playlist-head">قائمة المحاضرات</div>
      <div class="playlist-items" id="playlist"></div>
    </div>
  </div>
</main>

<script>
const API_BASE = '';
const TOKEN = localStorage.getItem('student_token');
const qs = new URLSearchParams(location.search);
const lectureId = qs.get('lectureId');
const videoId = qs.get('videoId');

const player = document.getElementById('player');
const loader = document.getElementById('loader');
const errorOverlay = document.getElementById('errorOverlay');
const errorTitle = document.getElementById('errorTitle');
const errorText = document.getElementById('errorText');

let hls = null;
let videosList = [];
let currentIndex = -1;

async function fetchAPI(path, options = {}) {
  const headers = { 'Accept': 'application/json', ...(options.headers || {}) };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(API_BASE + path, { ...options, headers });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || 'خطأ في الاتصال بالسيرفر');
  return data;
}

async function playVideo(videoId, title) {
  try {
    loader.classList.add('show');
    errorOverlay.classList.remove('show');
    player.pause();
    player.removeAttribute('src');
    if(hls) { hls.destroy(); hls = null; }
    player.load();

    if (title) document.getElementById('videoTitle').textContent = title;

    const res = await fetchAPI('/api/play/' + encodeURIComponent(videoId), { method: 'POST' });
    
    // السيرفر بيرجع البيانات جوه data أو مباشرة
    const playData = res.data || res;

    if (playData.type === 'youtube') {
       window.open(playData.youtube_url || playData.url, '_blank');
       loader.classList.remove('show');
       return;
    }

    if (playData.type === 'mp4') {
       player.src = playData.play_url || playData.mp4_url;
       player.play();
       loader.classList.remove('show');
       return;
    }

    const playUrl = playData.play_url;
    if (playUrl) {
       if (window.Hls && Hls.isSupported()) {
         hls = new Hls({ maxBufferLength: 30 });
         hls.loadSource(playUrl);
         hls.attachMedia(player);
         hls.on(Hls.Events.MANIFEST_PARSED, () => {
           loader.classList.remove('show');
           player.play();
         });
         hls.on(Hls.Events.ERROR, (event, data) => {
           if (data.fatal) {
             loader.classList.remove('show');
             errorOverlay.classList.add('show');
             errorTitle.textContent = 'خطأ في التشغيل';
             errorText.textContent = 'حدث خطأ أثناء تحميل الفيديو، قد تكون الجلسة انتهت.';
           }
         });
       } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
         player.src = playUrl;
         loader.classList.remove('show');
         player.play();
       } else {
         throw new Error('متصفحك لا يدعم تشغيل الفيديو');
       }
       return;
    }

    throw new Error('لم يتم العثور على رابط الفيديو في رد السيرفر');

  } catch (error) {
    loader.classList.remove('show');
    errorOverlay.classList.add('show');
    errorTitle.textContent = 'مشكلة في التشغيل';
    errorText.textContent = error.message;
  }
}

async function init() {
  if (!lectureId) {
    errorOverlay.classList.add('show');
    errorText.textContent = 'رابط المشغل خاطئ، يرجى العودة لصفحة المحتوى.';
    return;
  }

  try {
    const res = await fetchAPI('/api/lectures/' + encodeURIComponent(lectureId) + '/content');
    
    // تعديل مهم: السيرفر بيرجع البيانات جوه data
    const data = res.data || res;
    const lectureName = data.name || data.lecture_name || data.title || 'المحاضرة';
    document.getElementById('lectureName').textContent = 'محتوى: ' + lectureName;
    
    videosList = data.videos || [];
    
    const playlistDiv = document.getElementById('playlist');
    if (videosList.length === 0) {
      playlistDiv.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted)">لا يوجد فيديوهات</div>';
      return;
    }

    playlistDiv.innerHTML = videosList.map((v, i) => `
      <div class="v-item" onclick="playVideo('${v.id}', '${(v.title || v.name || 'فيديو').replace(/'/g, "\\'")}')" data-idx="${i}">
        <div class="num">${i+1}</div>
        <div class="title">${v.title || v.name || 'فيديو'}</div>
      </div>
    `).join('');

    let targetId = videoId;
    if (!targetId && videosList.length > 0) targetId = videosList[0].id;
    
    const idx = videosList.findIndex(v => String(v.id) === String(targetId));
    currentIndex = idx >= 0 ? idx : 0;
    
    const targetVideo = videosList[currentIndex];
    document.querySelectorAll('.v-item').forEach((el, i) => {
      if (i === currentIndex) el.classList.add('active');
    });

    playVideo(targetVideo.id, targetVideo.title || targetVideo.name);

  } catch (e) {
    errorOverlay.classList.add('show');
    errorText.textContent = e.message;
  }
}

player.onplay = () => {
  document.querySelectorAll('.v-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIndex);
  });
};

init();
</script>
</body>
</html>
