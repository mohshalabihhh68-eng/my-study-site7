<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل الفيديو</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
    header { text-align: center; margin-bottom: 20px; padding: 16px; background: #1e293b; border-radius: 12px; position: relative; }
    header h1 { color: #38bdf8; font-size: 20px; }
    header a { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #94a3b8; text-decoration: none; font-size: 14px; }
    header a:hover { color: #38bdf8; }
    .player-wrap { max-width: 960px; margin: 0 auto; width: 100%; background: #000; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; display: block; background: #000; }
    #status { text-align: center; padding: 20px; font-size: 16px; color: #94a3b8; }
    #status.error { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">🎬 جاري التحميل...</h1>
    <a href="javascript:history.back()">← رجوع</a>
  </header>

  <div class="player-wrap">
    <video id="video" controls playsinline></video>
  </div>
  <div id="status">⏳ جاري تجهيز الفيديو...</div>

  <script>
    const API = "";
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("id");
    const videoName = params.get("name") || "المحاضرة";

    const videoEl = document.getElementById("video");
    const statusEl = document.getElementById("status");
    const titleEl = document.getElementById("title");

    titleEl.textContent = "🎬 " + videoName;

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = isError ? "error" : "";
    }

    async function startPlayback() {
      if (!videoId) {
        setStatus("❌ رقم الفيديو غير موجود", true);
        return;
      }

      try {
        setStatus("⏳ جاري طلب جلسة التشغيل...");
        // 1) جلب جلسة التشغيل من السيرفر
        const res = await fetch(`${API}/api/play/${videoId}`, { method: "POST" });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || "فشل بدء التشغيل");

        const manifestUrl = data.data.manifest_url;
        setStatus("⏳ جاري تحميل المقطع...");

        // 2) تشغيل الـ Manifest باستخدام hls.js
        if (Hls.isSupported()) {
          const hls = new Hls({
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
          });
          hls.loadSource(manifestUrl);
          hls.attachMedia(videoEl);

          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            setStatus("▶ اضغط تشغيل في المشغل");
            videoEl.play().catch(() => {});
          });

          hls.on(Hls.Events.ERROR, function (evt, data) {
            if (data.fatal) {
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                setStatus("❌ خطأ شبكة، جرب إعادة التشغيل...", true);
                hls.startLoad();
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                setStatus("❌ خطأ في الميديا، جرب إعادة التشغيل...", true);
                hls.recoverMediaError();
              } else {
                setStatus("❌ فشل التشغيل: " + data.type, true);
                hls.destroy();
              }
            }
          });
        } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
          // دعم Safari الأصلي
          videoEl.src = manifestUrl;
          videoEl.addEventListener("loadedmetadata", () => {
            setStatus("▶ اضغط تشغيل في المشغل");
            videoEl.play().catch(() => {});
          });
        } else {
          setStatus("❌ المتصفح لا يدعم تشغيل HLS", true);
        }
      } catch (e) {
        setStatus("❌ خطأ: " + e.message, true);
      }
    }

    startPlayback();
  </script>
</body>
</html>
