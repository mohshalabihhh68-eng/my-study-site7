<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>تسجيل الدخول | ثانوية club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --panel: #101a2b;
    --text: #f4f7ff;
    --muted: #8b9bb8;
    --blue: #3b82f6;
    --blue2: #60a5fa;
    --blue3: #2563eb;
    --line: rgba(148, 163, 184, .12);
    --red: #ef4444;
    --green: #10b981;
    --amber: #f59e0b;
    --glass: rgba(16, 26, 43, 0.65);
  }
  * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* تأثيرات الخلفية الفخمة */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,0.15), transparent),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(96,165,250,0.08), transparent),
      linear-gradient(180deg, #070b14 0%, #0a1120 100%);
    z-index: -2;
  }
  
  /* شبكة خفيفة */
  body::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at center, black, transparent 70%);
    z-index: -1;
    pointer-events: none;
  }

  /* كرات الإضاءة المتحركة */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: -1;
    animation: float 8s ease-in-out infinite;
  }
  .orb-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(59,130,246,0.4), transparent 70%);
    top: -100px; right: -100px;
    animation-delay: 0s;
  }
  .orb-2 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(96,165,250,0.3), transparent 70%);
    bottom: -80px; left: -80px;
    animation-delay: -4s;
  }
  .orb-3 {
    width: 250px; height: 250px;
    background: radial-gradient(circle, rgba(16,185,129,0.2), transparent 70%);
    top: 50%; left: 20%;
    animation-delay: -2s;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(30px, -30px) scale(1.1); }
  }

  /* الكارت الزجاجي */
  .login-container {
    background: rgba(16, 26, 43, 0.7);
    backdrop-filter: blur(30px) saturate(1.5);
    -webkit-backdrop-filter: blur(30px) saturate(1.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 28px;
    padding: 48px 40px;
    width: 100%;
    max-width: 430px;
    box-shadow: 
      0 30px 100px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.1);
    animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    position: relative;
    z-index: 1;
    margin: 20px;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(40px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* اللوجو الفخم */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 28px;
  }
  .logo-wrap {
    position: relative;
    width: 80px;
    height: 80px;
  }
  .logo-wrap::before {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 24px;
    background: conic-gradient(from 0deg, #3b82f6, #a855f7, #06b6d4, #3b82f6);
    animation: spin 4s linear infinite;
    opacity: 0.6;
    filter: blur(12px);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .logo {
    position: relative;
    width: 80px;
    height: 80px;
    border-radius: 22px;
    background: linear-gradient(145deg, #1e3a8a, #1e40af);
    display: grid;
    place-items: center;
    box-shadow: 
      0 15px 40px rgba(37, 99, 235, 0.5),
      inset 0 1px 0 rgba(255,255,255,0.2);
    overflow: hidden;
  }
  .logo::after {
    content: "";
    position: absolute;
    inset: -50%;
    background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,0.4) 50%, transparent 65%);
    animation: sweep 3s ease-in-out infinite;
  }
  @keyframes sweep {
    0%, 60% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .logo svg { width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; position: relative; z-index: 1; }
  
  .brand-text { font-size: 26px; font-weight: 900; }
  .brand-text span { 
    background: linear-gradient(135deg, #60a5fa, #a78bfa); 
    -webkit-background-clip: text; 
    background-clip: text; 
    color: transparent;
  }
  .brand-sub { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 4px; }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
    font-weight: 600;
    line-height: 1.7;
  }

  /* تحذير الجهاز */
  .warn-box {
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.3);
    color: #fcd34d;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 12.5px;
    font-weight: 700;
    margin-bottom: 18px;
    display: none;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.6;
    animation: slideDown 0.3s ease;
  }
  .warn-box.show { display: flex; }
  .warn-box svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* خانة الإدخال */
  .input-wrapper {
    position: relative;
    margin-bottom: 18px;
  }
  .input-icon {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    stroke: var(--muted);
    fill: none;
    stroke-width: 2;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 2;
  }
  .code-input {
    width: 100%;
    padding: 18px 52px 18px 100px;
    border-radius: 16px;
    border: 1.5px solid rgba(255,255,255,0.08);
    background: rgba(8, 13, 25, 0.8);
    color: #fff;
    font-family: 'Cairo', monospace;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    transition: all 0.3s ease;
    text-align: center;
    direction: ltr;
  }
  .code-input:focus {
    outline: none;
    border-color: var(--blue);
    background: rgba(8, 13, 25, 0.95);
    box-shadow: 
      0 0 0 4px rgba(59, 130, 246, 0.15),
      0 8px 24px rgba(59, 130, 246, 0.2);
  }
  .code-input:focus + .input-icon { stroke: var(--blue2); }
  .code-input::placeholder {
    color: rgba(139, 155, 184, 0.4);
    letter-spacing: 2px;
    font-size: 16px;
    font-weight: 600;
  }
  
  /* أزرار الإدخال */
  .input-actions {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 6px;
    z-index: 2;
  }
  .mini-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mini-btn:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-color: rgba(255,255,255,0.15);
  }
  .mini-btn:active { transform: scale(0.92); }
  .mini-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* زرار الدخول */
  .btn-login {
    width: 100%;
    padding: 17px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    box-shadow: 
      0 10px 30px rgba(37, 99, 235, 0.4),
      inset 0 1px 0 rgba(255,255,255,0.2);
    position: relative;
    overflow: hidden;
  }
  .btn-login::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s;
  }
  .btn-login:hover::before { transform: translateX(100%); }
  .btn-login:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 
      0 15px 40px rgba(37, 99, 235, 0.6),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn-login:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-login svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* سبينر */
  .spinner {
    width: 20px;
    height: 20px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  /* رسالة الخطأ */
  .error-box {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 12.5px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 18px;
    display: none;
    line-height: 1.6;
    animation: shake 0.4s ease;
  }
  .error-box.show { display: block; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* عداد المحاولات */
  .attempts {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
    display: none;
  }
  .attempts.show { display: block; }
  .attempts b { color: var(--amber); }

  /* الفوتر */
  .footer-text {
    text-align: center;
    margin-top: 26px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 20px;
    line-height: 1.8;
  }
  .footer-text a {
    color: var(--blue2);
    text-decoration: none;
    font-weight: 700;
    transition: color 0.2s;
  }
  .footer-text a:hover { color: #93c5fd; }

  /* زر العودة للرئيسية */
  .back-home {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  .back-home:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  .back-home svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 480px) {
    .login-container { padding: 36px 24px; border-radius: 24px; margin: 16px; }
    .logo-wrap, .logo { width: 70px; height: 70px; }
    .logo svg { width: 34px; height: 34px; }
    .brand-text { font-size: 22px; }
    .code-input { font-size: 19px; padding: 16px 46px 16px 90px; letter-spacing: 3px; }
    .input-icon { right: 14px; }
    .input-actions { left: 8px; gap: 4px; }
    .mini-btn { width: 32px; height: 32px; }
    .back-home { top: 12px; right: 12px; padding: 6px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- كرات الإضاءة -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- زر العودة -->
<a href="index.html" class="back-home">
  <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg>
  الرئيسية
</a>

<div class="login-container">
  <div class="brand">
    <div class="logo-wrap">
      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="m2 8 10-5 10 5-10 5L2 8Z"/>
          <path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/>
        </svg>
      </div>
    </div>
    <div>
      <div class="brand-text">ثانوية <span>club</span></div>
      <div class="brand-sub">منصة المحاضرات الأولى</div>
    </div>
  </div>

  <div class="subtitle">أهلاً بيك في رحلة نجاحك!<br>ادخل كود الطالب للمتابعة</div>

  <div class="warn-box" id="warn-box">
    <svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <div>
      <strong>تنبيه:</strong> الجهاز ده مش مسجل قبل كده. لو دخلت، ممكن يطرد جهاز تاني متسجل على نفس الكود.
    </div>
  </div>

  <div class="error-box" id="error-msg"></div>

  <div class="input-wrapper">
    <input type="text" id="code-input" class="code-input" placeholder="ادخل الكود" maxlength="11" inputmode="numeric" autocomplete="off">
    <svg class="input-icon" viewBox="0 0 24 24">
      <rect x="3" y="11" width="18" height="11" rx="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <div class="input-actions">
      <button class="mini-btn" id="paste-btn" title="لصق من الحافظة" aria-label="لصق">
        <svg viewBox="0 0 24 24">
          <rect x="8" y="2" width="8" height="4" rx="1"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
        </svg>
      </button>
      <button class="mini-btn" id="clear-btn" title="مسح" aria-label="مسح" style="display:none">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <button class="btn-login" id="btn-login">
    <span id="btn-text">تسجيل الدخول</span>
    <svg id="btn-arrow" viewBox="0 0 24 24">
      <path d="M5 12h14M13 6l6 6-6 6"/>
    </svg>
  </button>

  <div class="attempts" id="attempts">
    متبقي لك <b id="attempts-num">5</b> محاولات قبل القفل المؤقت
  </div>

  <div class="footer-text">
    محتاج مساعدة؟ <a href="https://t.me/S7alaby7" target="_blank" rel="noopener">تواصل مع الإدارة</a>
  </div>
</div>

<script>
(function() {
  'use strict';

  const API = ''; // نفس الدومين
  const $ = id => document.getElementById(id);

  const codeInput = $('code-input');
  const btnLogin = $('btn-login');
  const btnText = $('btn-text');
  const btnArrow = $('btn-arrow');
  const errorMsg = $('error-msg');
  const warnBox = $('warn-box');
  const attemptsBox = $('attempts');
  const attemptsNum = $('attempts-num');
  const pasteBtn = $('paste-btn');
  const clearBtn = $('clear-btn');

  // تذكر الكود السابق
  const LAST_CODE_KEY = 'student_last_code';
  const LAST_DEVICE_KEY = 'student_device_id';

  // توليد deviceId ثابت لو مش موجود
  function getDeviceId() {
    let id = localStorage.getItem(LAST_DEVICE_KEY);
    if (!id) {
      id = 'web_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
      localStorage.setItem(LAST_DEVICE_KEY, id);
    }
    return id;
  }

  // زخرفة الكود (123-456-789)
  function formatCode(value) {
    const digits = value.replace(/\D/g, '').slice(0, 9);
    const parts = [];
    for (let i = 0; i < digits.length; i += 3) {
      parts.push(digits.slice(i, i + 3));
    }
    return parts.join('-');
  }

  // استخراج الأرقام فقط
  function cleanCode(value) {
    return value.replace(/\D/g, '').slice(0, 9);
  }

  // تهيئة
  function init() {
    // الكود المحفوظ
    const savedCode = localStorage.getItem(LAST_CODE_KEY);
    if (savedCode && /^\d{9}$/.test(savedCode)) {
      codeInput.value = formatCode(savedCode);
      codeInput.dataset.cleaned = savedCode;
      updateClearBtn();
    }
    codeInput.focus();

    // لو فيه جلسة سابقة، يروح على طول
    if (localStorage.getItem('student_token')) {
      window.location.href = 'subjects.html';
      return;
    }
  }

  function updateClearBtn() {
    const hasValue = cleanCode(codeInput.value).length > 0;
    clearBtn.style.display = hasValue ? 'grid' : 'none';
    pasteBtn.style.display = hasValue ? 'none' : 'grid';
  }

  function showError(msg, seconds) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    setTimeout(() => errorMsg.classList.remove('show'), (seconds || 6) * 1000);
  }

  function showAttempts(n) {
    if (n > 0 && n <= 5) {
      attemptsNum.textContent = n;
      attemptsBox.classList.add('show');
    } else {
      attemptsBox.classList.remove('show');
    }
  }

  function setLoading(on) {
    btnLogin.disabled = on;
    if (on) {
      btnText.textContent = 'جاري التحقق...';
      btnArrow.style.display = 'none';
      if (!document.querySelector('.spinner')) {
        const sp = document.createElement('div');
        sp.className = 'spinner';
        btnLogin.insertBefore(sp, btnText);
      }
    } else {
      btnText.textContent = 'تسجيل الدخول';
      btnArrow.style.display = '';
      const sp = document.querySelector('.spinner');
      if (sp) sp.remove();
    }
  }

  // عند الإدخال
  codeInput.addEventListener('input', (e) => {
    const raw = e.target.value;
    const cleaned = cleanCode(raw);
    const formatted = formatCode(cleaned);
    e.target.value = formatted;
    e.target.dataset.cleaned = cleaned;
    updateClearBtn();
    
    // إخفاء التحذيرات عند الكتابة
    warnBox.classList.remove('show');
  });

  // منع إدخال حروف
  codeInput.addEventListener('keypress', (e) => {
    if (!/[0-9]/.test(e.key) && !['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) {
      e.preventDefault();
    }
  });

  // زر الدخول بـ Enter
  codeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      login();
    }
  });

  // زر لصق
  pasteBtn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      const cleaned = cleanCode(text);
      if (cleaned) {
        codeInput.value = formatCode(cleaned);
        codeInput.dataset.cleaned = cleaned;
        updateClearBtn();
        codeInput.focus();
      }
    } catch (err) {
      showError('مش قادر أقرأ من الحافظة. الصق يدوياً.', 4);
    }
  });

  // زر مسح
  clearBtn.addEventListener('click', () => {
    codeInput.value = '';
    codeInput.dataset.cleaned = '';
    codeInput.focus();
    updateClearBtn();
    errorMsg.classList.remove('show');
    warnBox.classList.remove('show');
  });

  // الدخول
  async function login() {
    const code = codeInput.dataset.cleaned || cleanCode(codeInput.value);
    const deviceId = getDeviceId();
    const deviceName = 'Web Browser';

    // التحقق
    if (code.length !== 9) {
      showError('الكود لازم يكون 9 أرقام');
      codeInput.focus();
      return;
    }

    setLoading(true);
    errorMsg.classList.remove('show');
    warnBox.classList.remove('show');
    attemptsBox.classList.remove('show');

    try {
      const response = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, deviceId, deviceName })
      });

      const data = await response.json();

      if (data.success) {
        // حفظ الكود للاستخدام في المرة الجاية
        localStorage.setItem(LAST_CODE_KEY, code);
        
        // حفظ الجلسة
        localStorage.setItem('student_token', data.data.token);
        localStorage.setItem('student_name', data.data.student.name);
        
        // أنيميشن صغير ثم التحويل
        btnText.textContent = 'تم الدخول ✓';
        btnLogin.style.background = 'linear-gradient(135deg, #10b981, #059669)';
        
        setTimeout(() => {
          window.location.href = 'subjects.html';
        }, 600);
        return;
      }

      // معالجة الأخطاء
      const msg = data.message || 'كود غير صحيح';
      
      // استخراج عدد المحاولات المتبقية من الرسالة
      const attemptsMatch = msg.match(/متبقي\s+(\d+)\s+محاولات/);
      if (attemptsMatch) {
        showAttempts(parseInt(attemptsMatch[1]));
      }
      
      // تحذير الجهاز
      if (msg.includes('الحد الأقصى للأجهزة') || msg.includes('الأجهزة')) {
        warnBox.classList.add('show');
        warnBox.innerHTML = `
          <svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div><strong>الجهاز ده مش مسجل:</strong> ${msg} <br>تواصل مع الإدارة لو محتاج تدخل من الجهاز ده.</div>
        `;
        errorMsg.classList.remove('show');
      } else {
        showError(msg);
      }

      setLoading(false);
    } catch (err) {
      console.error(err);
      showError('خطأ في الاتصال بالسيرفر. جرب تاني بعد شوية.');
      setLoading(false);
    }
  }

  // زر الدخول
  btnLogin.addEventListener('click', login);

  // بدء
  init();
})();
</script>
</body>
</html>
