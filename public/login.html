<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Cairo', sans-serif; background: #080d19; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .login-box { background: #101a2b; padding: 40px 30px; border-radius: 20px; border: 1px solid rgba(160,183,220,.15); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 24px 70px #0007; }
  h2 { margin-top: 0; font-weight: 800; margin-bottom: 10px; }
  p { color: #a1aec5; font-size: 14px; margin-bottom: 25px; }
  input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 12px; border: 1px solid #4285ff44; background: #080d19; color: #fff; font-family: inherit; font-size: 18px; text-align: center; box-sizing: border-box; letter-spacing: 2px; }
  input:focus { outline: none; border-color: #4285ff; }
  button { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg,#4c91ff,#2858df); color: #fff; font-family: inherit; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px #2563eb55; }
  .error { color: #ff6b6b; font-size: 13px; margin-bottom: 15px; display: none; }
</style>
</head>
<body>

<div class="login-box">
  <h2>أهلاً بيك 👋</h2>
  <p>ادخل الكود المكون من 9 أرقام الخاص بك</p>
  <div class="error" id="error-msg"></div>
  <input type="text" id="code-input" placeholder="123456789" maxlength="9" inputmode="numeric">
  <button onclick="login()" id="btn">دخول للمنصة</button>
</div>

<script>
  // لو الطالب مسجل دخول قبل كده، يوديه على طول
  if (localStorage.getItem('student_token')) {
    window.location.href = 'subjects.html';
  }

  async function login() {
    const code = document.getElementById('code-input').value.trim();
    const btn = document.getElementById('btn');
    const errMsg = document.getElementById('error-msg');

    if (code.length !== 9) {
      errMsg.textContent = "الكود لازم يكون 9 أرقام";
      errMsg.style.display = 'block';
      return;
    }

    btn.textContent = 'جاري الدخول...';
    btn.disabled = true;
    errMsg.style.display = 'none';

    // deviceId عشوائي بيتحفظ في المتصفح عشان السيرفر يعرف الجهاز
    let deviceId = localStorage.getItem('device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2, 15);
      localStorage.setItem('device_id', deviceId);
    }

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: code,
          deviceId: deviceId,
          deviceName: 'Web Browser'
        })
      });

      const data = await response.json();

      if (data.success) {
        // حفظ التوكن في المتصفح
        localStorage.setItem('student_token', data.data.token);
        localStorage.setItem('student_name', data.data.student.name);
        // التوجه لصفحة المواد
        window.location.href = 'subjects.html';
      } else {
        errMsg.textContent = data.message || "كود غير صحيح";
        errMsg.style.display = 'block';
      }
    } catch (error) {
      errMsg.textContent = "حدث خطأ في الاتصال بالسيرفر";
      errMsg.style.display = 'block';
    } finally {
      btn.textContent = 'دخول للمنصة';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
