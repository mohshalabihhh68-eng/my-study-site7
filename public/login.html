<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>تسجيل الدخول | ثانوية club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --panel: #101a2b;
    --text: #f4f7ff;
    --muted: #8b9bb8;
    --blue: #3b82f6;
    --blue2: #60a5fa;
    --blue3: #2563eb;
    --line: rgba(148, 163, 184, .12);
    --red: #ef4444;
  }
  * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* تأثيرات الخلفية */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 78% 0%, #1e4c9a40, transparent 40%),
                radial-gradient(ellipse at 5% 48%, #3e76e02a, transparent 35%),
                linear-gradient(180deg, #080d19, #0a1120 60%, #080d19);
    z-index: -1;
  }
  .orb {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: linear-gradient(135deg, #357dff2d, #42e4bd10);
    filter: blur(10px);
    border: 1px solid #6aa0ff24;
    animation: float 8s ease-in-out infinite;
    z-index: -1;
    top: 10%;
    right: 10%;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.05); }
  }

  /* الكارت */
  .login-container {
    background: linear-gradient(150deg, #172641ed, #0e1728ed);
    border: 1px solid rgba(168, 197, 255, 0.15);
    border-radius: 28px;
    padding: 45px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 30px 100px rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    position: relative;
    z-index: 1;
    margin: 20px;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* اللوجو */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 30px;
  }
  .logo {
    display: grid;
    place-items: center;
    width: 70px;
    height: 70px;
    border-radius: 20px;
    background: linear-gradient(145deg, #5ba0ff, #2454d8);
    box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
    color: white;
  }
  .logo svg { width: 35px; height: 35px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .brand-text { font-size: 24px; font-weight: 900; }
  .brand-text span { color: var(--blue2); }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 30px;
    font-weight: 600;
  }

  /* خانة الإدخال */
  .input-group {
    position: relative;
    margin-bottom: 20px;
  }
  .input-group svg.icon {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    stroke: var(--muted);
    fill: none;
    stroke-width: 2;
    transition: 0.3s;
  }
  input[type="text"] {
    width: 100%;
    padding: 16px 48px 16px 15px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: #080d19;
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 2px;
    transition: all 0.3s ease;
    text-align: center;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
  }
  input[type="text"]:focus + svg.icon {
    stroke: var(--blue2);
  }
  input::placeholder {
    color: #5c6d8a;
    letter-spacing: 0;
    text-align: center;
  }

  /* الزرار */
  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #4c91ff, #2858df);
    color: #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    box-shadow: 0 10px 28px rgba(37, 99, 235, 0.3);
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(37, 99, 235, 0.5);
  }
  .btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  /* رسالة الخطأ */
  .error-box {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: var(--red);
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 20px;
    display: none;
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* الفوتر */
  .footer-text {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 20px;
  }
</style>
</head>
<body>

<div class="orb"></div>

<div class="login-container">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/></svg>
    </div>
    <div class="brand-text">ثانوية <span>club</span></div>
  </div>

  <div class="subtitle">أهلاً بيك في رحلة نجاحك! يرجى إدخال كود الطالب للمتابعة.</div>

  <div class="error-box" id="error-msg"></div>

  <div class="input-group">
    <input type="text" id="code-input" placeholder="ادخل الكود (9 أرقام)" maxlength="9" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
    <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
  </div>

  <button class="btn" id="btn" onclick="login()">
    تسجيل الدخول
  </button>

  <div class="footer-text">
    بتحتاج مساعدة؟ <a href="index.html" style="color:var(--blue2); text-decoration:none; font-weight:bold;">تواصل مع الإدارة</a>
  </div>
</div>

<script>
  // لو الطالب مسجل دخول قبل كده، يروح على طول للمواد
  if (localStorage.getItem('student_token')) {
    window.location.href = 'subjects.html';
  }

  async function login() {
    const code = document.getElementById('code-input').value.trim();
    const btn = document.getElementById('btn');
    const errMsg = document.getElementById('error-msg');

    if (code.length !== 9) {
      showError("الكود يجب أن يتكون من 9 أرقام");
      return;
    }

    btn.innerHTML = 'جاري التحقق...';
    btn.disabled = true;
    errMsg.style.display = 'none';

    // جهاز عشوائي لو مش موجود
    let deviceId = localStorage.getItem('device_id');
    if (!deviceId) {
      deviceId = 'dev_' + Math.random().toString(36).substring(2, 15);
      localStorage.setItem('device_id', deviceId);
    }

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, deviceId: deviceId, deviceName: 'Web Browser' })
      });

      const data = await response.json();

      if (data.success) {
        localStorage.setItem('student_token', data.data.token);
        localStorage.setItem('student_name', data.data.student.name);
        window.location.href = 'subjects.html';
      } else {
        showError(data.message || "كود غير صحيح أو منتهي");
        btn.innerHTML = 'تسجيل الدخول';
        btn.disabled = false;
      }
    } catch (error) {
      showError("حدث خطأ في الاتصال بالسيرفر، يرجى المحاولة لاحقاً");
      btn.innerHTML = 'تسجيل الدخول';
      btn.disabled = false;
    }
  }

  function showError(msg) {
    const errMsg = document.getElementById('error-msg');
    errMsg.textContent = msg;
    errMsg.style.display = 'block';
  }
  
  // تفعيل زرار Enter
  document.getElementById('code-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
