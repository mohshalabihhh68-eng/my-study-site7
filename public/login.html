<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>تسجيل الدخول | ثانوية club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b14;
    --panel: #101a2b;
    --text: #f4f7ff;
    --muted: #8b9bb8;
    --blue: #3b82f6;
    --blue2: #60a5fa;
    --blue3: #2563eb;
    --line: rgba(148, 163, 184, .12);
    --red: #ef4444;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  /* خلفية ثابتة (بدون تهنيج) */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,0.15), transparent),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(96,165,250,0.08), transparent),
      linear-gradient(180deg, #070b14 0%, #0a1120 100%);
    z-index: -2;
  }

  /* الكارت الزجاجي */
  .login-container {
    background: rgba(16, 26, 43, 0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 28px;
    padding: 40px 32px;
    width: 100%;
    max-width: 400px;
    box-shadow: 
      0 30px 80px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
    animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    position: relative;
    z-index: 1;
    margin: 20px;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* اللوجو */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .logo {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    background: linear-gradient(145deg, #3b82f6, #2563eb);
    display: grid;
    place-items: center;
    box-shadow: 
      0 12px 30px rgba(37, 99, 235, 0.4),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .logo svg { width: 36px; height: 36px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  
  .brand-text { font-size: 24px; font-weight: 900; }
  .brand-text span { color: var(--blue2); }

  /* النصوص */
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 24px;
    font-weight: 600;
  }

  /* تحذير الجهاز */
  .warn-box {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.25);
    color: #fcd34d;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 12.5px;
    margin-bottom: 16px;
    display: none;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.6;
    animation: slideDown 0.3s ease;
  }
  .warn-box.show { display: flex; }
  .warn-box svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; stroke: currentColor; fill: none; stroke-width: 2; }
  .warn-box strong { display: block; margin-bottom: 2px; font-weight: 800; color: #fde68a; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  /* رسالة الخطأ */
  .error-box {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: #fca5a5;
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 16px;
    display: none;
    animation: shake 0.4s ease;
  }
  .error-box.show { display: block; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* مربعات الكود (OTP) */
  .otp-container {
    direction: ltr;
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 20px;
    width: 100%;
  }
  
  .otp-input {
    width: 100%;
    aspect-ratio: 1 / 1.2;
    max-height: 60px;
    border-radius: 12px;
    border: 1.5px solid rgba(255,255,255,0.08);
    background: rgba(8, 13, 25, 0.6);
    color: #fff;
    font-size: clamp(18px, 5vw, 24px);
    font-weight: 800;
    text-align: center;
    transition: all 0.2s ease;
    outline: none;
    padding: 0;
  }
  
  .otp-input:focus {
    border-color: var(--blue);
    background: rgba(59, 130, 246, 0.1);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    transform: translateY(-2px);
  }
  
  .otp-input.filled {
    border-color: rgba(96, 165, 250, 0.4);
    background: rgba(96, 165, 250, 0.08);
    color: var(--blue2);
  }

  /* عداد المحاولات */
  .attempts {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    display: none;
  }
  .attempts.show { display: block; }
  .attempts b { color: var(--amber); }

  /* زر الدخول */
  .btn-login {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--blue), var(--blue3));
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
  }
  .btn-login:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.5);
  }
  .btn-login:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-login svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  /* سبينر */
  .spinner {
    width: 20px;
    height: 20px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* الفوتر */
  .footer-text {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 18px;
    margin-top: 20px;
  }
  .footer-text a {
    color: var(--blue2);
    text-decoration: none;
    font-weight: 800;
    transition: color 0.2s;
  }
  .footer-text a:hover { color: #93c5fd; }

  /* زر العودة */
  .back-home {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s;
    z-index: 10;
  }
  .back-home:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .back-home svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 380px) {
    .login-container { padding: 30px 20px; border-radius: 24px; margin: 10px; }
    .logo { width: 64px; height: 64px; }
    .logo svg { width: 30px; height: 30px; }
    .brand-text { font-size: 22px; }
    .otp-input { border-radius: 10px; max-height: 50px; }
    .back-home { top: 12px; right: 12px; padding: 6px 10px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- زر العودة -->
<a href="index.html" class="back-home">
  <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 0 14h-2"/></svg>
  الرئيسية
</a>

<div class="login-container">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="m2 8 10-5 10 5-10 5L2 8Z"/>
        <path d="M6 10v5c3.5 3 8.5 3 12 0v-5M22 8v6"/>
      </svg>
    </div>
    <div class="brand-text">ثانوية <span>club</span></div>
  </div>

  <div class="subtitle">دخل كودك هنا</div>

  <!-- تحذير الجهاز -->
  <div class="warn-box" id="warn-box">
    <svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <div>
      <strong>تنبيه</strong>
      الجهاز ده مش مسجل. لو دخلت، ممكن يطرد جهاز تاني متسجل على نفس الكود.
    </div>
  </div>

  <!-- رسالة الخطأ -->
  <div class="error-box" id="error-msg"></div>

  <!-- مربعات الكود -->
  <div class="otp-container">
    <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
    <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
    <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
    <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
    <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
    <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
    <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
    <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
    <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="off">
  </div>

  <div class="attempts" id="attempts">
    متبقي لك <b id="attempts-num">5</b> محاولات قبل القفل المؤقت
  </div>

  <button class="btn-login" id="btn-login">
    <span id="btn-text">تسجيل الدخول</span>
    <svg id="btn-arrow" viewBox="0 0 24 24">
      <path d="M5 12h14M13 6l6 6-6 6"/>
    </svg>
  </button>

  <div class="footer-text">
    <a href="https://t.me/S7alaby7" target="_blank" rel="noopener">تواصل مع الأدمن</a>
  </div>
</div>

<script>
(function() {
  'use strict';

  const API = '';
  const $ = id => document.getElementById(id);

  const inputs = document.querySelectorAll('.otp-input');
  const btnLogin = $('btn-login');
  const btnText = $('btn-text');
  const btnArrow = $('btn-arrow');
  const errorMsg = $('error-msg');
  const warnBox = $('warn-box');
  const attemptsBox = $('attempts');
  const attemptsNum = $('attempts-num');

  const LAST_CODE_KEY = 'student_last_code';
  const LAST_DEVICE_KEY = 'student_device_id';

  function getDeviceId() {
    let id = localStorage.getItem(LAST_DEVICE_KEY);
    if (!id) {
      id = 'web_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
      localStorage.setItem(LAST_DEVICE_KEY, id);
    }
    return id;
  }

  function getCode() {
    let code = '';
    inputs.forEach(inp => code += inp.value.trim());
    return code;
  }

  function setInputValue(val) {
    const digits = String(val).replace(/\D/g, '').slice(0, 9).split('');
    inputs.forEach((inp, i) => {
      inp.value = digits[i] || '';
      inp.classList.toggle('filled', !!inp.value);
    });
    if (digits.length > 0 && digits.length < 9) {
      inputs[digits.length].focus();
    }
  }

  function init() {
    if (localStorage.getItem('student_token')) {
      window.location.href = 'subjects.html';
      return;
    }

    const savedCode = localStorage.getItem(LAST_CODE_KEY);
    if (savedCode && /^\d{9}$/.test(savedCode)) {
      setInputValue(savedCode);
    } else {
      inputs[0].focus();
    }
  }

  function showError(msg, seconds) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    setTimeout(() => errorMsg.classList.remove('show'), (seconds || 6) * 1000);
  }

  function showAttempts(n) {
    if (n > 0 && n <= 5) {
      attemptsNum.textContent = n;
      attemptsBox.classList.add('show');
    } else {
      attemptsBox.classList.remove('show');
    }
  }

  function setLoading(on) {
    btnLogin.disabled = on;
    if (on) {
      btnText.textContent = 'جاري التحقق...';
      btnArrow.style.display = 'none';
      if (!document.querySelector('.spinner')) {
        const sp = document.createElement('div');
        sp.className = 'spinner';
        btnLogin.insertBefore(sp, btnText);
      }
    } else {
      btnText.textContent = 'تسجيل الدخول';
      btnArrow.style.display = '';
      const sp = document.querySelector('.spinner');
      if (sp) sp.remove();
    }
  }

  // التعامل مع الإدخال
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', (e) => {
      const val = e.target.value.replace(/\D/g, '');
      e.target.value = val;
      inp.classList.toggle('filled', !!val);

      if (val) {
        if (i < inputs.length - 1) inputs[i + 1].focus();
      }
      warnBox.classList.remove('show');
    });

    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value) {
        if (i > 0) {
          inputs[i - 1].focus();
          // اختياري: مسح الرقم السابق عند الرجوع
          // inputs[i - 1].value = ''; 
          // inputs[i - 1].classList.remove('filled');
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        login();
      }
    });

    inp.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      const digits = text.replace(/\D/g, '').slice(0, 9);
      if (digits) setInputValue(digits);
    });
  });

  async function login() {
    const code = getCode();
    const deviceId = getDeviceId();
    const deviceName = 'Web Browser';

    if (code.length !== 9) {
      showError('لازم تدخل الـ 9 أرقام كاملة');
      return;
    }

    setLoading(true);
    errorMsg.classList.remove('show');
    warnBox.classList.remove('show');
    attemptsBox.classList.remove('show');

    try {
      const response = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, deviceId, deviceName })
      });

      const data = await response.json();

      if (data.success) {
        localStorage.setItem(LAST_CODE_KEY, code);
        localStorage.setItem('student_token', data.data.token);
        localStorage.setItem('student_name', data.data.student.name);
        
        btnText.textContent = 'تم الدخول ✓';
        btnLogin.style.background = 'linear-gradient(135deg, #10b981, #059669)';
        
        setTimeout(() => {
          window.location.href = 'subjects.html';
        }, 600);
        return;
      }

      const msg = data.message || 'كود غير صحيح';
      const attemptsMatch = msg.match(/متبقي\s+(\d+)\s+محاولات/);
      
      if (attemptsMatch) showAttempts(parseInt(attemptsMatch[1]));
      
      if (msg.includes('الحد الأقصى للأجهزة') || msg.includes('الأجهزة')) {
        warnBox.classList.add('show');
        errorMsg.classList.remove('show');
      } else {
        showError(msg);
      }

      setLoading(false);
    } catch (err) {
      showError('خطأ في الاتصال، جرب تاني');
      setLoading(false);
    }
  }

  btnLogin.addEventListener('click', login);

  init();
})();
</script>
</body>
</html>
