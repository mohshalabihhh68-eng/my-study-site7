<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b35" />
  <title>بيانات الدفع — ثانوية club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange: #ff6b35;
      --orange2: #ff8c42;
      --red: #e63946;
      --bg: #fff5f0;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --line: #f1e4dc;
      --soft: #fff0e8;
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background: linear-gradient(160deg, #fff5f0 0%, #ffe8dc 40%, #fff0e8 100%);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      max-width: 520px;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 17px;
      text-decoration: none;
      color: var(--text);
    }
    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: contain;
    }
    .brand span { color: var(--orange); font-size: 13px; font-weight: 700; }

    /* Main card */
    .wrap {
      max-width: 420px;
      margin: 10px auto 40px;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(255, 107, 53, 0.12), 0 4px 12px rgba(0,0,0,0.04);
    }

    /* Gradient header of card */
    .card-head {
      background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 50%, #ff9f5a 100%);
      height: 110px;
      position: relative;
    }
    .avatar-wrap {
      position: absolute;
      left: 50%;
      bottom: -42px;
      transform: translateX(-50%);
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #fff;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(255, 107, 53, 0.25);
    }
    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b35, #ff8c42);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 32px;
      font-weight: 900;
    }

    .card-body {
      padding: 56px 24px 28px;
      text-align: center;
    }
    .admin-name {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff0e8;
      color: var(--orange);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 99px;
      margin-bottom: 22px;
    }

    /* Number box */
    .num-box {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 16px;
    }
    .num-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .num-value {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      direction: ltr;
      margin-bottom: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .copy-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      background: linear-gradient(135deg, #ff6b35, #ff8c42);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
